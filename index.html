<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Universal Truth Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 15px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        /* Bold & Bright Colorful MEYYEE Title */
        h1 {
            font-size: 3.5rem;
            letter-spacing: 5px;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #2563eb, #7c3aed, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #64748b;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Fully Responsive Search Bar */
        .search-box {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 50px;
            padding: 6px 6px 6px 20px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .search-box:hover {
            border-color: #0284c7;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.15);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #1e293b;
            background: transparent;
            min-width: 0; /* Prevents text overflow */
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        /* Mic Button */
        .mic-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px 10px;
            margin-right: 5px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transform: rotate(0deg);
            transition: background 0.2s;
        }

        .mic-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .search-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            outline: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background-color: #0369a1;
        }

        /* Video Container */
        .video-container {
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            background: transparent;
            border: none;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            background: transparent;
        }

        .welcome-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Answer Output Display Box */
        .result-box {
            margin-top: 20px;
            width: 100%;
            max-width: 650px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 15px;
            padding: 15px;
            font-size: 1rem;
            color: #334155;
            text-align: left;
            display: none; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            h1 {
                font-size: 2.8rem;
                letter-spacing: 3px;
            }
            .search-box {
                padding: 4px 4px 4px 15px;
            }
            .search-btn {
                padding: 9px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
       <style>
   <h1 style="font-size: 4rem; letter-spacing: 6px; font-weight: 900; margin-bottom: 5px; background: linear-gradient(135deg, #FF007A, #7A00FF, #00D2FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 8px rgba(122, 0, 255, 0.25));">MEYYEE</h1>
        <div class="subtitle">Universal Truth Engine</div>

        <div class="search-box">
            <input type="text" id="userInput" class="search-input" placeholder="Ask anything or use voice...">
            <button class="mic-btn" onclick="startVoiceSearch()" title="Search by Voice">🎤</button>
            <button class="search-btn" onclick="handleSearch()">Search</button>
        </div>

        <div class="video-container">
            <video width="100%" height="100%" controls autoplay muted loop playsinline>
                <source src="myvideo.mp4.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="welcome-text">WELCOME</div>

        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Unga browser voice search-ah support panralathu. Chrome illa Edge use pannunga!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            
            recognition.onstart = function() {
                document.getElementById('userInput').placeholder = "Kelungal... Kettu kondu irukiren 🎙️";
            };

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('userInput').value = spokenText;
                document.getElementById('userInput').placeholder = "Ask anything or use voice...";
                handleSearch();
            };

            recognition.onerror = function() {
                document.getElementById('userInput').placeholder = "Ask anything or use voice...";
                alert("Voice கேட்கவில்லை, marubadiyum try pannunga.");
            };

            recognition.start();
        }

        function handleSearch() {
            const query = document.getElementById('userInput').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (query === "") {
                alert("Dhayavu seithu edhavathu kelvi kelungal!");
                return;
            }

            resultBox.style.display = "block";
            resultBox.innerHTML = `<strong>Search Query:</strong> "${query}"<br><br><strong>Meyyee Engine:</strong> Ungal kelvikuana universal truth-ah theddukirathu...`;
        }

        document.getElementById('userInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleSearch();
            }
        });
    </script>

</body>
</html>
