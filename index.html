<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Universal AI Truth Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            padding: 20px;
            overflow-y: auto;
        }

        .galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(1px 1px at 10px 10px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 20px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 30px 100px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 150px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.8;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            max-width: 650px;
            width: 100%;
        }

        .title {
            font-size: 3.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: #d1d5db;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .cloud-search-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cloud-svg-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 8px 15px rgba(255, 255, 255, 0.3));
        }

        .search-bar {
            position: relative;
            z-index: 2;
            width: 65%;
            height: 40px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            text-align: center;
        }

        .search-btn {
            position: relative;
            z-index: 3;
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
            transition: 0.3s;
        }

        .search-btn:hover {
            background: #1d4ed8;
        }

        .result-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: none;
            margin-top: 10px;
        }

        .truth-badge {
            background: #10b981;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .result-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #f1f5f9;
        }

        .category-tag {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Custom Boy Character Styling */
        .boy-wrapper {
            width: 150px;
            height: auto;
            margin-top: 10px;
        }

        .boy-img {
            width: 100%;
            height: auto;
            max-height: 190px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
            animation: gentleWave 2.5s infinite ease-in-out;
        }

        @keyframes gentleWave {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-8px) rotate(2deg);
            }
        }

        .welcome-text {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="galaxy-bg"></div>

    <div class="container">
        <h1 class="title">MEYYEE</h1>
        <p class="subtitle">UNIVERSAL TRUTH ENGINE</p>

        <div class="cloud-search-wrapper">
            <svg class="cloud-svg-bg" viewBox="0 0 400 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 45 C30 45 15 35 25 20 C35 5 60 10 75 20 C160 5 200 5 215 20 C230 5 270 5 285 20 C300 5 330 10 345 20 C360 5 385 20 375 40 C385 55 360 65 340 60 C320 65 80 65 50 45 Z" fill="#ffffff" opacity="0.95"/>
            </svg>
            <input type="text" id="userInput" class="search-bar" placeholder="Ask anything in the world..." onkeydown="if(event.key === 'Enter') executeSearch()">
            <button class="search-btn" onclick="executeSearch()">Search</button>
        </div>

        <div id="resultCard" class="result-card">
            <span id="badge" class="truth-badge">✔ MEYYEE KNOWLEDGE ENGINE</span>
            <div id="resTitle" class="result-title"></div>
            <div id="resAnswer" class="result-text"></div>
            <div id="resCategory" class="category-tag"></div>
        </div>

        <!-- Custom Boy Character Image -->
        <div class="boy-wrapper">
            <img src="boy-8643450_1280.jpg" alt="Meyyee Vanakkam Boy" class="boy-img">
        </div>

        <div class="welcome-text">WELCOME</div>
    </div>

    <script>
        const localDatabase = [
            {
                keys: ["meyyee", "meaning", "porul"],
                title: "Meyyee - Definition",
                answer: "Meyyee endral 'Unmai Koduthal' (Truth Engine) endru porul.",
                category: "Core Identity"
            },
            {
                keys: ["earth", "boomi", "shape"],
                title: "Boomiyin Vadivam",
                answer: "Boomi 'Oblate Spheroid' (Geoid) vadivam kondadhu.",
                category: "Science"
            }
        ];

        async function executeSearch() {
            const query = document.getElementById('userInput').value.trim();
            const resultCard = document.getElementById('resultCard');
            const resTitle = document.getElementById('resTitle');
            const resAnswer = document.getElementById('resAnswer');
            const resCategory = document.getElementById('resCategory');

            if (!query) {
                resultCard.style.display = "none";
                return;
            }

            resultCard.style.display = "block";
            resTitle.innerText = "Searching Meyyee Engine...";
            resAnswer.innerText = "Searching global knowledge database...";
            resCategory.innerText = "Status: Fetching Truth";

            // 1. Local Database Match Check
            const foundLocal = localDatabase.find(item => 
                item.keys.some(k => query.toLowerCase().includes(k))
            );

            if (foundLocal) {
                resTitle.innerText = foundLocal.title;
                resAnswer.innerText = foundLocal.answer;
                resCategory.innerText = "Source: Meyyee Local Core (" + foundLocal.category + ")";
                return;
            }

            // 2. Fetch Live Global Knowledge (Wikipedia Universal REST API)
            try {
                const response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.extract) {
                        resTitle.innerText = data.title;
                        resAnswer.innerText = data.extract;
                        resCategory.innerText = "Source: Meyyee Global Knowledge Engine";
                        return;
                    }
                }
            } catch (err) {
                console.log("Global fetch error:", err);
            }

            // Fallback response
            resTitle.innerText = `Search Query: "${query}"`;
            resAnswer.innerText = `"${query}" patriya spastamaana thagaval Meyyee-il illai. Sariyana keyword type seidhu search seiyavum.`;
            resCategory.innerText = "Source: Meyyee Search";
        }
    </script>
</body>
</html>
