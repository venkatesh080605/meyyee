<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>MEYYEE — Universal Truth Engine</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#111827;
}

body{
  overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

.topbar{
  width:100%;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 18px;
  position:relative;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  user-select:none;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:50%;
}

.brand-name{
  font-size:20px;
  font-weight:700;
  letter-spacing:1px;
}

.account-btn{
  border:1px solid #e5e7eb;
  background:#fff;
  padding:9px 15px;
  border-radius:22px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  transition:.2s;
}

.account-btn:hover{
  background:#f8fafc;
}

/* =========================
   MAIN
========================= */

.main{
  width:100%;
  min-height:calc(100vh - 64px);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:35px 16px 60px;
}

.hero{
  width:100%;
  max-width:900px;
  text-align:center;
}

.hero h1{
  margin:20px 0 8px;
  font-size:clamp(32px,7vw,58px);
  font-weight:800;
  letter-spacing:-2px;
}

.subtitle{
  margin:0 0 28px;
  color:#6b7280;
  font-size:15px;
}

/* =========================
   SEARCH CLOUD
========================= */

.search-section{
  width:100%;
  display:flex;
  justify-content:center;
}

.search-box{
  position:relative;
  width:100%;
  max-width:620px;
  min-width:0;
  height:100px;
}

.search-input{
  position:absolute;
  z-index:2;
  left:7%;
  right:7%;
  top:23px;
  width:86%;
  height:54px;
  border:none;
  outline:none;
  background:transparent;
  text-align:center;
  font-size:18px;
  color:#111827;
}

.search-input::placeholder{
  color:#9ca3af;
}

.cloud-outline{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.search-btn{
  position:absolute;
  z-index:3;
  right:14%;
  top:36px;
  border:none;
  background:transparent;
  cursor:pointer;
  font-size:20px;
  width:38px;
  height:32px;
}

.voice-btn{
  position:absolute;
  z-index:3;
  left:14%;
  top:36px;
  border:none;
  background:transparent;
  cursor:pointer;
  font-size:20px;
  width:38px;
  height:32px;
}

/* =========================
   CONTENT
========================= */

.content{
  width:100%;
  max-width:900px;
  margin-top:35px;
}

.welcome-video{
  width:100%;
  max-width:850px;
  display:block;
  margin:0 auto 28px;
  border-radius:18px;
  background:#f3f4f6;
}

.create-btn{
  display:block;
  margin:0 auto 30px;
  border:none;
  padding:13px 22px;
  border-radius:25px;
  background:#111827;
  color:white;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
}

.create-btn:hover{
  opacity:.9;
}

.result-card{
  width:100%;
  padding:22px;
  margin-bottom:18px;
  border:1px solid #e5e7eb;
  border-radius:18px;
  background:#fff;
  box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.result-card h2{
  margin:0 0 10px;
  font-size:21px;
}

.result-card h3{
  margin:0 0 12px;
  font-size:18px;
}

.result-card p{
  line-height:1.8;
  margin:8px 0;
}

.kural{
  font-size:18px;
  font-weight:600;
}

.meaning{
  color:#4b5563;
}

/* =========================
   MODALS
========================= */

.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.45);
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  padding:26px;
  box-shadow:0 25px 70px rgba(0,0,0,.2);
  position:relative;
}

.close-btn{
  position:absolute;
  right:15px;
  top:13px;
  border:none;
  background:transparent;
  font-size:25px;
  cursor:pointer;
  color:#6b7280;
}

/* =========================
   ACCOUNT
========================= */

.account-title{
  text-align:center;
  margin:5px 0 8px;
  font-size:25px;
}

.account-subtitle{
  text-align:center;
  color:#6b7280;
  font-size:14px;
  line-height:1.6;
  margin-bottom:22px;
}

.google-btn,
.guest-btn,
.logout-btn{
  width:100%;
  height:48px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  margin-top:12px;
}

.google-btn{
  background:#fff;
  border:1px solid #d1d5db;
  color:#111827;
}

.guest-btn{
  background:#111827;
  border:1px solid #111827;
  color:#fff;
}

.logout-btn{
  background:#fff;
  border:1px solid #e5e7eb;
  color:#374151;
}

.google-btn:hover,
.guest-btn:hover,
.logout-btn:hover{
  opacity:.9;
}

.account-status{
  text-align:center;
  padding:15px;
  border-radius:14px;
  background:#f8fafc;
  margin:18px 0;
  line-height:1.6;
  word-break:break-word;
}

.account-status strong{
  display:block;
  margin-bottom:5px;
}

/* =========================
   WEBSITE BUILDER
========================= */

.builder-title{
  margin:0 0 18px;
  text-align:center;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
  font-weight:600;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

.form-group textarea{
  min-height:140px;
  resize:vertical;
}

.build-submit{
  width:100%;
  border:none;
  background:#111827;
  color:white;

  border-radius:11px;
  cursor:pointer;
  font-weight:600;

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  }

  .result-card p{
    font-size:15px;
  }

  .modal{
    padding:22px 18px;
    border-radius:18px;
  }
}
</style>

let currentUser = null;


/* =========================
   ACCOUNT UI
========================= */

function openAccount(){
  updateAccountUI();
  document.getElementById("accountModal").classList.add("show");
}

function closeAccount(){
  document.getElementById("accountModal").classList.remove("show");
}

function updateAccountUI(){

  const loggedOut =
    document.getElementById("accountLoggedOut");

  const loggedIn =
    document.getElementById("accountLoggedIn");

  const status =
    document.getElementById("accountStatus");

  if(!currentUser){

    loggedOut.style.display = "block";
    loggedIn.style.display = "none";
    return;
  }

  loggedOut.style.display = "none";
  loggedIn.style.display = "block";

  const isGuest =
    currentUser.is_anonymous === true ||
    currentUser.app_metadata?.provider === "anonymous";

  if(isGuest){

    status.innerHTML = `
      <strong>👤 Guest Account</strong>
      You are using Meyyee as a guest.<br>
      Guest accounts are normally tied to this browser/device.
    `;

  }else{

    const email =
      currentUser.email || "Google Account";

    status.innerHTML = `
      <strong>🌐 Google Account</strong>
      ${escapeHTML(email)}
    `;
  }
}


/* =========================
   GOOGLE LOGIN
========================= */

async function continueWithGoogle(){

  try{

    /*
      If the current user is an anonymous guest,
      try to link that guest account to Google.
      This helps preserve the guest user's account/data.
    */

    if(currentUser){

      const isGuest =
        currentUser.is_anonymous === true ||
        currentUser.app_metadata?.provider === "anonymous";

      if(isGuest){

        const { error } =
          await supabaseClient.auth.linkIdentity({
            provider:"google",
            options:{
              redirectTo:window.location.origin
            }
          });

        if(error){
          console.error(error);

          /*
            If linking is not available,
            continue with normal Google sign-in.
          */
          await normalGoogleLogin();
        }

        return;
      }
    }

    await normalGoogleLogin();

  }catch(error){

    console.error(error);

    alert(
      "Google login could not be started. Please try again."
    );
  }
}


async function normalGoogleLogin(){

  const { error } =
    await supabaseClient.auth.signInWithOAuth({

      provider:"google",

      options:{
        redirectTo:window.location.origin
      }

    });

  if(error){
    throw error;
  }
}


/* =========================
   GUEST LOGIN
========================= */

async function continueAsGuest(){

  try{

    /*
      If already using a guest account,
      don't create another guest account.
    */

    if(currentUser){

      const isGuest =
        currentUser.is_anonymous === true ||
        currentUser.app_metadata?.provider === "anonymous";

      if(isGuest){
        closeAccount();
        return;
      }
    }

    const { data, error } =
      await supabaseClient.auth.signInAnonymously();

    if(error){
      throw error;
    }

    currentUser = data.user;

    updateAccountUI();

    closeAccount();

  }catch(error){

    console.error(error);

    alert(
      "Guest account could not be created. Please check that Anonymous Sign-ins are enabled in Supabase."
    );
  }
}


/* =========================
   LOGOUT
========================= */

async function logoutAccount(){

  try{

    const { error } =
      await supabaseClient.auth.signOut();

    if(error){
      throw error;
    }

    currentUser = null;

    updateAccountUI();

    closeAccount();

  }catch(error){

    console.error(error);

    alert("Logout failed. Please try again.");
  }
}


/* =========================
   CHECK SESSION
========================= */

async function loadCurrentUser(){

  try{

    const { data, error } =
      await supabaseClient.auth.getSession();

    if(error){
      console.error(error);
      return;
    }

    currentUser =
      data.session?.user || null;

    updateAccountUI();

  }catch(error){

    console.error(error);
  }
}

   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
  (_event, session) => {

    currentUser =
      session?.user || null;

    updateAccountUI();

  }
);

/* =========================
   VOICE SEARCH
========================= */

function voiceSearch(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice search is not supported in this browser."
    );

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult =
    function(event){

      const text =
        event.results[0][0].transcript;

      searchInput.value = text;

      performSearch();

    };

  recognition.onerror =
    function(){

      alert("Voice search could not be completed.");
    };

  recognition.start();
}


/* =========================
   WEBSITE BUILDER
========================= */

function openWebsiteBuilder(){

  if(!currentUser){

    openAccount();

    alert(
      "Please continue with Google or Guest first."
    );

    return;
  }

  document
    .getElementById("builderModal")
    .classList.add("show");
}


function closeWebsiteBuilder(){

  document
    .getElementById("builderModal")
    .classList.remove("show");
}


function createWebsite(){

  const title =
    document.getElementById("siteTitle").value.trim();

  const content =
    document.getElementById("siteContent").value.trim();

  const theme =
    document.getElementById("siteTheme").value;

  if(!title){

    alert("Please enter a website title.");

    return;
  }

  if(!content){

    alert("Please enter website content.");

    return;
  }

  /*
    Current version creates a preview locally.
    Database/public website storage can be connected
    in the next step using Supabase.
  */

  const newWindow =
    window.open("", "_blank");

  if(!newWindow){

    alert(
      "Please allow pop-ups for Meyyee."
    );

    return;
  }

  const background =
    theme === "dark"
      ? "#111827"
      : "#ffffff";

  const foreground =
    theme === "dark"
      ? "#ffffff"
      : "#111827";

  newWindow.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

      <title>${escapeHTML(title)}</title>

      <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
      >

      <style>

        body{
          margin:0;
          padding:40px 20px;
          background:${background};
          color:${foreground};
          font-family:Arial,sans-serif;
        }

        main{
          max-width:900px;
          margin:auto;
        }

        h1{
          font-size:42px;
        }

        p{
          font-size:18px;
          line-height:1.8;
          white-space:pre-wrap;
        }

      </style>

    </head>

    <body>

      <main>

        <h1>${escapeHTML(title)}</h1>

        <p>${escapeHTML(content)}</p>

      </main>

    </body>

    </html>

  `);

  newWindow.document.close();

  closeWebsiteBuilder();
}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
