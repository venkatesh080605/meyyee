<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Meyyee - Universal Truth Engine</title>

<link rel="manifest" href="/manifest.json">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    background:#ffffff;
    color:#111827;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    min-height:100vh;
    padding:40px 15px;
}

/* =========================
   TOP NAVIGATION
========================= */

.top-nav{
    position:absolute;
    top:15px;
    right:25px;
    display:flex;
    gap:10px;
    align-items:center;
    z-index:10;
}

.nav-btn{
    background:#f1f5f9;
    border:1px solid #cbd5e1;
    padding:8px 16px;
    border-radius:20px;
    cursor:pointer;
    font-weight:600;
    color:#334155;
}

.nav-btn:hover{
    background:#e2e8f0;
}

.account-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:9px 16px;
    border-radius:20px;
    cursor:pointer;
    font-weight:600;
}

.account-btn:hover{
    background:#1d4ed8;
}

/* =========================
   MAIN
========================= */

.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:800px;
    margin-top:20px;
}

/* =========================
   SEARCH SECTION
========================= */

.search-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    margin-top:5vh;
}

body.searched .search-section{
    margin-top:0;
    flex-direction:row;
    justify-content:flex-start;
    align-items:center;
    gap:20px;
    border-bottom:1px solid #e2e8f0;
    padding-bottom:20px;
    width:100%;
    max-width:900px;
}

h1{
    font-size:3.8rem;
    letter-spacing:6px;
    font-weight:900;
    margin-bottom:5px;

    background:linear-gradient(
        90deg,
        #ff0000,
        #ff7f00,
        #ffff00,
        #008000,
        #0000ff,
        #4b0082,
        #ee82ee
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

body.searched h1{
    font-size:2rem;
    letter-spacing:3px;
    margin-bottom:0;
}

.subtitle{
    font-size:.9rem;
    letter-spacing:2px;
    color:#64748b;
    margin-bottom:35px;
    text-transform:uppercase;
}

body.searched .subtitle{
    display:none;
}


/* =====================================================
   MEYYEE CLOUD SEARCH BAR
   THIS IS THE IMPORTANT PART
===================================================== */

.search-box{
    position:relative;

    width:min(620px, 92vw);
    height:100px;

    margin-bottom:30px;

    display:flex;
    align-items:center;

    background:transparent;

    border:none;
    border-radius:0;

    padding:25px 38px 25px 48px;
}


/* CLOUD SVG */

.cloud-outline{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;
    overflow:visible;
}


/* colourful hand-drawn cloud line */

.cloud-outline path{
    fill:rgba(255,255,255,.65);

    stroke:url(#cloudGradient);

    stroke-width:3.2;

    stroke-linecap:round;
    stroke-linejoin:round;

    filter:
        drop-shadow(0 4px 8px rgba(37,99,235,.12));
}


/* SEARCH INPUT */

.search-input{
    position:relative;
    z-index:2;

    flex:1;

    width:100%;
    min-width:0;

    border:none;
    outline:none;

    background:transparent;

    font-size:1.05rem;
    color:#1e293b;

    padding:8px 10px;

    autocomplete:off;
}


/* DO NOT SHOW EMAIL IN SEARCH */

.search-input::placeholder{
    color:#64748b;
    opacity:1;
}


/* BUTTONS */

.mic-btn,
.search-btn{
    position:relative;
    z-index:3;

    background:transparent;
    border:none;
    outline:none;

    font-size:1.25rem;

    cursor:pointer;

    padding:8px 10px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    transition:transform .2s;
}

.mic-btn:hover,
.search-btn:hover{
    transform:scale(1.15);
}


/* SEARCHED VERSION */

body.searched .search-box{
    margin-bottom:0;
    width:min(500px, 60vw);
    height:70px;
    padding:17px 28px 17px 34px;
}

body.searched .search-input{
    font-size:1rem;
}


/* =========================
   WELCOME
========================= */

#welcomeSection{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
}

.video-container{
    width:150px;
    height:150px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:5px;
}

.video-container video{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:15px;
}

.welcome-text{
    font-size:1.3rem;
    font-weight:bold;
    color:#0f172a;

    letter-spacing:2px;

    margin-top:5px;
    margin-bottom:20px;
}


/* =========================
   INTRO
========================= */

#intro-animation{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    background:#fff;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:9999;

    overflow:hidden;

    transition:opacity .5s ease;
}

.anim-wrapper{
    position:relative;

    width:300px;
    height:350px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.piece{
    position:absolute;

    width:150px;
    height:150px;

    background-image:url('/launchericon-512x512.png');

    background-size:300px 300px;
    background-repeat:no-repeat;

    opacity:0;

    transition:
        transform 3s cubic-bezier(.1,.9,.2,1),
        opacity 1s ease;
}

.piece-tl{
    top:0;
    left:0;
    background-position:0 0;
    transform:translate(-60vw,-60vh) rotate(-45deg);
}

.piece-tr{
    top:0;
    right:0;
    background-position:-150px 0;
    transform:translate(60vw,-60vh) rotate(45deg);
}

.piece-bl{
    bottom:50px;
    left:0;
    background-position:0 -150px;
    transform:translate(-60vw,60vh) rotate(45deg);
}

.piece-br{
    bottom:50px;
    right:0;
    background-position:-150px -150px;
    transform:translate(60vw,60vh) rotate(-45deg);
}

.anim-title{
    position:absolute;
    bottom:-5px;

    font-size:40px;
    font-weight:900;

    letter-spacing:6px;

    background:linear-gradient(
        90deg,
        #ff0000,
        #ff7f00,
        #ffff00,
        #008000,
        #0000ff,
        #4b0082,
        #ee82ee
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    opacity:0;
    transform:translateY(20px);

    transition:
        opacity .8s ease 2.2s,
        transform .8s ease 2.2s;
}

#intro-animation.animate .piece{
    transform:translate(0,0) rotate(0);
    opacity:1;
}

#intro-animation.animate .anim-title{
    opacity:1;
    transform:translateY(0);
}


/* =========================
   RESULTS
========================= */

#resultContainer{
    width:100%;
    max-width:680px;

    display:flex;
    flex-direction:column;

    gap:20px;

    margin-top:25px;
}

.result-box{
    width:100%;

    background:linear-gradient(
        135deg,
        #f4e8c1 0%,
        #e6d39e 100%
    );

    border:2px solid #8b5a2b;

    border-radius:8px;

    padding:25px;

    font-size:1.05rem;

    color:#2c1d0c;

    text-align:left;

    box-shadow:
        0 8px 25px rgba(139,90,43,.25);
}

.board-title{
    text-align:center;

    color:#78350f;

    font-size:1.25rem;
    font-weight:bold;

    margin-bottom:12px;

    border-bottom:1px dashed #8b5a2b;

    padding-bottom:8px;
}

.kural-lines{
    font-weight:bold;

    color:#451a03;

    font-size:1.15rem;

    line-height:1.6;

    text-align:center;

    margin-bottom:15px;
}

.meaning-box{
    color:#2c1d0c;

    line-height:1.7;

    background:rgba(255,255,255,.4);

    padding:12px;

    border-radius:6px;
}


/* =========================
   WEBSITE CARD
========================= */

.user-website-card{
    width:100%;

    border-radius:12px;

    padding:30px;

    box-shadow:0 10px 30px rgba(0,0,0,.1);

    text-align:center;

    margin-top:15px;
}


/* =========================
   MODAL
========================= */

.modal-overlay{
    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.5);

    justify-content:center;
    align-items:center;

    z-index:1000;

    padding:12px;
}

.modal-content{
    background:#fff;

    padding:30px;

    border-radius:12px;

    width:100%;
    max-width:500px;

    text-align:left;

    box-shadow:0 15px 35px rgba(0,0,0,.2);

    max-height:90vh;

    overflow-y:auto;
}

.modal-content h3{
    margin-bottom:20px;
    color:#1e293b;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;

    font-size:.9rem;
    font-weight:600;

    color:#475569;

    margin-bottom:5px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;

    padding:10px;

    border:1px solid #cbd5e1;

    border-radius:6px;

    font-size:1rem;

    outline:none;
}

.form-group textarea{
    resize:vertical;
    height:100px;
}

.modal-actions{
    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:20px;

    flex-wrap:wrap;
}

.btn-primary{
    background:#2563eb;

    color:white;

    border:none;

    padding:10px 20px;

    border-radius:6px;

    cursor:pointer;

    font-weight:600;
}

.btn-secondary{
    background:#e2e8f0;

    color:#334155;

    border:none;

    padding:10px 20px;

    border-radius:6px;

    cursor:pointer;

}


/* =========================
   AUTH
========================= */

.auth-tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.auth-tab{
    flex:1;

    padding:10px;

    border:1px solid #cbd5e1;

    background:#f8fafc;

    border-radius:8px;

    cursor:pointer;

    font-weight:600;
}

.auth-tab.active{
    background:#2563eb;
    color:white;
    border-color:#2563eb;
}

.auth-message{
    margin-top:15px;

    padding:10px;

    border-radius:7px;

    display:none;

    font-size:.9rem;
}

.auth-message.success{
    display:block;

    background:#dcfce7;
    color:#166534;
}

.auth-message.error{
    display:block;

    background:#fee2e2;
    color:#991b1b;
}

.user-info{
    background:#eff6ff;

    padding:12px;

    border-radius:8px;

    margin-bottom:15px;

    color:#1e40af;

    word-break:break-word;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:68px 10px 30px;
    }

    .top-nav{
        top:12px;

        left:10px;
        right:10px;

        justify-content:flex-end;

        gap:6px;
    }

    .nav-btn,
    .account-btn{
        padding:7px 9px;

        font-size:.74rem;

        white-space:nowrap;
    }

    .container{
        width:100%;
        margin-top:0;
    }

    .search-section{
        width:100%;
        margin-top:7vh;
    }

    h1{
        font-size:clamp(2.5rem,13vw,3.8rem);

        letter-spacing:4px;

        line-height:1.1;

        white-space:nowrap;
    }

    .subtitle{
        font-size:.70rem;

        letter-spacing:1.5px;

        margin-bottom:25px;
    }


    /* MOBILE CLOUD */

    .search-box{
        width:96vw;

        max-width:620px;

        height:82px;

        padding:19px 25px 19px 32px;

        margin-bottom:25px;
    }

    .search-input{
        font-size:16px;

        padding:7px 5px;
    }

    .mic-btn,
    .search-btn{
        width:34px;
        height:34px;

        padding:4px;

        font-size:1rem;
    }


    /* SEARCHED MOBILE */

    body.searched .search-section{
        width:100%;

        gap:7px;

        padding-bottom:12px;
    }

    body.searched .search-section > div:first-child{
        flex-shrink:0;
    }

    body.searched h1{
        font-size:1.25rem;

        letter-spacing:2px;
    }

    body.searched .search-box{
        flex:1;

        width:auto;

        height:58px;

        max-width:none;

        padding:12px 17px 12px 20px;
    }

    body.searched .search-input{
        font-size:15px;
    }

    body.searched .mic-btn,
    body.searched .search-btn{
        width:30px;
        height:30px;

        font-size:.9rem;
    }


    .video-container{
        width:130px;
        height:130px;
    }

    .welcome-text{
        font-size:1.05rem;

        letter-spacing:1.5px;
    }

    #resultContainer{
        width:100%;

        margin-top:18px;

        gap:15px;
    }

    .result-box{
        padding:18px 14px;

        font-size:.95rem;

        overflow-wrap:break-word;
    }

    .board-title{
        font-size:1.05rem;
        line-height:1.4;
    }

    .kural-lines{
        font-size:1rem;
        line-height:1.7;
    }

    .meaning-box{
        font-size:.92rem;
        line-height:1.65;
        padding:10px;
    }

    .modal-content{
        padding:20px 16px;
    }

}


@media(max-width:380px){

    body{
        padding-left:8px;
        padding-right:8px;
    }

    h1{
        font-size:2.4rem;
        letter-spacing:3px;
    }

    .subtitle{
        font-size:.62rem;
    }

    .search-box{
        width:97vw;
        height:76px;

        padding:17px 21px 17px 27px;
    }

    body.searched h1{
        font-size:1.1rem;
    }

    body.searched .search-section{
        gap:5px;
    }

}

</style>
</head>

<script>

/* =========================

========================= */

async function signupUser(){

    const email =
        document.getElementById(
            "authEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "authPassword"
        ).value;


    if(!email || !password){

        showAuthMessage(
            "Please enter email and password.",
            "error"
        );

        return;

    }


    if(password.length<6){

        showAuthMessage(
            "Password must contain at least 6 characters.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "authSubmitButton"
        );

    button.disabled=true;
    button.textContent="Creating...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{
                emailRedirectTo:
                    "https://meyyee.site"
            }

        });


        if(error){

            showAuthMessage(
                error.message,
                "error"
            );

            return;

        }


        if(data.user && !data.session){

            showAuthMessage(
                "Account created! Please check your email and confirm your account before logging in.",

            currentUser=data.user;

            updateAccountButton();
            updateAccountModal();

                "Account created successfully!",
                "success"

        console.error(error);

            "Something went wrong. Please try again.",
            "error"

            "Login successful!",

            "Login failed. Please try again.",

    const recognition =
        new SpeechRecognition();

    recognition.onstart=function(){

        document.getElementById(
            "userInput"

            "Listening... Speak now 🎙️";
