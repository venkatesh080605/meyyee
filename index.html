<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Independent Truth Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            padding: 20px;
            overflow-y: auto;
        }

        .galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(1px 1px at 10px 10px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 20px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 30px 100px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 150px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.8;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            max-width: 650px;
            width: 100%;
        }

        .title {
            font-size: 3.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: #d1d5db;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .cloud-search-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cloud-svg-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 8px 15px rgba(255, 255, 255, 0.3));
        }

        .search-bar {
            position: relative;
            z-index: 2;
            width: 65%;
            height: 40px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            text-align: center;
        }

        .search-btn {
            position: relative;
            z-index: 3;
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
            transition: 0.3s;
        }

        .search-btn:hover {
            background: #1d4ed8;
        }

        .result-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: none;
            margin-top: 10px;
        }

        .truth-badge {
            background: #10b981;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .result-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #f1f5f9;
        }

        .category-tag {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .boy-wrapper {
            width: 130px;
            height: 160px;
            margin-top: 10px;
        }

        #boy-head {
            transform-origin: 100px 115px;
            animation: bowAnimation 3s infinite ease-in-out;
        }

        @keyframes bowAnimation {
            0%, 100% { transform: rotate(0deg) translateY(0px); }
            50% { transform: rotate(12deg) translateY(6px); }
        }

        .welcome-text {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="galaxy-bg"></div>

    <div class="container">
        <h1 class="title">MEYYEE</h1>
        <p class="subtitle">INDEPENDENT TRUTH ENGINE</p>

        <div class="cloud-search-wrapper">
            <svg class="cloud-svg-bg" viewBox="0 0 400 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 45 C30 45 15 35 25 20 C35 5 60 10 75 20 C90 5 130 5 145 20 C230 5 270 5 285 20 C300 5 330 10 345 20 C360 5 385 20 375 40 C385 55 360 65 340 60 C320 65 80 65 50 45 Z" fill="#ffffff" opacity="0.95"/>
            </svg>
            <input type="text" id="userInput" class="search-bar" placeholder= SearchTruth onkeypress="handleKeyPress(event)">
            <button class="search-btn" onclick="executeSearch()">Search</button>
        </div>

        <div id="resultCard" class="result-card">
            <span id="badge" class="truth-badge">✔ MEYYEE INDEPENDENT DATA</span>
            <div id="resTitle" class="result-title"></div>
            <div id="resAnswer" class="result-text"></div>
            <div id="resCategory" class="category-tag"></div>
        </div>

        <div class="boy-wrapper">
            <svg viewBox="0 0 200 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <path d="M70 140 L130 140 L135 210 L65 210 Z" fill="#2563eb" />
                <path d="M75 210 L95 210 L95 240 L75 240 Z" fill="#1e293b" />
                <path d="M105 210 L125 210 L125 240 L105 240 Z" fill="#1e293b" />
                <path d="M85 150 L100 130 L115 150 L105 170 L95 170 Z" fill="#fca5a5" /> 
                <path d="M98 130 L102 130 L102 155 L98 155 Z" fill="#f87171" />
                <g id="boy-head">
                    <rect x="92" y="105" width="16" height="15" fill="#fca5a5" />
                    <circle cx="100" cy="80" r="30" fill="#fca5a5" />
                    <path d="M70 75 C70 45 130 45 130 75 C120 55 80 55 70 75 Z" fill="#1c1917" />
                    <circle cx="90" cy="80" r="3" fill="#000" />
                    <circle cx="110" cy="80" r="3" fill="#000" />
                    <path d="M92 92 Q100 100 108 92" stroke="#000" stroke-width="2" fill="none" />
                </g>
            </svg>
        </div>

        <div class="welcome-text">WELCOME</div>
    </div>

    <script>
        // Meyyee Local Knowledge Database
        const meyyeeDatabase = [
            {
                keys: ["meyyee", "meaning", "porul", "about"],
                title: "Meyyee - Definition",
                answer: "Meyyee endral 'Unmai Koduthal' (Truth Engine) endru porul. Idhu purely independent-aagavae seyalpadum.",
                category: "Core Identity"
            },
            {
                keys: ["earth", "boomi", "shape", "geoid"],
                title: "Boomiyin Vadivam",
                answer: "Boomi muzhu urundai illai, adhu 'Oblate Spheroid' (Geoid) vadivam kondadhu.",
                category: "Science & Astronomy"
            },
            {
                keys: ["sun", "sooriyan", "light"],
                title: "Sooriya Oli",
                answer: "Sooryanilirundhu purappadum oli boomiyai adaiya thoraayamaaga 8 nimidam 20 vinadigal aagum.",
                category: "Astronomy"
            },
            {
                keys: ["water", "theer", "tanneer", "h2o"],
                title: "Thanneer (Water) Formula",
                answer: "Thanneerukku 'H2O' enru peyar. Irandu Hydrogen matrum oru Oxygen anukkal serndhadhu.",
                category: "Chemistry"
            },
            {
                keys: ["tamil", "mozhi", "language"],
                title: "Tamil Language",
                answer: "Tamil ulagin mighavum tholmanamana matrum ippodhum vaazhum dravida mozhigalil ondru.",
                category: "Culture & Language"
            },
            {
                keys: ["thirukkural", "kural", "thiruvalluvar"],
                title: "Thirukkural",
                answer: "Thirukkuralil மொத்தம் 1330 குறள்கள், 133 அதிகாரங்கள் உள்ளன. Ezhudhiyavar Thiruvalluvar.",
                category: "Literature"
            }
        ];

        function handleKeyPress(e) {
            if (e.key === 'Enter') executeSearch();
        }

        function executeSearch() {
            const query = document.getElementById('userInput').value.toLowerCase().trim();
            const resultCard = document.getElementById('resultCard');
            const resTitle = document.getElementById('resTitle');
            const resAnswer = document.getElementById('resAnswer');
            const resCategory = document.getElementById('resCategory');

            if (!query) {
                resultCard.style.display = "none";
                return;
            }

            // Keyword Matching Algorithm
            const found = meyyeeDatabase.find(item => 
                item.keys.some(k => query.includes(k))
            );

            resultCard.style.display = "block";

            if (found) {
                resTitle.innerText = found.title;
                resAnswer.innerText = found.answer;
                resCategory.innerText = "Category: " + found.category;
            } else {
                resTitle.innerText = "Meyyee Offline Engine";
                resAnswer.innerText = `"${query}" patriya unmai thagaval Meyyee-in சொந்த Database-il ippodhu illai. Pudhiya thagavalgalai database-il add panni Meyyee-ai innum valarchiyadaiya seiyalaam.`;
                resCategory.innerText = "Category: Database Missing";
            }
        }
    </script>
</body>
</html>
