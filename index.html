<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Thirukooral Universal Truth Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0284c7 0%, #10b981 100%);
            color: #111827; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 900px;
        }

        /* Top Banner with Murugan, Karuthinan (Krishna) and Green Design */
        .top-banner-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
            position: relative;
        }

        .god-image {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        /* Green Theme Banner Design */
        .green-banner {
            background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%);
            border: 3px solid #10b981;
            border-radius: 15px;
            padding: 12px 25px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            flex-grow: 1;
            margin: 0 15px;
        }

        .green-banner h2 {
            color: #fef08a;
            font-size: 2.2rem;
            letter-spacing: 2px;
            font-weight: 800;
            margin-bottom: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        .green-banner p {
            color: #e2e8f0;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Bold & Bright Colorful MEYYEE Title */
        h1 {
            font-size: 3rem;
            letter-spacing: 4px;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ffffff, #fef08a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #f1f5f9;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Fully Responsive Search Bar */
        .search-box {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 2px solid #34d399;
            border-radius: 50px;
            padding: 6px 6px 6px 20px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .search-box:hover {
            border-color: #059669;
            box-shadow: 0 4px 20px rgba(5, 150, 105, 0.25);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #1e293b;
            background: transparent;
            min-width: 0;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        /* Mic Button */
        .mic-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px 10px;
            margin-right: 5px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .mic-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .search-btn {
            background-color: #059669;
            color: white;
            border: none;
            outline: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background-color: #047857;
        }

        /* Video Container */
        .video-container {
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            background: transparent;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            background: transparent;
        }

        .welcome-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
            margin-top: 5px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        /* Palm Leaf (Olai Chuvadi) Design Box */
        .result-box {
            margin-top: 25px;
            width: 100%;
            max-width: 750px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 3px solid #78350f;
            border-radius: 10px;
            padding: 25px;
            font-size: 1.05rem;
            color: #2c1d0c;
            text-align: left;
            display: none; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 30px, rgba(120, 53, 15, 0.08) 30px, rgba(120, 53, 15, 0.08) 31px);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .top-banner-wrapper {
                flex-direction: column;
                gap: 10px;
            }
            .green-banner {
                width: 100%;
            }
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Banner with Murugan (Left), Green Banner (Center), Karuthinan/Krishna (Right) -->
        <div class="top-banner-wrapper">
            <!-- Left: Murugan -->
            <img src="https://i.ibb.co/3m3v7s0/murugan.png" alt="Murugan" class="god-image" onerror="this.src='https://cdn-icons-png.flaticon.com/512/4215/4215239.png'">
            
            <!-- Center: Green Design Banner with Thirukooral -->
            <div class="green-banner">
                <h2>திருக்கூறல்</h2>
                <p>ஆசீவிக முறையில் துல்லியமான தெளிவுரை</p>
            </div>

            <!-- Right: Karuthinan (Krishna) -->
            <img src="https://i.ibb.co/6y45Z0q/krishna.png" alt="Karuthinan" class="god-image" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3593/3593455.png'">
        </div>

        <h1>MEYYEE</h1>
        <div class="subtitle">Universal Truth Engine</div>

        <div class="search-box">
            <input type="text" id="userInput" class="search-input" placeholder="கூறல் எண் அல்லது வரிகளைத் தேடுங்கள் (எ.கா: 1, 2, 3)...">
            <button class="mic-btn" onclick="startVoiceSearch()" title="Search by Voice">🎤</button>
            <button class="search-btn" onclick="handleSearch()">தேடுக</button>
        </div>

        <div class="video-container">
            <video autoplay muted loop playsinline>
                <source src="myvideo.mp4.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="welcome-text">WELCOME</div>

        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Unga browser voice search-ah support panralathu. Chrome illa Edge use pannunga!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ta-IN'; // Tamil support
            
            recognition.onstart = function() {
                document.getElementById('userInput').placeholder = "கேளுங்கள்... கேட்டுக் கொண்டிருக்கிறேன் 🎙️";
            };

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('userInput').value = spokenText;
                document.getElementById('userInput').placeholder = "கூறல் எண் அல்லது வரிகளைத் தேடுங்கள்...";
                handleSearch();
            };

            recognition.onerror = function() {
                document.getElementById('userInput').placeholder = "கூறல் எண் அல்லது வரிகளைத் தேடுங்கள்...";
                alert("Voice கேட்கவில்லை, மறுபடியும் முயற்சிக்கவும்.");
            };

            recognition.start();
        }

        function handleSearch() {
            const query = document.getElementById('userInput').value.trim().toLowerCase();
            const resultBox = document.getElementById('resultBox');

            if (query === "") {
                alert("தயவுசெய்து எதாவது கூறல் எண் அல்லது வரிகளை உள்ளிடவும்!");
                return;
            }

            resultBox.style.display = "block";
            
            // Checking for Kural / Kooral 1, 2, 3 or related texts
            if (query.includes("1") || query.includes("அகர") || query.includes("mudhal")) {
                resultBox.innerHTML = `
                    <div style="text-align: center; color: #78350f; font-size: 1.25rem; font-weight: bold; margin-bottom: 12px; border-bottom: 1px dashed #78350f; padding-bottom: 8px;">📜 கூறல் எண்: 1 - கடவுள் வாழ்த்து</div>
                    <div style="font-weight: bold; color: #451a03; font-size: 1.15rem; line-height: 1.6; text-align: center; margin-bottom: 15px;">
                        அகர முதல எழுத்தெல்லாம் ஆதி<br>
                        பகவன் முதற்றே உலகு.
                    </div>
                    <div style="color: #2c1d0c; line-height: 1.7; background: rgba(255, 255, 255, 0.4); padding: 12px; border-radius: 6px;">
                        <strong>தெளிவுரை:</strong> அகரத்தை முதன்மையாக கொண்டுள்ள எழுத்துமுறை அனைத்திற்கும் சிவனின் சித்திரையே முதன்மையாக ஆனது.
                    </div>
                `;
            } else if (query.includes("2") || query.includes("கற்றதனால்") || query.includes("வாலறிவன்")) {
                resultBox.innerHTML = `
                    <div style="text-align: center; color: #78350f; font-size: 1.25rem; font-weight: bold; margin-bottom: 12px; border-bottom: 1px dashed #78350f; padding-bottom: 8px;">📜 கூறல் எண்: 2</div>
                    <div style="font-weight: bold; color: #451a03; font-size: 1.15rem; line-height: 1.6; text-align: center; margin-bottom: 15px;">
                        கற்றதனால் ஆய பயனென்கொல் வாலறிவன்<br>
                        நற்றாள் தொழாஅர் எனின்.
                    </div>
                    <div style="color: #2c1d0c; line-height: 1.7; background: rgba(255, 255, 255, 0.4); padding: 12px; border-radius: 6px;">
                        <strong>தெளிவுரை:</strong> முருகனின் நல்ல பாதங்களை தொழாதவர் படித்ததனால் உண்டாகிய பயன்தான் என்னச் சொல். இங்கு வாலறிவன் என்பது முருகனை குறிக்கும்.
                    </div>
                `;
            } else if (query.includes("3") || query.includes("மலர்மிசை") || query.includes("நிலமிசை")) {
                resultBox.innerHTML = `
                    <div style="text-align: center; color: #78350f; font-size: 1.25rem; font-weight: bold; margin-bottom: 12px; border-bottom: 1px dashed #78350f; padding-bottom: 8px;">📜 கூறல் எண்: 3</div>
                    <div style="font-weight: bold; color: #451a03; font-size: 1.15rem; line-height: 1.6; text-align: center; margin-bottom: 15px;">
                        மலர்மிசை ஏகினான் மானடி சேர்ந்தார்<br>
                        நிலமிசை நீடுவாழ் வார்.
                    </div>
                    <div style="color: #2c1d0c; line-height: 1.7; background: rgba(255, 255, 255, 0.4); padding: 12px; border-radius: 6px;">
                        <strong>தெளிவுரை:</strong> பிரம்மனாகிய முருகனின் அடிகளை சேர்ந்தவர் தான் இந்த நிலத்தின் மீது நீண்ட காலம் வாழ்வார். இங்கு மலர்மிசை ஏகினான் என்பது தாமரை மலர் மீது வீற்றிருக்கும் பிரம்மாவை குறிக்கும் பிரம்மா என்றால் முருகனை குறிக்கும்.
                    </div>
                `;
            } else {
                resultBox.innerHTML = `
                    <strong>தேடல் முடிவு:</strong> "${query}"<br><br>
                    <strong>Meyyee Engine:</strong> உங்களுக்கான திருக்கூறல் உண்மைகள் தேடப்படுகின்றன...
                `;
            }
        }

        document.getElementById('userInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleSearch();
            }
        });
    </script>

</body>
</html>
