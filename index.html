<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Universal Truth Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-top: 30px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        /* Bold & Bright Colorful MEYYEE Title */
        h1 {
            font-size: 3.5rem;
            letter-spacing: 5px;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #2563eb, #7c3aed, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #64748b;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Fully Responsive Search Bar */
        .search-box {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 50px;
            padding: 6px 6px 6px 20px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .search-box:hover {
            border-color: #0284c7;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.15);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #1e293b;
            background: transparent;
            min-width: 0;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        /* Mic Button */
        .mic-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px 10px;
            margin-right: 5px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .mic-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .search-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            outline: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background-color: #0369a1;
        }

        /* Video Container */
        .video-container {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            background: transparent;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            background: transparent;
        }

        .welcome-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Answer Output Display Box */
        .result-box {
            margin-top: 20px;
            width: 100%;
            max-width: 650px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 15px;
            padding: 15px;
            font-size: 1rem;
            color: #334155;
            text-align: left;
            display: none; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            h1 {
                font-size: 2.8rem;
                letter-spacing: 3px;
            }
            .search-box {
                padding: 4px 4px 4px 15px;
            }
            .search-btn {
                padding: 9px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MEYYEE</h1>
        <div class="subtitle">Universal Truth Engine</div>

        <div class="search-box">
            <input type="text" id="userInput" class="search-input" placeholder="Ask anything or use voice...">
            <button class="mic-btn" onclick="startVoiceSearch()" title="Search by Voice">🎤</button>
            <button class="search-btn" onclick="handleSearch()">Search</button>
        </div>

        <div class="video-container">
            <video autoplay muted loop playsinline>
                <source src="myvideo.mp4.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="welcome-text">WELCOME</div>

        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        // திருக்குறள் தரவுத்தளம் (தமிழ் மற்றும் ஆங்கிலம்)
        const thirukkuralDatabase = {
            1: {
                number: 1,
                tamil: {
                    line1: "அகர முதல எழுத்தெல்லாம் ஆதி",
                    line2: "பகவன் முதற்றே உலகு.",
                    exp: "எழுத்துக்கள் எல்லாம் அகரத்தை அடிப்படையாகக் கொண்டிருக்கின்றன; அதுபோல உலகம் கடவுளை அடிப்படையாகக் கொண்டுள்ளது."
                },
                english: {
                    line1: "Agara mudhala எழுத்துellam aadhi",
                    line2: "Bagavan mudhatre ulagu.",
                    exp: "As 'A' is the first of all letters, so is the eternal God the first in the world."
                }
            }
        };

        // தமிழ் எழுத்துக்களைக் கண்டறியும் வசதி
        function isTamil(text) {
            return /[\u0B80-\u0BFF]/.test(text);
        }

        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Unga browser voice search-ah support panralathu. Chrome illa Edge use pannunga!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            
            recognition.onstart = function() {
                document.getElementById('userInput').placeholder = "Kelungal... Kettu kondu irukiren 🎙️";
            };

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('userInput').value = spokenText;
                document.getElementById('userInput').placeholder = "Ask anything or use voice...";
                handleSearch();
            };

            recognition.onerror = function() {
                document.getElementById('userInput').placeholder = "Ask anything or use voice...";
                alert("Voice கேட்கவில்லை, marubadiyum try pannunga.");
            };

            recognition.start();
        }

        function handleSearch() {
            const query = document.getElementById('userInput').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (query === "") {
                alert("Dhayavu seithu edhavathu kelvi kelungal!");
                return;
            }

            resultBox.style.display = "block";
            
            let kuralNum = parseInt(query);
            
            if (!isNaN(kuralNum) && thirukkuralDatabase[kuralNum]) {
                const data = thirukkuralDatabase[kuralNum];
                
                if (isTamil(query) || !isNaN(query)) {
                    resultBox.innerHTML = `
                        <div style="text-align: center; color: #db2777; font-size: 1.2rem;"><strong>திருக்குறள் - ${data.number}</strong></div>
                        <div style="margin-top: 15px; font-weight: bold; color: #2563eb; font-size: 1.1rem; line-height: 1.6;">
                            ${data.tamil.line1}<br>
                            ${data.tamil.line2}
                        </div>
                        <div style="margin-top: 15px; color: #334155;">
                            <strong>விளக்கம்:</strong> ${data.tamil.exp}
                        </div>
                    `;
                } else {
                    resultBox.innerHTML = `
                        <div style="text-align: center; color: #db2777; font-size: 1.2rem;"><strong>Thirukkural - ${data.number}</strong></div>
                        <div style="margin-top: 15px; font-weight: bold; color: #2563eb; font-size: 1.1rem; line-height: 1.6;">
                            ${data.english.line1}<br>
                            ${data.english.line2}
                        </div>
                        <div style="margin-top: 15px; color: #334155;">
                            <strong>Meaning:</strong> ${data.english.exp}
                        </div>
                    `;
                }
            } else {
                resultBox.innerHTML = `
                    <strong>Search Query:</strong> "${query}"<br><br>
                    <strong>Meyyee Engine:</strong> உங்களுக்கான Universal Truth தேடப்படுகிறது...
                `;
            }
        }

        document.getElementById('userInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleSearch();
            }
        });
    </script>

</body>
</html>
