<body>

    <div class="container" id="mainContainer">

                <input type="text" id="siteTitleInput" placeholder="e.g., My Personal Site">
            </div>

                <label>Website Content / Description:</label>
                <textarea id="siteContentInput" placeholder="Write details about your website here..."></textarea>
            </div>
            <div class="form-group">

            </div>

    <!-- Main JavaScript Logic -->
    <script>
        // Firebase Authentication Event Listeners setup after window load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const auth = window.firebaseAuth;
                const { createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } = window.authMethods;

                if (auth) {
                    // 1. Sign Up
                    document.getElementById("signup-btn").addEventListener("click", () => {
                        const email = document.getElementById("email").value;
                        const password = document.getElementById("password").value;
                        
                        createUserWithEmailAndPassword(auth, email, password)
                            .then(() => {
                                alert("Account created successfully!");
                            })
                            .catch((error) => {
                                alert("Error: " + error.message);
                            });
                    });

                    // 2. Login
                    document.getElementById("login-btn").addEventListener("click", () => {
                        const email = document.getElementById("email").value;
                        const password = document.getElementById("password").value;
                        
                        signInWithEmailAndPassword(auth, email, password)
                            .then(() => {
                                alert("Logged in successfully!");
                            })
                            .catch((error) => {
                                alert("Error: " + error.message);
                            });
                    });

                    // 3. Google Sign-In
                    document.getElementById("google-btn").addEventListener("click", () => {
                        const provider = new GoogleAuthProvider();
                        signInWithPopup(auth, provider)
                            .then(() => {
                                alert("Google Sign-In successful!");
                            })
                            .catch((error) => {
                                alert("Error: " + error.message);
                            });
                    });
                }
            }, 1000);
        });

        function openWebsiteBuilder() {
            document.getElementById('websiteModal').style.display = 'flex';
        }

        function closeWebsiteBuilder() {
            document.getElementById('websiteModal').style.display = 'none';
        }

        function generateUserWebsite() {
            const title = document.getElementById('siteTitleInput').value.trim();
            const content = document.getElementById('siteContentInput').value.trim();
            const bgColor = document.getElementById('siteBgColor').value;
            const resultContainer = document.getElementById('resultContainer');

            if (title === "" || content === "") {
                alert("Please fill in both the title and content!");
                return;
            }

            document.body.classList.add('searched');
            document.getElementById('welcomeSection').style.display = 'none';
            closeWebsiteBuilder();

            resultContainer.innerHTML = `
                <div style="background: #e0f2fe; padding: 12px; border-radius: 8px; color: #0369a1; font-weight: bold; text-align: center; margin-bottom: 10px;">
                    🎉 Your new website has been created successfully! (Meyyee Sites Live)
                </div>
                <div class="user-website-card" style="background-color: ${bgColor}; border: 2px solid #cbd5e1;">
                    <h2>${title}</h2>
                    <hr style="margin: 15px 0; border: 0; border-top: 1px solid rgba(0,0,0,0.1);">
                    <p>${content.replace(/\n/g, '<br>')}</p>
                    <div style="margin-top: 20px; font-size: 0.85rem; color: #64748b;">
                        Published via <strong>Meyyee Universal Truth Engine</strong>
                    </div>
                </div>
            `;
        }

        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Your browser does not support voice search. Please use Chrome or Edge!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            
            recognition.onstart = function() {
                document.getElementById('userInput').placeholder = "Listening... Speak now 🎙️";
            };

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('userInput').value = spokenText;
                document.getElementById('userInput').placeholder = "Search truth";
                handleSearch();
            };

            recognition.onerror = function() {
                document.getElementById('userInput').placeholder = "Search truth";
                alert("Could not hear voice, please try again.");
            };

            recognition.start();
        }

                            <strong>தெளிவுரை:</strong> முருகனின் நல்ல பாதங்களை தொழாதவர் படித்ததனால் உண்டாகிய பயன்தான் என்னச் சொல். இங்கு வாலறிவன் என்பது முருகனை குறிக்கும்.
                        </div>
                    </div>
                `;
            } else if (query === "3") {
                resultContainer.innerHTML = `
                    <div class="result-box">
                        <div class="board-title">📜 குறள் எண்: 3</div>
                        <div class="kural-lines">
                            மலர்மிசை ஏகினான் மானடி சேர்ந்தார்<br>
                            நிலமிசை நீடுவாழ் வார்.
                        </div>
                        <div class="meaning-box">
                            <strong>தெளிவுரை:</strong> பிரம்மனாகிய முருகனின் அடிகளை சேர்ந்தவர் தான் இந்த நிலத்தின் மீது நீண்ட காலம் வாழ்வார். இங்கு மலர்மிசை ஏகினான் என்பது தாமரை மலர் மீது வீற்றிருக்கும் பிரம்மாவை குறிக்கும் பிரம்மா என்றால் முருகனை குறிக்கும்.
                        </div>
                    </div>
                `;
            } else {
                resultContainer.innerHTML = `
                    <div class="result-box" style="text-align: center; background: #fff; border: 1px solid #cbd5e1;">
                        <strong>Search Result:</strong> "${query}"<br><br>
                        <strong>Meyyee Engine:</strong> Searching for your Universal Truth...
                    </div>
                `;
            }
        }

        document.getElementById('userInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleSearch();
            }
        });
    </script>
