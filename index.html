<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Universal Truth Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-top: 30px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        /* Bold & Bright Colorful MEYYEE Title */
        h1 {
            font-size: 3.5rem;
            letter-spacing: 5px;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #2563eb, #7c3aed, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #64748b;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Fully Responsive Search Bar */
        .search-box {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 50px;
            padding: 6px 6px 6px 20px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .search-box:hover {
            border-color: #0284c7;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.15);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #1e293b;
            background: transparent;
            min-width: 0;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        /* Mic Button */
        .mic-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px 10px;
            margin-right: 5px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .mic-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .search-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            outline: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background-color: #0369a1;
        }

        /* Video Container */
        .video-container {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            background: transparent;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            background: transparent;
        }

        .welcome-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Thirukkural Olai Chuvadi (Palm Leaf) Design Box */
        .result-box {
            margin-top: 25px;
            width: 100%;
            max-width: 680px;
            background-image: url('wood.png');
            background-size: cover;
            background-position: center;
            border: 2px solid #8b5a2b;
            border-radius: 8px;
            padding: 25px;
            font-size: 1.05rem;
            color: #2c1d0c;
            text-align: left;
            display: none; 
            box-shadow: 0 8px 25px rgba(139, 90, 43, 0.25);
            position: relative;
        }
        /* Mobile Adjustments */
        @media (max-width: 480px) {
            h1 {
                font-size: 2.8rem;
                letter-spacing: 3px;
            }
            .search-box {
                padding: 4px 4px 4px 15px;
            }
            .search-btn {
                padding: 9px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MEYYEE</h1>
        <div class="subtitle">Universal Truth Engine</div>

        <div class="search-box">
            <input type="text" id="userInput" class="search-input" placeholder="Ask anything or use voice...">
            <button class="mic-btn" onclick="startVoiceSearch()" title="Search by Voice">🎤</button>
            <button class="search-btn" onclick="handleSearch()">Search</button>
        </div>

        <div class="video-container">
            <video autoplay muted loop playsinline>
                <source src="myvideo.mp4.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="welcome-text">WELCOME</div>

        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Unga browser voice search-ah support panralathu. Chrome illa Edge use pannunga!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            
            recognition.onstart = function() {
                document.getElementById('userInput').placeholder = "Kelungal... Kettu kondu irukiren 🎙️";
            };

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('userInput').value = spokenText;
                document.getElementById('userInput').placeholder = "Ask anything or use voice...";
                handleSearch();
            };

            recognition.onerror = function() {
                document.getElementById('userInput').placeholder = "Ask anything or use voice...";
                alert("Voice கேட்கவில்லை, marubadiyum try pannunga.");
            };

            recognition.start();
        }

        function handleSearch() {
            const query = document.getElementById('userInput').value.trim().toLowerCase();
            const resultBox = document.getElementById('resultBox');

            if (query === "") {
                alert("Dhayavu seithu edhavathu kelvi kelungal!");
                return;
            }

            resultBox.style.display = "block";
            
            if (query.includes("thirukkural") || query.includes("திருக்குறள்") || query === "1" || query.includes("mudhal") || query.includes("andha")) {
                resultBox.innerHTML = `
                    <div style="text-align: center; color: #78350f; font-size: 1.25rem; font-weight: bold; margin-bottom: 12px; border-bottom: 1px dashed #8b5a2b; padding-bottom: 8px;">📜 முதல் அதிகாரம் - கடவுள் வாழ்த்து</div>
                    <div style="font-weight: bold; color: #451a03; font-size: 1.15rem; line-height: 1.6; text-align: center; margin-bottom: 15px;">
                        அகர முதல எழுத்தெல்லாம் ஆதி<br>
                        பகவன் முதற்றே உலகு.
                    </div>
                    <div style="color: #2c1d0c; line-height: 1.7; background: rgba(255, 255, 255, 0.3); padding: 12px; border-radius: 6px;">
                        <strong>தெளிவுரை:</strong> அகரத்தை முதன்மையாக கொண்டுள்ள எழுத்துமுறை அனைத்திற்கும் சிவனின் சித்திரை எழுத்தே முதன்மை ஆனது.
                    </div>
                `;
            } else {
                resultBox.innerHTML = `
                    <strong>Search Query:</strong> "${query}"<br><br>
                    <strong>Meyyee Engine:</strong> உங்களுக்கான Universal Truth தேடப்படுகிறது...
                `;
            }
        }

        document.getElementById('userInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleSearch();
            }
        });
    </script>

</body>
</html>
