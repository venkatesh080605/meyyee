<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meyyee - Universal Truth Engine</title>

    <link rel="manifest" href="/manifest.json">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 40px 15px;
            transition: all 0.4s ease;
        }

        /* ================================
           TOP NAVIGATION
        ================================= */

        .top-nav {
            position: absolute;
            top: 15px;
            right: 25px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
        }

        .nav-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #334155;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .account-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .account-btn:hover {
            background: #1d4ed8;
        }

        /* ================================
           MAIN CONTAINER
        ================================= */

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 800px;
            transition: all 0.4s ease;
            margin-top: 20px;
        }

        /* ================================
           SEARCH
        ================================= */

        .search-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            transition: all 0.4s ease;
            margin-top: 5vh;
            cursor: pointer;
        }

        body.searched .search-section {
            margin-top: 0;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 20px;
            width: 100%;
            max-width: 900px;
            cursor: default;
        }

        h1 {
            font-size: 3.8rem;
            letter-spacing: 6px;
            font-weight: 900;
            margin-bottom: 5px;

            background: linear-gradient(
                90deg,
                #ff0000,
                #ff7f00,
                #ffff00,
                #008000,
                #0000ff,
                #4b0082,
                #ee82ee
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            transition: font-size 0.4s ease;
        }

        body.searched h1 {
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 0;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #64748b;
            margin-bottom: 35px;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }

        body.searched .subtitle {
            display: none;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 2.5px solid #2563eb;
            border-radius: 50px;
            padding: 12px 18px 12px 28px;
            width: 100%;
            max-width: 620px;

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.12),
                inset 0 0 15px rgba(37, 99, 235, 0.05);

            margin-bottom: 30px;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        body.searched .search-box {
            margin-bottom: 0;
            max-width: 500px;
            padding: 8px 12px 8px 20px;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.05rem;
            color: #1e293b;
            background: transparent;
            min-width: 0;
            padding-left: 10px;
            cursor: text;
        }

        .mic-btn,
        .search-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 8px 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .mic-btn:hover,
        .search-btn:hover {
            transform: scale(1.15);
        }

        /* ================================
           WELCOME
        ================================= */

        #welcomeSection {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .video-container {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            background: transparent;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            background: transparent;
        }

        .welcome-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 2px;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        /* ================================
           INTRO ANIMATION
        ================================= */

        #intro-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
            transition: opacity 0.5s ease;
        }

        .anim-wrapper {
            position: relative;
            width: 300px;
            height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .piece {
            position: absolute;
            width: 150px;
            height: 150px;

            background-image: url('/launchericon-512x512.png');

            background-size: 300px 300px;
            background-repeat: no-repeat;

            opacity: 0;

            transition:
                transform 3s cubic-bezier(0.1, 0.9, 0.2, 1),
                opacity 1s ease;
        }

        .piece-tl {
            top: 0;
            left: 0;
            background-position: 0 0;
            transform: translate(-60vw, -60vh) rotate(-45deg);
        }

        .piece-tr {
            top: 0;
            right: 0;
            background-position: -150px 0;
            transform: translate(60vw, -60vh) rotate(45deg);
        }

        .piece-bl {
            bottom: 50px;
            left: 0;
            background-position: 0 -150px;
            transform: translate(-60vw, 60vh) rotate(45deg);
        }

        .piece-br {
            bottom: 50px;
            right: 0;
            background-position: -150px -150px;
            transform: translate(60vw, 60vh) rotate(-45deg);
        }

        .anim-title {
            position: absolute;
            bottom: -5px;
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 6px;

            background: linear-gradient(
                90deg,
                #ff0000,
                #ff7f00,
                #ffff00,
                #008000,
                #0000ff,
                #4b0082,
                #ee82ee
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            opacity: 0;
            transform: translateY(20px);

            transition:
                opacity 0.8s ease 2.2s,
                transform 0.8s ease 2.2s;
        }

        #intro-animation.animate .piece {
            transform: translate(0, 0) rotate(0deg);
            opacity: 1;
        }

        #intro-animation.animate .anim-title {
            opacity: 1;
            transform: translateY(0);
        }

        /* ================================
           MODAL
        ================================= */

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.5);

            justify-content: center;
            align-items: center;

            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            text-align: left;

            box-shadow: 0 15px 35px rgba(0,0,0,0.2);

            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        /* ================================
           AUTH
        ================================= */

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-tab.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .auth-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            display: none;
            font-size: 0.9rem;
        }

        .auth-message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .auth-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .user-info {
            background: #eff6ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #1e40af;
            word-break: break-word;
        }

        /* ================================
           RESULTS
        ================================= */

        #resultContainer {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 25px;
        }

        .result-box {
            width: 100%;

            background: linear-gradient(
                135deg,
                #f4e8c1 0%,
                #e6d39e 100%
            );

            border: 2px solid #8b5a2b;
            border-radius: 8px;
            padding: 25px;

            font-size: 1.05rem;
            color: #2c1d0c;
            text-align: left;

            box-shadow:
                0 8px 25px rgba(139, 90, 43, 0.25);
        }

        .board-title {
            text-align: center;
            color: #78350f;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 12px;
            border-bottom: 1px dashed #8b5a2b;
            padding-bottom: 8px;
        }

        .kural-lines {
            font-weight: bold;
            color: #451a03;
            font-size: 1.15rem;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 15px;
        }

        .meaning-box {
            color: #2c1d0c;
            line-height: 1.7;
            background: rgba(255, 255, 255, 0.4);
            padding: 12px;
            border-radius: 6px;
        }

        .user-website-card {
            width: 100%;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            margin-top: 15px;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            body {
                padding: 70px 12px 30px;
            }

            .top-nav {
                top: 12px;
                right: 12px;
                left: 12px;
                justify-content: flex-end;
            }

            .nav-btn,
            .account-btn {
                padding: 7px 11px;
                font-size: 0.8rem;
            }

            h1 {
                font-size: 3rem;
                letter-spacing: 4px;
            }

            body.searched h1 {
                font-size: 1.5rem;
            }

            body.searched .search-section {
                gap: 10px;
            }

            body.searched .search-box {
                max-width: 100%;
            }

            .search-box {
                padding-left: 18px;
            }

            .modal-content {
                padding: 22px;
            }
        }

    </style>
</head>

    <div

                👤 Meyyee Account
            </h3>


            <!-- Logged-in user -->

    <!-- ==========================================
         MAIN JAVASCRIPT
    =========================================== -->

    <script>

        /* ==========================================
           SUPABASE CONFIGURATION
        =========================================== */

        const SUPABASE_URL =
            "https://tukrsibwlwsmhlggqhxo.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_XVVpGFYayIZPn9OET1ioVw_SQPKgt27";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        let currentUser = null;

        let authMode = "login";


        /* ==========================================
           PAGE LOAD
        =========================================== */

        window.onload = async function() {

            setTimeout(() => {

                const intro =
                    document.getElementById(
                        'intro-animation'
                    );

                if (intro) {
                    intro.classList.add('animate');
                }

            }, 200);


            setTimeout(() => {

                closeIntro();

            }, 3500);


            await checkUser();


            supabaseClient.auth.onAuthStateChange(
                async function(event, session) {

                    currentUser =
                        session ? session.user : null;

                    updateAccountButton();

                }
            );

        };


        /* ==========================================
           INTRO
        =========================================== */

        function closeIntro() {

            const intro =
                document.getElementById(
                    'intro-animation'
                );

            if (intro) {

                intro.style.opacity = '0';

                setTimeout(() => {

                    intro.style.display = 'none';

                }, 500);

            }

        }


        /* ==========================================
           CHECK USER
        =========================================== */

        async function checkUser() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.getUser();


                if (error) {

                    currentUser = null;

                } else {

                    currentUser =
                        data.user || null;

                }


                updateAccountButton();

            } catch (error) {

                console.error(
                    "User check error:",
                    error
                );

            }

        }


        /* ==========================================
           ACCOUNT BUTTON
        =========================================== */

        function updateAccountButton() {

            const button =
                document.getElementById(
                    'accountButton'
                );


            if (!button) {
                return;
            }


            if (currentUser) {

                button.innerHTML =
                    "👤 " +
                    (currentUser.email || "Account");

            } else {

                button.innerHTML =
                    "👤 Account";

            }

        }


        /* ==========================================
           OPEN ACCOUNT
        =========================================== */

        function openAccountModal() {

            document.getElementById(
                'accountModal'
            ).style.display = 'flex';


            updateAccountModal();

        }


        function closeAccountModal() {

            document.getElementById(
                'accountModal'
            ).style.display = 'none';

        }


        /* ==========================================
           ACCOUNT MODAL STATE
        =========================================== */

        function updateAccountModal() {

            const loggedInSection =
                document.getElementById(
                    'loggedInSection'
                );

            const authSection =
                document.getElementById(
                    'authSection'
                );

            const emailDisplay =
                document.getElementById(
                    'userEmailDisplay'
                );


            if (currentUser) {

                loggedInSection.style.display =
                    'block';

                authSection.style.display =
                    'none';


                emailDisplay.textContent =
                    currentUser.email || "";

            } else {

                loggedInSection.style.display =
                    'none';

                authSection.style.display =
                    'block';

            }

        }


        /* ==========================================
           LOGIN TAB
        =========================================== */

        function showLogin() {

            authMode = "login";


            document.getElementById(
                'loginTab'
            ).classList.add('active');


            document.getElementById(
                'signupTab'
            ).classList.remove('active');


            document.getElementById(
                'authSubmitButton'
            ).textContent = "Login";


            document.getElementById(
                'authSubmitButton'
            ).onclick = loginUser;


            clearAuthMessage();

        }


        /* ==========================================
           SIGNUP TAB
        =========================================== */

        function showSignup() {

            authMode = "signup";


            document.getElementById(
                'signupTab'
            ).classList.add('active');


            document.getElementById(
                'loginTab'
            ).classList.remove('active');


            document.getElementById(
                'authSubmitButton'
            ).textContent = "Create Account";


            document.getElementById(
                'authSubmitButton'
            ).onclick = signupUser;


            clearAuthMessage();

        }


        /* ==========================================
           AUTH MESSAGE
        =========================================== */

        function showAuthMessage(
            message,
            type
        ) {

            const box =
                document.getElementById(
                    'authMessage'
                );


            box.textContent = message;

            box.className =
                "auth-message " + type;

        }


        function clearAuthMessage() {

            const box =
                document.getElementById(
                    'authMessage'
                );


            box.textContent = "";

            box.className =
                "auth-message";

        }


        /* ==========================================
           SIGN UP
        =========================================== */

        async function signupUser() {

            const email =
                document.getElementById(
                    'authEmail'
                ).value.trim();


            const password =
                document.getElementById(
                    'authPassword'
                ).value;


            if (!email || !password) {

                showAuthMessage(
                    "Please enter email and password.",
                    "error"
                );

                return;

            }


            if (password.length < 6) {

                showAuthMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;

            }


            const button =
                document.getElementById(
                    'authSubmitButton'
                );


            button.disabled = true;

            button.textContent =
                "Creating...";


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password

                    });


                if (error) {

                    showAuthMessage(
                        error.message,
                        "error"
                    );

                    return;

                }


                if (data.user && !data.session) {

                    showAuthMessage(
                        "Account created! Please check your email and confirm your account before logging in.",
                        "success"
                    );

                } else {

                    showAuthMessage(
                        "Account created successfully!",
                        "success"
                    );

                    currentUser =
                        data.user;

                    updateAccountButton();

                }

            } catch (error) {

                console.error(error);

                showAuthMessage(
                    "Something went wrong. Please try again.",
                    "error"
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    "Create Account";

            }

        }


        /* ==========================================
           LOGIN
        =========================================== */

        async function loginUser() {

            const email =
                document.getElementById(
                    'authEmail'
                ).value.trim();


            const password =
                document.getElementById(
                    'authPassword'
                ).value;


            if (!email || !password) {

                showAuthMessage(
                    "Please enter email and password.",
                    "error"
                );

                return;

            }


            const button =
                document.getElementById(
                    'authSubmitButton'
                );


            button.disabled = true;

            button.textContent =
                "Logging in...";


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signInWithPassword({

                            email: email,

                            password: password

                        });


                if (error) {

                    showAuthMessage(
                        error.message,
                        "error"
                    );

                    return;

                }


                currentUser =
                    data.user;


                updateAccountButton();


                showAuthMessage(
                    "Login successful!",
                    "success"
                );


                setTimeout(() => {

                    updateAccountModal();

                }, 700);


            } catch (error) {

                console.error(error);

                showAuthMessage(
                    "Login failed. Please try again.",
                    "error"
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    "Login";

            }

        }


        /* ==========================================
           LOGOUT
        =========================================== */

        async function logoutUser() {

            try {

                const {
                    error
                } =
                    await supabaseClient.auth
                        .signOut();


                if (error) {

                    alert(
                        error.message
                    );

                    return;

                }


                currentUser = null;


                updateAccountButton();


                updateAccountModal();


                closeAccountModal();


                alert(
                    "You have been logged out."
                );


            } catch (error) {

                console.error(error);

                alert(
                    "Logout failed. Please try again."
                );

            }

        }

        /* ==========================================

        =========================================== */

        function escapeHTML(text) {

            const div =
                document.createElement('div');

            div.textContent = text;

            return div.innerHTML;

        }

        /* ==========================================

        =========================================== */

        function startVoiceSearch() {

            const SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;


            if (!SpeechRecognition) {

                alert(
                    "Your browser does not support voice search. Please use Chrome or Edge!"
                );

                return;

            }


            const recognition =
                new SpeechRecognition();


            recognition.lang =
                'en-US';


            recognition.onstart =
                function() {

                    document.getElementById(
                        'userInput'
                    ).placeholder =
                        "Listening... Speak now 🎙️";

                };


            recognition.onresult =
                function(event) {

                    const spokenText =
                        event.results[0][0]
                            .transcript;


                    document.getElementById(
                        'userInput'
                    ).value =
                        spokenText;


                    document.getElementById(
                        'userInput'
                    ).placeholder =
                        "Search truth";


                    handleSearch();

                };


            recognition.onerror =
                function() {

                    document.getElementById(
                        'userInput'
                    ).placeholder =
                        "Search truth";


                    alert(
                        "Could not hear voice, please try again."
                    );

                };


            recognition.start();

        }
