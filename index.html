<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Universal Truth Engine</title>
    <link rel="manifest" href="/manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* ================================
           RESPONSIVE CONTAINER (DESKTOP & MOBILE)
           - Mobile-la full screen (mobile size) irukkum
           - Laptop/Desktop-la periya screen size-ku (max-width: 800px) expand aagum
        ================================= */
        .mobile-screen-wrapper {
            width: 100%;
            max-width: 800px; /* Desktop-la konjam periya size-ku irukkum */
            background: #ffffff;
            min-height: 90vh;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 30px 40px;
            overflow-y: auto;
            transition: all 0.4s ease;
        }

        /* Mobile devices-ku thaniya oru compact look varanum-naal */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }
            .mobile-screen-wrapper {
                max-width: 100%;
                min-height: 100vh;
                border-radius: 0;
                box-shadow: none;
                padding: 20px 16px;
            }
        }

        /* ================================
           TOP NAVIGATION
        ================================= */
        .top-nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        .nav-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
            transition: all 0.2s;
        }

        .account-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* ================================
           MAIN CONTAINER INSIDE WRAPPER
        ================================= */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px; /* Search and content romba stretch aagama center-la irukka */
            flex: 1;
        }

        /* ================================
           SEARCH SECTION
        ================================= */
        .search-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            transition: all 0.4s ease;
            margin-top: 12vh;
        }

        body.searched .search-section {
            margin-top: 10px;
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: 6px;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #008000, #0000ff, #4b0082, #ee82ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: font-size 0.4s ease;
        }

        body.searched h1 {
            font-size: 2rem;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: #64748b;
            margin-bottom: 30px;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }

        body.searched .subtitle {
            display: none;
        }

        /* CLOUD DESIGN & COLORFUL BORDER */
        .search-box-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffea00, #008000, #0000ff, #8a2be2, #ee82ee);
            background-size: 200% 200%;
            animation: rainbowFlow 5s ease infinite;
            padding: 3px; 
            border-radius: 50px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #111827; 
            border-radius: 46px; 
            padding: 12px 18px 12px 24px;
            width: 100%;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.05rem;
            color: #ffffff;
            background: transparent;
            min-width: 0;
            padding-left: 5px;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .mic-btn, .search-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        /* ================================
           WELCOME / VIDEO SECTION
        ================================= */
        #welcomeSection {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            width: 100%;
        }

        .video-container {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        .welcome-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        /* ================================
           INTRO ANIMATION
        ================================= */
        #intro-animation {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; overflow: hidden; transition: opacity 0.5s ease;
        }
        .anim-wrapper {
            position: relative; width: 250px; height: 300px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .piece {
            position: absolute; width: 120px; height: 120px;
            background-image: url('/launchericon-512x512.png');
            background-size: 240px 240px; background-repeat: no-repeat; opacity: 0;
            transition: transform 3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 1s ease;
        }
        .piece-tl { top: 0; left: 0; background-position: 0 0; transform: translate(-60vw, -60vh) rotate(-45deg); }
        .piece-tr { top: 0; right: 0; background-position: -120px 0; transform: translate(60vw, -60vh) rotate(45deg); }
        .piece-bl { bottom: 40px; left: 0; background-position: 0 -120px; transform: translate(-60vw, 60vh) rotate(45deg); }
        .piece-br { bottom: 40px; right: 0; background-position: -120px -120px; transform: translate(60vw, 60vh) rotate(-45deg); }
        
        .anim-title {
            position: absolute; bottom: 0px; font-size: 32px; font-weight: 900; letter-spacing: 5px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #008000, #0000ff, #4b0082, #ee82ee);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.8s ease 2.2s, transform 0.8s ease 2.2s;
        }

        #intro-animation.animate .piece { transform: translate(0, 0) rotate(0deg); opacity: 1; }
        #intro-animation.animate .anim-title { opacity: 1; transform: translateY(0); }

        /* ================================
           MODALS
        ================================= */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center; z-index: 1000;
        }

        .modal-content {
            background: #ffffff; padding: 30px; border-radius: 16px;
            width: 90%; max-width: 420px; text-align: left;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
        }

        .modal-content h3 { margin-bottom: 15px; color: #1e293b; font-size: 1.2rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none;
        }
        .form-group textarea { resize: vertical; height: 90px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn-primary { background: #2563eb; color: white; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .btn-secondary { background: #e2e8f0; color: #334155; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }

        /* ================================
           AUTH TABS
        ================================= */
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .auth-tab { flex: 1; padding: 10px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; text-align: center; }
        .auth-tab.active { background: #2563eb; color: white; border-color: #2563eb; }
        .auth-message { margin-top: 10px; padding: 10px; border-radius: 8px; display: none; font-size: 0.85rem; }
        .auth-message.success { display: block; background: #dcfce7; color: #166534; }
        .auth-message.error { display: block; background: #fee2e2; color: #991b1b; }
        .user-info { background: #eff6ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; color: #1e40af; word-break: break-word; font-size: 0.9rem; }

        /* ================================
           RESULTS
        ================================= */
        #resultContainer { width: 100%; display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
        .result-box {
            width: 100%; background: linear-gradient(135deg, #f4e8c1 0%, #e6d39e 100%);
            border: 2px solid #8b5a2b; border-radius: 10px; padding: 18px; font-size: 1rem;
            color: #2c1d0c; text-align: left; box-shadow: 0 4px 15px rgba(139, 90, 43, 0.15);
        }
        .board-title { text-align: center; color: #78350f; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; border-bottom: 1px dashed #8b5a2b; padding-bottom: 8px; }
        .kural-lines { font-weight: bold; color: #451a03; font-size: 1.05rem; line-height: 1.6; text-align: center; margin-bottom: 12px; }
        .meaning-box { color: #2c1d0c; line-height: 1.6; background: rgba(255, 255, 255, 0.4); padding: 12px; border-radius: 8px; font-size: 0.95rem; }
        .user-website-card { width: 100%; border-radius: 12px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.06); text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- INTRO ANIMATION -->
    <div id="intro-animation" onclick="closeIntro()">
        <div class="anim-wrapper">
            <div class="piece piece-tl"></div>
            <div class="piece piece-tr"></div>
            <div class="piece piece-bl"></div>
            <div class="piece piece-br"></div>
            <div class="anim-title">MEYYEE</div>
        </div>
    </div>

    <!-- RESPONSIVE WRAPPER (Desktop Size on Laptop, Mobile Size on Phone) -->
    <div class="mobile-screen-wrapper">

        <!-- TOP NAVIGATION -->
        <div class="top-nav">
            <button class="nav-btn" onclick="openWebsiteBuilder()">🌐 Create Site</button>
            <button class="account-btn" id="accountButton" onclick="openAccountModal()">👤 Account</button>
        </div>

        <!-- MAIN CONTAINER -->
        <div class="container" id="mainContainer">

            <!-- SEARCH SECTION -->
            <div class="search-section" id="searchSection">
                <div onclick="focusSearchUI()" style="cursor:pointer; text-align:center;">
                    <h1>MEYYEE</h1>
                    <div class="subtitle">Universal Truth Engine</div>
                </div>

                <!-- Cloud Design Wrapper -->
                <div class="search-box-wrapper" onclick="focusSearchUI()">
                    <div class="search-box">
                        <input
                            type="search" 
                            id="userInput"
                            class="search-input"
                            placeholder="Search truth"
                            autocomplete="off" 
                            spellcheck="false"
                            name="meyyee_search_query"
                            onfocus="focusSearchUI()"
                            onclick="event.stopPropagation(); focusSearchUI();"
                            onkeydown="if(event.key === 'Enter'){ event.stopPropagation(); handleSearch(); }"
                        >

                        <button class="mic-btn" onclick="event.stopPropagation(); startVoiceSearch();" title="Search by Voice">🎤</button>
                        <button class="search-btn" onclick="event.stopPropagation(); handleSearch();" title="Search">🔎</button>
                    </div>
                </div>
            </div>

            <!-- WELCOME SECTION (Will hide instantly when search is focused/clicked) -->
            <div id="welcomeSection">
                <div class="video-container">
                    <video autoplay muted loop playsinline>
                        <source src="myvideo.mp4.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="welcome-text">WELCOME</div>
            </div>

            <!-- RESULTS -->
            <div id="resultContainer"></div>

        </div>
    </div>

    <!-- WEBSITES BUILDER MODAL -->
    <div class="modal-overlay" id="websiteModal">
        <div class="modal-content">
            <h3>🌐 Create Your Own Website<br><small style="color:#64748b; font-size:0.8rem;">Meyyee Sites</small></h3>
            <div class="form-group">
                <label>Website Title:</label>
                <input type="text" id="siteTitleInput" placeholder="e.g., My Personal Site">
            </div>
            <div class="form-group">
                <label>Website Content / Description:</label>
                <textarea id="siteContentInput" placeholder="Write details about your website here..."></textarea>
            </div>
            <div class="form-group">
                <label>Theme Background Color:</label>
                <select id="siteBgColor">
                    <option value="#f8fafc">Light Minimal</option>
                    <option value="#dbeafe">Ocean Blue</option>
                    <option value="#fef3c7">Golden Palm</option>
                    <option value="#f3e8ff">Royal Purple</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeWebsiteBuilder()">Cancel</button>
                <button class="btn-primary" onclick="generateUserWebsite()">Create</button>
            </div>
        </div>
    </div>

    <!-- ACCOUNT / LOGIN MODAL -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal-content">
            <h3>👤 Meyyee Account</h3>
            <div id="loggedInSection" style="display:none;">
                <div class="user-info">
                    <strong>You are logged in</strong><br><br>
                    <span id="userEmailDisplay"></span>
                </div>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="closeAccountModal()">Close</button>
                    <button class="btn-primary" onclick="logoutUser()">Logout</button>
                </div>
            </div>
            <div id="authSection">
                <div class="auth-tabs">
                    <button class="auth-tab active" id="loginTab" onclick="showLogin()">Login</button>
                    <button class="auth-tab" id="signupTab" onclick="showSignup()">Sign Up</button>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="authEmail" placeholder="Enter your email" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="authPassword" placeholder="Enter password" autocomplete="current-password">
                </div>
                <button class="btn-primary" id="authSubmitButton" onclick="loginUser()" style="width:100%;">Login</button>
                <div id="authMessage" class="auth-message"></div>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="closeAccountModal()">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- MAIN JAVASCRIPT -->
    <script>
        const SUPABASE_URL = "https://tukrsibwlwsmhlggqhxo.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_XVVpGFYayIZPn9OET1ioVw_SQPKgt27";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentUser = null;
        let authMode = "login";

        window.onload = async function() {
            setTimeout(() => {
                const intro = document.getElementById('intro-animation');
                if (intro) intro.classList.add('animate');
            }, 200);

            setTimeout(() => {
                closeIntro();
            }, 3500);

            await checkUser();

            supabaseClient.auth.onAuthStateChange(async function(event, session) {
                currentUser = session ? session.user : null;
                updateAccountButton();
            });
        };

        function closeIntro() {
            const intro = document.getElementById('intro-animation');
            if (intro) {
                intro.style.opacity = '0';
                setTimeout(() => { intro.style.display = 'none'; }, 500);
            }
        }

        async function checkUser() {
            try {
                const { data, error } = await supabaseClient.auth.getUser();
                if (error) currentUser = null;
                else currentUser = data.user || null;
                updateAccountButton();
            } catch (error) {
                console.error("User check error:", error);
            }
        }

        function updateAccountButton() {
            const button = document.getElementById('accountButton');
            if (!button) return;
            if (currentUser) button.innerHTML = "👤 " + (currentUser.email.split('@')[0] || "Account");
            else button.innerHTML = "👤 Account";
        }

        function openAccountModal() {
            document.getElementById('accountModal').style.display = 'flex';
            updateAccountModal();
        }

        function closeAccountModal() {
            document.getElementById('accountModal').style.display = 'none';
        }

        function updateAccountModal() {
            const loggedInSection = document.getElementById('loggedInSection');
            const authSection = document.getElementById('authSection');
            const emailDisplay = document.getElementById('userEmailDisplay');

            if (currentUser) {
                loggedInSection.style.display = 'block';
                authSection.style.display = 'none';
                emailDisplay.textContent = currentUser.email || "";
            } else {
                loggedInSection.style.display = 'none';
                authSection.style.display = 'block';
            }
        }

        function showLogin() {
            authMode = "login";
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('signupTab').classList.remove('active');
            document.getElementById('authSubmitButton').textContent = "Login";
            document.getElementById('authSubmitButton').onclick = loginUser;
            clearAuthMessage();
        }

        function showSignup() {
            authMode = "signup";
            document.getElementById('signupTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('authSubmitButton').textContent = "Create Account";
            document.getElementById('authSubmitButton').onclick = signupUser;
            clearAuthMessage();
        }

        function showAuthMessage(message, type) {
            const box = document.getElementById('authMessage');
            box.textContent = message;
            box.className = "auth-message " + type;
        }

        function clearAuthMessage() {
            const box = document.getElementById('authMessage');
            box.textContent = "";
            box.className = "auth-message";
        }

        async function signupUser() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            if (!email || !password) { showAuthMessage("Please enter email and password.", "error"); return; }
            if (password.length < 6) { showAuthMessage("Password must contain at least 6 characters.", "error"); return; }
            const button = document.getElementById('authSubmitButton');
            button.disabled = true; button.textContent = "Creating...";

            try {
                const { data, error } = await supabaseClient.auth.signUp({ email: email, password: password });
                if (error) { showAuthMessage(error.message, "error"); return; }
                if (data.user && !data.session) {
                    showAuthMessage("Account created! Please check your email to confirm.", "success");
                } else {
                    showAuthMessage("Account created successfully!", "success");
                    currentUser = data.user; updateAccountButton();
                }
            } catch (error) {
                console.error(error); showAuthMessage("Something went wrong.", "error");
            } finally {
                button.disabled = false; button.textContent = "Create Account";
            }
        }

        async function loginUser() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            if (!email || !password) { showAuthMessage("Please enter email and password.", "error"); return; }
            const button = document.getElementById('authSubmitButton');
            button.disabled = true; button.textContent = "Logging in...";

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
                if (error) { showAuthMessage(error.message, "error"); return; }
                currentUser = data.user; updateAccountButton();
                showAuthMessage("Login successful!", "success");
                setTimeout(() => { updateAccountModal(); }, 700);
            } catch (error) {
                console.error(error); showAuthMessage("Login failed.", "error");
            } finally {
                button.disabled = false; button.textContent = "Login";
            }
        }

        async function logoutUser() {
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) { alert(error.message); return; }
                currentUser = null; updateAccountButton(); updateAccountModal(); closeAccountModal();
                alert("Logged out successfully.");
            } catch (error) {
                console.error(error); alert("Logout failed.");
            }
        }

        function openWebsiteBuilder() {
            if (!currentUser) {
                alert("Please Login or Create an Account first to build your website.");
                openAccountModal(); return;
            }
            document.getElementById('websiteModal').style.display = 'flex';
        }

        function closeWebsiteBuilder() { document.getElementById('websiteModal').style.display = 'none'; }
        function escapeHTML(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        function generateUserWebsite() {
            if (!currentUser) { closeWebsiteBuilder(); alert("Please login first."); openAccountModal(); return; }
            const title = document.getElementById('siteTitleInput').value.trim();
            const content = document.getElementById('siteContentInput').value.trim();
            const bgColor = document.getElementById('siteBgColor').value;
            const resultContainer = document.getElementById('resultContainer');
            
            if (title === "" || content === "") { alert("Please fill in both title and content!"); return; }
            const safeTitle = escapeHTML(title);
            const safeContent = escapeHTML(content).replace(/\n/g, '<br>');

            document.body.classList.add('searched');
            document.getElementById('welcomeSection').style.display = 'none';
            closeWebsiteBuilder();

            resultContainer.innerHTML = `
                <div style="background: #e0f2fe; padding: 12px; border-radius: 8px; color: #0369a1; font-weight: bold; text-align: center; margin-bottom: 10px; font-size:0.9rem;">
                    🎉 Website created successfully!
                </div>
                <div class="user-website-card" style="background-color: ${bgColor}; border: 1px solid #cbd5e1;">
                    <h2>${safeTitle}</h2>
                    <hr style="margin: 12px 0; border: 0; border-top: 1px solid rgba(0,0,0,0.1);">
                    <p style="font-size: 0.95rem; line-height: 1.5;">${safeContent}</p>
                    <div style="margin-top: 18px; font-size: 0.8rem; color: #64748b;">
                        Published via <strong>Meyyee Engine</strong>
                    </div>
                </div>
            `;
        }

        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Voice search not supported in this browser."); return; }
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.onstart = function() { document.getElementById('userInput').placeholder = "Listening... 🎙️"; };
