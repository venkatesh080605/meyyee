<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Meyyee - Universal Truth Engine</title>

    <link rel="manifest" href="/manifest.json">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: #ffffff;
            color: #111827;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;

            min-height: 100vh;
            width: 100%;

            position: relative;

            padding: 40px 15px;

            transition: all 0.4s ease;
        }


        /* =====================================================
           TOP NAVIGATION
        ===================================================== */

        .top-nav {
            position: absolute;

            top: 15px;
            right: 25px;

            display: flex;
            gap: 10px;
            align-items: center;

            z-index: 10;
        }

        .nav-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;

            padding: 8px 16px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: 600;
            color: #334155;

            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .account-btn {
            background: #2563eb;
            color: white;

            border: none;

            padding: 9px 16px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: 600;
        }

        .account-btn:hover {
            background: #1d4ed8;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;

            text-align: center;

            width: 100%;
            max-width: 800px;

            margin-top: 20px;

            transition: all 0.4s ease;
        }


        /* =====================================================
           SEARCH SECTION
        ===================================================== */

        .search-section {
            display: flex;
            flex-direction: column;
            align-items: center;

            width: 100%;

            transition: all 0.4s ease;

            margin-top: 5vh;
        }

        body.searched .search-section {
            margin-top: 0;

            flex-direction: row;

            justify-content: flex-start;
            align-items: center;

            gap: 20px;

            border-bottom: 1px solid #e2e8f0;

            padding-bottom: 20px;

            width: 100%;
            max-width: 900px;
        }


        /* =====================================================
           MEYYEE TITLE
        ===================================================== */

        h1 {
            font-size: 3.8rem;

            letter-spacing: 6px;

            font-weight: 900;

            margin-bottom: 5px;

            background: linear-gradient(
                90deg,
                #ff0000,
                #ff7f00,
                #ffff00,
                #008000,
                #0000ff,
                #4b0082,
                #ee82ee
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            transition: font-size 0.4s ease;
        }

        body.searched h1 {
            font-size: 2rem;

            letter-spacing: 3px;

            margin-bottom: 0;
        }

        .subtitle {
            font-size: 0.9rem;

            letter-spacing: 2px;

            color: #64748b;

            margin-bottom: 35px;

            text-transform: uppercase;

            transition: opacity 0.3s;
        }

        body.searched .subtitle {
            display: none;
        }


        /* =====================================================
           YOUR CLOUD SEARCH BAR
           
           This replaces the normal oval/pill search bar.
           The shape is based on your uploaded drawing:
           rounded cloud sections + inward curves.
        ===================================================== */

        .search-box {
            position: relative;

            width: min(620px, 94vw);

            min-height: 118px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 28px 52px;

            margin-bottom: 30px;

            background: rgba(248, 250, 252, 0.97);

            /*
             * Cloud outline
             */
            clip-path: url("#meyyeeCloudShape");

            /*
             * The actual colored outline is created
             * using the SVG layer below.
             */

            box-shadow:
                0 12px 30px rgba(37, 99, 235, 0.12);

            transition: all 0.3s ease;

            overflow: visible;
        }


        /*
         * SVG cloud border is positioned behind
         * the search content.
         */

        .cloud-border {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 0;
        }

        .cloud-border path {
            fill: #f8fafc;

            stroke: url("#cloudRainbow");

            stroke-width: 4;

            vector-effect: non-scaling-stroke;
        }


        /*
         * Search content
         */

        .search-content {
            position: relative;

            z-index: 2;

            display: flex;

            align-items: center;

            width: 100%;

            max-width: 510px;

            background: rgba(255,255,255,0.92);

            border-radius: 40px;

            padding: 7px 10px 7px 18px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.08);
        }

        .search-input {
            flex: 1;

            width: 100%;

            min-width: 0;

            border: none;

            outline: none;

            font-size: 1.05rem;

            color: #1e293b;

            background: transparent;

            padding: 8px 6px;

            /*
             * Prevent this field from behaving
             * like an email/account field.
             */
            autocomplete: off;
        }

        .search-input::placeholder {
            color: #64748b;
            opacity: 1;
        }


        /* =====================================================
           SEARCH BUTTONS
        ===================================================== */

        .mic-btn,
        .search-btn {
            background: transparent;

            border: none;

            outline: none;

            font-size: 1.25rem;

            cursor: pointer;

            padding: 8px 10px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

            transition: transform 0.2s;
        }

        .mic-btn:hover,
        .search-btn:hover {
            transform: scale(1.15);
        }


        /* =====================================================
           WELCOME
        ===================================================== */

        #welcomeSection {
            display: flex;

            flex-direction: column;

            align-items: center;

            transition: all 0.3s ease;

            width: 100%;
        }

        .video-container {
            width: 150px;
            height: 150px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 5px;

            background: transparent;
        }

        .video-container video {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 15px;

            background: transparent;
        }

        .welcome-text {
            font-size: 1.3rem;

            font-weight: bold;

            color: #0f172a;

            letter-spacing: 2px;

            margin-top: 5px;

            margin-bottom: 20px;
        }


        /* =====================================================
           INTRO ANIMATION
        ===================================================== */

        #intro-animation {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: #ffffff;

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 9999;

            overflow: hidden;

            transition: opacity 0.5s ease;
        }

        .anim-wrapper {
            position: relative;

            width: 300px;
            height: 350px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }

        .piece {
            position: absolute;

            width: 150px;
            height: 150px;

            background-image:
                url('/launchericon-512x512.png');

            background-size: 300px 300px;

            background-repeat: no-repeat;

            opacity: 0;

            transition:
                transform 3s cubic-bezier(0.1, 0.9, 0.2, 1),
                opacity 1s ease;
        }

        .piece-tl {
            top: 0;
            left: 0;

            background-position: 0 0;

            transform:
                translate(-60vw, -60vh)
                rotate(-45deg);
        }

        .piece-tr {
            top: 0;
            right: 0;

            background-position: -150px 0;

            transform:
                translate(60vw, -60vh)
                rotate(45deg);
        }

        .piece-bl {
            bottom: 50px;
            left: 0;

            background-position: 0 -150px;

            transform:
                translate(-60vw, 60vh)
                rotate(45deg);
        }

        .piece-br {
            bottom: 50px;
            right: 0;

            background-position: -150px -150px;

            transform:
                translate(60vw, 60vh)
                rotate(-45deg);
        }

        .anim-title {
            position: absolute;

            bottom: -5px;

            font-size: 40px;

            font-weight: 900;

            letter-spacing: 6px;

            background: linear-gradient(
                90deg,
                #ff0000,
                #ff7f00,
                #ffff00,
                #008000,
                #0000ff,
                #4b0082,
                #ee82ee
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            opacity: 0;

            transform: translateY(20px);

            transition:
                opacity 0.8s ease 2.2s,
                transform 0.8s ease 2.2s;
        }

        #intro-animation.animate .piece {
            transform: translate(0, 0) rotate(0deg);

            opacity: 1;
        }

        #intro-animation.animate .anim-title {
            opacity: 1;

            transform: translateY(0);
        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal-overlay {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.5);

            justify-content: center;
            align-items: center;

            padding: 12px;

            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;

            padding: 30px;

            border-radius: 12px;

            width: 100%;

            max-width: 500px;

            text-align: left;

            box-shadow:
                0 15px 35px rgba(0,0,0,0.2);

            max-height: 90vh;

            overflow-y: auto;
        }

        .modal-content h3 {
            margin-bottom: 20px;

            color: #1e293b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            font-size: 0.9rem;

            font-weight: 600;

            color: #475569;

            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;

            padding: 10px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            font-size: 1rem;

            outline: none;
        }

        .form-group textarea {
            resize: vertical;

            height: 100px;
        }

        .modal-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 20px;

            flex-wrap: wrap;
        }

        .btn-primary {
            background: #2563eb;

            color: white;

            border: none;

            padding: 10px 20px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: 600;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e2e8f0;

            color: #334155;

            border: none;

            padding: 10px 20px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: 600;
        }


        /* =====================================================
           GOOGLE LOGIN
        ===================================================== */

        .google-btn {
            width: 100%;

            padding: 11px 16px;

            margin-top: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 7px;

            background: white;

            color: #334155;

            font-size: 0.98rem;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.2s;
        }

        .google-btn:hover {
            background: #f8fafc;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }


        /* =====================================================
           AUTH
        ===================================================== */

        .auth-tabs {
            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;

            padding: 10px;

            border: 1px solid #cbd5e1;

            background: #f8fafc;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;
        }

        .auth-tab.active {
            background: #2563eb;

            color: white;

            border-color: #2563eb;
        }

        .auth-message {
            margin-top: 15px;

            padding: 10px;

            border-radius: 7px;

            display: none;

            font-size: 0.9rem;
        }

        .auth-message.success {
            display: block;

            background: #dcfce7;

            color: #166534;
        }

        .auth-message.error {
            display: block;

            background: #fee2e2;

            color: #991b1b;
        }

        .user-info {
            background: #eff6ff;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;

            color: #1e40af;

            word-break: break-word;
        }


        /* =====================================================
           RESULTS
        ===================================================== */

        #resultContainer {
            width: 100%;

            max-width: 680px;

            display: flex;

            flex-direction: column;

            gap: 20px;

            margin-top: 25px;
        }

        .result-box {
            width: 100%;

            background: linear-gradient(
                135deg,
                #f4e8c1 0%,
                #e6d39e 100%
            );

            border: 2px solid #8b5a2b;

            border-radius: 8px;

            padding: 25px;

            font-size: 1.05rem;

            color: #2c1d0c;

            text-align: left;

            box-shadow:
                0 8px 25px rgba(139,90,43,0.25);
        }

        .board-title {
            text-align: center;

            color: #78350f;

            font-size: 1.25rem;

            font-weight: bold;

            margin-bottom: 12px;

            border-bottom: 1px dashed #8b5a2b;

            padding-bottom: 8px;
        }

        .kural-lines {
            font-weight: bold;

            color: #451a03;

            font-size: 1.15rem;

            line-height: 1.6;

            text-align: center;

            margin-bottom: 15px;
        }

        .meaning-box {
            color: #2c1d0c;

            line-height: 1.7;

            background: rgba(255,255,255,0.4);

            padding: 12px;

            border-radius: 6px;
        }

        .user-website-card {
            width: 100%;

            border-radius: 12px;

            padding: 30px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.1);

            text-align: center;

            margin-top: 15px;
        }


        /* =====================================================
           SEARCHED DESKTOP
        ===================================================== */

        body.searched .search-box {
            margin-bottom: 0;

            max-width: 500px;

            min-height: 82px;

            padding: 15px 32px;
        }

        body.searched .search-content {
            max-width: 430px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                width: 100%;

                min-height: 100vh;

                padding:
                    68px
                    10px
                    30px;
            }

            .top-nav {
                top: 12px;

                left: 8px;
                right: 8px;

                display: flex;

                justify-content: flex-end;

                align-items: center;

                gap: 6px;
            }

            .nav-btn,
            .account-btn {
                padding: 7px 9px;

                font-size: 0.73rem;

                white-space: nowrap;
            }

            .container {
                width: 100%;

                max-width: 100%;

                margin-top: 0;
            }


            /* HOME */

            .search-section {
                width: 100%;

                margin-top: 6vh;

                display: flex;

                flex-direction: column;

                align-items: center;
            }

            .search-section > div:first-child {
                width: 100%;

                text-align: center;
            }

            h1 {
                font-size:
                    clamp(
                        2.35rem,
                        13vw,
                        3.8rem
                    );

                letter-spacing: 3px;

                line-height: 1.1;

                margin-bottom: 6px;

                white-space: nowrap;
            }

            .subtitle {
                font-size: 0.65rem;

                letter-spacing: 1.2px;

                margin-bottom: 23px;
            }


            /* CLOUD SEARCH MOBILE */

            .search-box {
                width: 96vw;

                max-width: 96vw;

                min-height: 105px;

                padding: 25px 26px;

                margin-bottom: 24px;
            }

            .search-content {
                width: 100%;

                max-width: 100%;

                padding:
                    5px
                    7px
                    5px
                    12px;
            }

            .search-input {
                font-size: 16px;

                padding: 7px 3px;
            }

            .mic-btn,
            .search-btn {
                width: 36px;

                height: 36px;

                padding: 4px;

                font-size: 1rem;
            }


            /* WELCOME */

            #welcomeSection {
                width: 100%;
            }

            .video-container {
                width: 125px;

                height: 125px;

                max-width: 40vw;

                max-height: 40vw;
            }

            .welcome-text {
                font-size: 1.03rem;

                letter-spacing: 1.4px;

                margin-top: 5px;

                margin-bottom: 15px;
            }


            /* RESULTS */

            #resultContainer {
                width: 100%;

                max-width: 100%;

                margin-top: 18px;

                gap: 15px;
            }

            .result-box {
                width: 100%;

                padding: 18px 14px;

                font-size: 0.94rem;

                overflow-wrap: break-word;
            }

            .board-title {
                font-size: 1.03rem;

                line-height: 1.4;
            }

            .kural-lines {
                font-size: 0.98rem;

                line-height: 1.7;
            }

            .meaning-box {
                font-size: 0.91rem;

                line-height: 1.65;

                padding: 10px;
            }

            .user-website-card {
                width: 100%;

                padding: 20px 14px;

                overflow-wrap: break-word;
            }


            /* MODALS */

            .modal-overlay {
                padding: 10px;
            }

            .modal-content {
                width: 100%;

                max-width: 100%;

                max-height: 90vh;

                padding: 20px 16px;
            }

            .form-group input,
            .form-group textarea,
            .form-group select {
                font-size: 16px;
            }


            /* SEARCHED MOBILE */

            body.searched .search-section {
                width: 100%;

                max-width: 100%;

                margin-top: 0;

                display: flex;

                flex-direction: row;

                align-items: center;

                justify-content: flex-start;

                gap: 7px;

                padding-bottom: 12px;
            }

            body.searched .search-section > div:first-child {
                width: auto;

                flex-shrink: 0;
            }

            body.searched h1 {
                font-size: 1.18rem;

                letter-spacing: 1.5px;

                margin: 0;
            }

            body.searched .search-box {
                flex: 1;

                width: auto;

                max-width: none;

                min-width: 0;

                min-height: 60px;

                margin-bottom: 0;

                padding: 14px 16px;
            }

            body.searched .search-content {
                padding:
                    4px
                    5px
                    4px
                    9px;
            }

            body.searched .search-input {
                font-size: 15px;
            }

            body.searched .mic-btn,
            body.searched .search-btn {
                width: 31px;

                height: 31px;

                font-size: 0.9rem;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media (max-width: 380px) {

            body {
                padding-left: 7px;

                padding-right: 7px;
            }

            .top-nav {
                left: 6px;

                right: 6px;

                gap: 5px;
            }

            .nav-btn,
            .account-btn {
                padding: 6px 7px;

                font-size: 0.68rem;
            }

            h1 {
                font-size: 2.25rem;

                letter-spacing: 2px;
            }

            .subtitle {
                font-size: 0.58rem;

                letter-spacing: 1px;
            }

            .search-box {
                width: 97vw;

                max-width: 97vw;

                min-height: 98px;

                padding:
                    23px
                    20px;
            }

            .mic-btn,
            .search-btn {
                width: 33px;

                height: 33px;
            }

            .video-container {
                width: 112px;

                height: 112px;
            }

            body.searched h1 {
                font-size: 1.05rem;
            }

            body.searched .search-section {
                gap: 4px;
            }

            body.searched .search-box {
                min-height: 55px;

                padding:
                    12px
                    12px;
            }
        }


        /* =====================================================
           ACCESSIBILITY
        ===================================================== */

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

    </style>

<body>


    <!-- =====================================================
         INTRO ANIMATION
    ====================================================== -->

    <div id="intro-animation">

        <div class="anim-wrapper">

            <div class="piece piece-tl"></div>

                    <input

                    class="google-btn"
                    type="button"
                    onclick="signInWithGoogle()">

                    G &nbsp; Continue with Google

                    id="authMessage"
                    class="auth-message">
                </div>


                <div class="modal-actions">

    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           SUPABASE CONFIG
        ===================================================== */

        const SUPABASE_URL =
            "https://tukrsibwlwsmhlggqhxo.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_XVVpGFYayIZPn9OET1ioVw_SQPKgt27";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        let currentUser = null;

        let authMode = "login";


        /* =====================================================
           PAGE LOAD
        ===================================================== */

        window.addEventListener(
            "load",
            async function() {


                setTimeout(
                    function() {

                        const intro =
                            document.getElementById(
                                "intro-animation"
                            );

                        if (intro) {

                            intro.classList.add(
                                "animate"
                            );

                        }

                    },
                    200
                );


                setTimeout(
                    function() {

                        closeIntro();

                    },
                    3500
                );


                await checkUser();


                supabaseClient.auth.onAuthStateChange(
                    function(event, session) {

                        currentUser =
                            session
                                ? session.user
                                : null;


                        updateAccountButton();


                        /*
                         * IMPORTANT:
                         *
                         * Never put the email into
                         * the search input.
                         */

                    }
                );

            }
        );


        /* =====================================================
           INTRO
        ===================================================== */

        function closeIntro() {

            const intro =
                document.getElementById(
                    "intro-animation"
                );


            if (intro) {

                intro.style.opacity = "0";


                setTimeout(
                    function() {

                        intro.style.display =
                            "none";

                    },
                    500
                );

            }

        }


        /* =====================================================
           CHECK USER
        ===================================================== */

        async function checkUser() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.getUser();


                if (error) {

                    currentUser = null;

                } else {

                    currentUser =
                        data.user || null;

                }


                updateAccountButton();

            }

            catch (error) {

                console.error(
                    "User check error:",
                    error
                );

            }

        }


        /* =====================================================
           ACCOUNT BUTTON
        ===================================================== */

        function updateAccountButton() {

            const button =
                document.getElementById(
                    "accountButton"
                );


            if (!button) {
                return;
            }


            /*
             * Main page ALWAYS shows Account.
             *
             * Email never appears here.
             */

            button.textContent =
                "👤 Account";

        }


        /* =====================================================
           OPEN ACCOUNT
        ===================================================== */

        function openAccountModal() {

            document.getElementById(
                "accountModal"
            ).style.display = "flex";


            updateAccountModal();

        }


        function closeAccountModal() {

            document.getElementById(
                "accountModal"
            ).style.display = "none";

        }


        /* =====================================================
           ACCOUNT MODAL
        ===================================================== */

        function updateAccountModal() {

            const loggedInSection =
                document.getElementById(
                    "loggedInSection"
                );


            const authSection =
                document.getElementById(
                    "authSection"
                );


            const emailDisplay =
                document.getElementById(
                    "userEmailDisplay"
                );


            if (currentUser) {

                loggedInSection.style.display =
                    "block";


                authSection.style.display =
                    "none";


                emailDisplay.textContent =
                    currentUser.email || "";

            }

            else {

                loggedInSection.style.display =
                    "none";


                authSection.style.display =
                    "block";

            }

        }


        /* =====================================================
           LOGIN TAB
        ===================================================== */

        function showLogin() {

            authMode = "login";


            document.getElementById(
                "loginTab"
            ).classList.add("active");


            document.getElementById(
                "signupTab"
            ).classList.remove("active");


            document.getElementById(
                "authSubmitButton"
            ).textContent =
                "Login";


            document.getElementById(
                "authSubmitButton"
            ).onclick =
                loginUser;


            document.getElementById(
                "authPassword"
            ).setAttribute(
                "autocomplete",
                "current-password"
            );


            clearAuthMessage();

        }


        /* =====================================================
           SIGNUP TAB
        ===================================================== */

        function showSignup() {

            authMode = "signup";


            document.getElementById(
                "signupTab"
            ).classList.add("active");


            document.getElementById(
                "loginTab"
            ).classList.remove("active");


            document.getElementById(
                "authSubmitButton"
            ).textContent =
                "Create Account";


            document.getElementById(
                "authSubmitButton"
            ).onclick =
                signupUser;


            document.getElementById(
                "authPassword"
            ).setAttribute(
                "autocomplete",
                "new-password"
            );


            clearAuthMessage();

        }


        /* =====================================================
           AUTH MESSAGE
        ===================================================== */

        function showAuthMessage(
            message,
            type
        ) {

            const box =
                document.getElementById(
                    "authMessage"
                );


            box.textContent =
                message;


            box.className =
                "auth-message " + type;

        }


        function clearAuthMessage() {

            const box =
                document.getElementById(
                    "authMessage"
                );


            box.textContent =
                "";


            box.className =
                "auth-message";

        }


        /* =====================================================
           SIGN UP
        ===================================================== */

        async function signupUser() {

            const email =
                document.getElementById(
                    "authEmail"
                ).value.trim();


            const password =
                document.getElementById(
                    "authPassword"
                ).value;


            if (!email || !password) {

                showAuthMessage(
                    "Please enter email and password.",
                    "error"
                );

                return;

            }


            if (password.length < 6) {

                showAuthMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;

            }


            const button =
                document.getElementById(
                    "authSubmitButton"
                );


            button.disabled = true;

            button.textContent =
                "Creating...";


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            emailRedirectTo:
                                "https://meyyee.site"

                        }

                    });


                if (error) {

                    showAuthMessage(
                        error.message,
                        "error"
                    );

                    return;

                }


                if (
                    data.user &&
                    !data.session
                ) {

                    showAuthMessage(
                        "Account created! Please check your email and confirm your account before logging in.",
                        "success"
                    );

                }

                else {

                    showAuthMessage(
                        "Account created successfully!",
                        "success"
                    );


                    currentUser =
                        data.user;


                    updateAccountButton();

                }

            }

            catch (error) {

                console.error(error);


                showAuthMessage(
                    "Something went wrong. Please try again.",
                    "error"
                );

            }

            finally {

                button.disabled =
                    false;


                button.textContent =
                    authMode === "signup"
                        ? "Create Account"
                        : "Login";

            }

        }


        /* =====================================================
           LOGIN
        ===================================================== */

        async function loginUser() {

            const email =
                document.getElementById(
                    "authEmail"
                ).value.trim();


            const password =
                document.getElementById(
                    "authPassword"
                ).value;


            if (!email || !password) {

                showAuthMessage(
                    "Please enter email and password.",
                    "error"
                );

                return;

            }


            const button =
                document.getElementById(
                    "authSubmitButton"
                );


            button.disabled =
                true;


            button.textContent =
                "Logging in...";


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signInWithPassword({

                            email: email,

                            password: password

                        });


                if (error) {

                    showAuthMessage(
                        error.message,
                        "error"
                    );

                    return;

                }


                currentUser =
                    data.user;


                updateAccountButton();


                showAuthMessage(
                    "Login successful!",
                    "success"
                );


                setTimeout(
                    function() {

                        updateAccountModal();

                    },
                    700
                );

            }

            catch (error) {

                console.error(error);


                showAuthMessage(
                    "Login failed. Please try again.",
                    "error"
                );

            }

            finally {

                button.disabled =
                    false;


                button.textContent =
                    "Login";

            }

        }


        /* =====================================================
           GOOGLE LOGIN
        ===================================================== */

        async function signInWithGoogle() {

            try {

                const {
                    error
                } =
                    await supabaseClient.auth
                        .signInWithOAuth({

                            provider: "google",

                            options: {

                                redirectTo:
                                    "https://meyyee.site"

                            }

                        });


                if (error) {

                    showAuthMessage(
                        error.message,
                        "error"
                    );

                }

            }

            catch (error) {

                console.error(error);


                showAuthMessage(
                    "Google login could not start. Please try again.",
                    "error"
                );

            }

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        async function logoutUser() {

            try {

                const {
                    error
                } =
                    await supabaseClient.auth
                        .signOut();


                if (error) {

                    alert(
                        error.message
                    );

                    return;

                }


                currentUser =
                    null;


                updateAccountButton();


                updateAccountModal();


                closeAccountModal();


                alert(
                    "You have been logged out."
                );

            }

            catch (error) {

                console.error(error);


                alert(
                    "Logout failed. Please try again."
                );

            }

        }


        /* =====================================================
           WEBSITE BUILDER
        ===================================================== */

        function openWebsiteBuilder() {

            if (!currentUser) {

                alert(
                    "Please Login or Create an Account first to create your own Meyyee Website."
                );


                openAccountModal();


                return;

            }


            document.getElementById(
                "websiteModal"
            ).style.display =
                "flex";

        }


        function closeWebsiteBuilder() {

            document.getElementById(
                "websiteModal"
            ).style.display =
                "none";

        }


        /* =====================================================
           HTML SECURITY
        ===================================================== */

        function escapeHTML(text) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;

        }


        /* =====================================================
           CREATE WEBSITE
        ===================================================== */

        function generateUserWebsite() {

            if (!currentUser) {

                closeWebsiteBuilder();


                alert(
                    "Please login first."
                );


                openAccountModal();


                return;

            }


            const title =
                document.getElementById(
                    "siteTitleInput"
                ).value.trim();


            const content =
                document.getElementById(
                    "siteContentInput"
                ).value.trim();


            const bgColor =
                document.getElementById(
                    "siteBgColor"
                ).value;


            const resultContainer =
                document.getElementById(
                    "resultContainer"
                );


            if (
                title === "" ||
                content === ""
            ) {

                alert(
                    "Please fill in both the title and content!"
                );

                return;

            }


            const safeTitle =
                escapeHTML(title);


            const safeContent =
                escapeHTML(content)
                    .replace(
                        /\n/g,
                        "<br>"
                    );


            document.body.classList.add(
                "searched"
            );


            document.getElementById(
                "welcomeSection"
            ).style.display =
                "none";


            closeWebsiteBuilder();


            resultContainer.innerHTML = `

                <div style="
                    background:#e0f2fe;
                    padding:12px;
                    border-radius:8px;
                    color:#0369a1;
                    font-weight:bold;
                    text-align:center;
                    margin-bottom:10px;
                ">

                    🎉 Your new website has been created successfully!

                    <br>

                    <small>
                        Meyyee Sites Live
                    </small>

                </div>


                <div
                    class="user-website-card"
                    style="
                        background-color:${bgColor};
                        border:2px solid #cbd5e1;
                    "
                >

                    <h2>
                        ${safeTitle}
                    </h2>


                    <hr style="
                        margin:15px 0;
                        border:0;
                        border-top:1px solid rgba(0,0,0,0.1);
                    ">


                    <p>
                        ${safeContent}
                    </p>


                    <div style="
                        margin-top:20px;
                        font-size:0.85rem;
                        color:#64748b;
                    ">

                        Published via

                        <strong>
                            Meyyee Universal Truth Engine
                        </strong>

                    </div>

                </div>

            `;

        }


        /* =====================================================
           VOICE SEARCH
        ===================================================== */

        function startVoiceSearch() {

            const SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;


            if (!SpeechRecognition) {

                alert(
                    "Your browser does not support voice search. Please use Chrome or Edge!"
                );

                return;

            }


            const recognition =
                new SpeechRecognition();


            recognition.lang =
                "en-US";


            recognition.onstart =
                function() {

                    document.getElementById(
                        "userInput"
                    ).placeholder =
                        "Listening... Speak now 🎙️";

                };


            recognition.onresult =
                function(event) {

                    const spokenText =
                        event
                            .results[0][0]
                            .transcript;


                    document.getElementById(
                        "userInput"
                    ).value =
                        spokenText;


                    document.getElementById(
                        "userInput"
                    ).placeholder =
                        "Search truth";


                    handleSearch();

                };


            recognition.onerror =
                function() {

                    document.getElementById(
                        "userInput"
                    ).placeholder =
                        "Search truth";


                    alert(
                        "Could not hear voice, please try again."
                    );

                };


            recognition.start();

        }


        /* =====================================================
           SEARCH ENGINE
        ===================================================== */

        function handleSearch() {

            const input =
                document.getElementById(
                    "userInput"
                );


            const query =
                input.value
                    .trim()
                    .toLowerCase();


            const resultContainer =
                document.getElementById(
                    "resultContainer"
                );


            document.body.classList.add(
                "searched"
            );


            const welcomeSec =
                document.getElementById(
                    "welcomeSection"
                );


            if (welcomeSec) {

                welcomeSec.style.display =
                    "none";

            }


            if (query === "") {

                resultContainer.innerHTML = `

                    <div
                        class="result-box"
                        style="
                            text-align:center;
                            background:#fff;
                            border:1px solid #cbd5e1;
                        "
                    >

                        <strong>
                            Search Result:
                        </strong>

                        (Empty search)

                        <br><br>

                        <strong>
                            Meyyee Engine:
                 Meyyee Engine:
                        </strong>

                        Searching for your Universal Truth...

                    </div>

                `;

            }

        }


        /* =====================================================
           ENTER KEY SEARCH
        ===================================================== */

        document
            .getElementById("userInput")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        handleSearch();

                    }

                }
            );


        /* =====================================================
           CLOSE WEBSITE MODAL OUTSIDE
        ===================================================== */

        document
            .getElementById("websiteModal")
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === this
                    ) {

                        closeWebsiteBuilder();

                    }

                }
            );


        /* =====================================================
           CLOSE ACCOUNT MODAL OUTSIDE
        ===================================================== */

        document
            .getElementById("accountModal")
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === this
                    ) {

                        closeAccountModal();

                    }

                }
            );


    </script>
