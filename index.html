<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Meyyee - Universal Truth Engine</title>

<link rel="manifest" href="/manifest.json">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{

    background:
        radial-gradient(
            circle at top,
            #172033 0%,
            #080b12 45%,
            #030509 100%
        );

    color:#f8fafc;

    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    overflow-x:hidden;

    padding:35px 15px;

    transition:0.4s ease;
}


/* =====================================================
   TOP NAVIGATION
===================================================== */

.top-nav{

    position:absolute;

    top:18px;
    right:25px;

    display:flex;
    gap:10px;

    align-items:center;

    z-index:100;
}

.nav-btn,
.account-btn{

    padding:9px 16px;

    border-radius:25px;

    cursor:pointer;

    font-weight:600;

    transition:0.25s;

    backdrop-filter:blur(10px);
}

.nav-btn{

    background:rgba(255,255,255,0.07);

    border:1px solid rgba(255,255,255,0.15);

    color:#e2e8f0;
}

.nav-btn:hover{

    background:rgba(255,255,255,0.14);

    transform:translateY(-1px);
}

.account-btn{

    border:1px solid transparent;

    color:white;

    background:
        linear-gradient(#111827,#111827) padding-box,
        linear-gradient(
            90deg,
            #ff004c,
            #ff9d00,
            #00ff88,
            #00b7ff,
            #8b5cf6,
            #ff00cc
        ) border-box;

    box-shadow:
        0 0 15px rgba(0,183,255,0.18);
}

.account-btn:hover{

    transform:translateY(-1px) scale(1.02);

    box-shadow:
        0 0 20px rgba(0,183,255,0.35);
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container{

    width:100%;
    max-width:900px;

    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;

    margin-top:35px;
}


/* =====================================================
   SEARCH SECTION
===================================================== */

.search-section{

    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;

    margin-top:8vh;

    transition:0.4s ease;
}

.search-logo{

    text-align:center;
}

h1{

    font-size:4rem;

    font-weight:900;

    letter-spacing:7px;

    margin-bottom:7px;

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #ff9100,
            #ffee00,
            #00e676,
            #00b0ff,
            #7c4dff,
            #ff00c8
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    filter:
        drop-shadow(
            0 0 12px rgba(0,183,255,0.25)
        );
}

.subtitle{

    font-size:0.82rem;

    letter-spacing:4px;

    color:#94a3b8;

    text-transform:uppercase;

    margin-bottom:35px;
}


/* =====================================================
   CLOUD SEARCH BAR
===================================================== */

.search-cloud{

    position:relative;

    width:100%;
    max-width:680px;

    padding:4px;

    border-radius:60px;

    background:
        linear-gradient(
            90deg,
            #ff0055,
            #ff9900,
            #ffee00,
            #00ff88,
            #00c8ff,
            #7c4dff,
            #ff00cc,
            #ff0055
        );

    background-size:300% 300%;

    animation:
        rainbowBorder 7s linear infinite;

    box-shadow:

        0 0 12px rgba(255,0,85,0.25),

        0 0 25px rgba(0,200,255,0.18),

        0 15px 50px rgba(0,0,0,0.5);
}

@keyframes rainbowBorder{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}


/* cloud bumps */

.search-cloud::before,
.search-cloud::after{

    content:"";

    position:absolute;

    background:#080b12;

    border-radius:50%;

    z-index:0;
}

.search-cloud::before{

    width:65px;
    height:65px;

    left:45px;
    top:-20px;
}

.search-cloud::after{

    width:80px;
    height:80px;

    right:70px;
    top:-25px;
}


/* inner search */

.search-box{

    position:relative;

    z-index:2;

    width:100%;

    min-height:64px;

    display:flex;

    align-items:center;

    gap:5px;

    padding:8px 12px 8px 25px;

    border-radius:55px;

    background:
        linear-gradient(
            145deg,
            #0d111b,
            #070a10
        );

    box-shadow:

        inset 0 0 20px rgba(255,255,255,0.025),

        0 5px 25px rgba(0,0,0,0.45);
}

.search-input{

    flex:1;

    min-width:0;

    border:none;
    outline:none;

    background:transparent;

    color:#f8fafc;

    font-size:1.08rem;

    padding:8px 5px;
}

.search-input::placeholder{

    color:#64748b;
}

.mic-btn,
.search-btn{

    width:45px;
    height:45px;

    border:none;

    border-radius:50%;

    background:transparent;

    color:#cbd5e1;

    font-size:1.25rem;

    cursor:pointer;

    transition:0.2s;
}

.mic-btn:hover,
.search-btn:hover{

    background:rgba(255,255,255,0.08);

    transform:scale(1.1);

    color:white;
}


/* =====================================================
   SEARCHED STATE
===================================================== */

body.searched .search-section{

    margin-top:0;

    flex-direction:row;

    align-items:center;

    justify-content:center;

    gap:20px;

    border-bottom:1px solid rgba(255,255,255,0.08);

    padding-bottom:20px;
}

body.searched h1{

    font-size:2rem;

    letter-spacing:4px;

    margin-bottom:0;
}

body.searched .subtitle{

    display:none;
}

body.searched .search-cloud{

    max-width:560px;
}

body.searched .search-box{

    min-height:52px;
}


/* =====================================================
   WELCOME
===================================================== */

#welcomeSection{

    display:flex;

    flex-direction:column;

    align-items:center;

    margin-top:45px;
}

.video-container{

    width:170px;
    height:170px;

    border-radius:25px;

    overflow:hidden;

    background:#111827;

    box-shadow:
        0 15px 45px rgba(0,0,0,0.45);
}

.video-container video{

    width:100%;
    height:100%;

    object-fit:cover;
}

.welcome-text{

    margin-top:15px;

    margin-bottom:20px;

    font-size:1.3rem;

    font-weight:700;

    letter-spacing:4px;

    color:#e2e8f0;
}


/* =====================================================
   RESULTS
===================================================== */

#resultContainer{

    width:100%;
    max-width:700px;

    display:flex;

    flex-direction:column;

    gap:20px;

    margin-top:30px;
}

.result-box{

    width:100%;

    padding:25px;

    border-radius:12px;

    text-align:left;

    background:
        linear-gradient(
            135deg,
            #f4e8c1,
            #e6d39e
        );

    border:2px solid #8b5a2b;

    color:#2c1d0c;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.3);
}

.board-title{

    text-align:center;

    color:#78350f;

    font-size:1.2rem;

    font-weight:bold;

    padding-bottom:10px;

    margin-bottom:15px;

    border-bottom:1px dashed #8b5a2b;
}

.kural-lines{

    text-align:center;

    font-weight:bold;

    color:#451a03;

    font-size:1.15rem;

    line-height:1.7;

    margin-bottom:15px;
}

.meaning-box{

    padding:13px;

    border-radius:7px;

    background:rgba(255,255,255,0.4);

    line-height:1.8;
}


/* =====================================================
   WEBSITE CARD
===================================================== */

.user-website-card{

    width:100%;

    border-radius:15px;

    padding:30px;

    text-align:center;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.3);
}


/* =====================================================
   MODALS
===================================================== */

.modal-overlay{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.72);

    backdrop-filter:blur(7px);

    justify-content:center;
    align-items:center;

    z-index:1000;

    padding:15px;
}

.modal-content{

    width:100%;
    max-width:500px;

    max-height:90vh;

    overflow-y:auto;

    padding:28px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #111827,
            #080b12
        );

    border:1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 25px 80px rgba(0,0,0,0.65);

    color:white;

    text-align:left;
}

.modal-content h3{

    margin-bottom:20px;

    color:#f8fafc;
}

.form-group{

    margin-bottom:16px;
}

.form-group label{

    display:block;

    margin-bottom:6px;

    font-size:0.9rem;

    font-weight:600;

    color:#cbd5e1;
}

.form-group input,
.form-group textarea,
.form-group select{

    width:100%;

    padding:11px;

    border-radius:8px;

    border:1px solid #334155;

    outline:none;

    background:#0b1120;

    color:white;

    font-size:1rem;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{

    border-color:#38bdf8;

    box-shadow:
        0 0 10px rgba(56,189,248,0.2);
}

.form-group textarea{

    resize:vertical;

    min-height:110px;
}

.modal-actions{

    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:20px;

    flex-wrap:wrap;
}

.btn-primary,
.btn-secondary{

    padding:10px 20px;

    border-radius:8px;

    cursor:pointer;

    font-weight:600;
}

.btn-primary{

    color:white;

    border:1px solid transparent;

    background:
        linear-gradient(#2563eb,#2563eb) padding-box,
        linear-gradient(
            90deg,
            #00c8ff,
            #8b5cf6,
            #ff00cc
        ) border-box;
}

.btn-secondary{

    background:#1e293b;

    color:#cbd5e1;

    border:1px solid #334155;
}

.btn-primary:hover{

    filter:brightness(1.15);
}

.btn-secondary:hover{

    background:#334155;
}


/* =====================================================
   AUTH
===================================================== */

.auth-tabs{

    display:flex;

    gap:10px;

    margin-bottom:20px;
}

.auth-tab{

    flex:1;

    padding:10px;

    border-radius:8px;

    cursor:pointer;

    font-weight:600;

    background:#0f172a;

    border:1px solid #334155;

    color:#cbd5e1;
}

.auth-tab.active{

    background:#2563eb;

    border-color:#2563eb;

    color:white;
}

.auth-message{

    display:none;

    margin-top:15px;

    padding:11px;

    border-radius:8px;

    font-size:0.9rem;

    line-height:1.5;
}

.auth-message.success{

    display:block;

    background:#064e3b;

    color:#a7f3d0;
}

.auth-message.error{

    display:block;

    background:#450a0a;

    color:#fecaca;
}

.user-info{

    padding:15px;

    border-radius:10px;

    background:#0f172a;

    border:1px solid #334155;

    color:#cbd5e1;

    word-break:break-word;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    body{

        padding:
            75px
            12px
            30px;
    }

    .top-nav{

        top:12px;

        right:12px;

        left:12px;

        justify-content:flex-end;
    }

    .nav-btn,
    .account-btn{

        padding:7px 11px;

        font-size:0.78rem;
    }

    h1{

        font-size:3rem;

        letter-spacing:5px;
    }

    .subtitle{

        font-size:0.7rem;

        letter-spacing:2px;
    }

    .search-cloud{

        max-width:100%;
    }

    .search-cloud::before{

        width:50px;
        height:50px;

        left:30px;
        top:-16px;
    }

    .search-cloud::after{

        width:60px;
        height:60px;

        right:35px;
        top:-20px;
    }

    .search-box{

        min-height:58px;

        padding-left:17px;
    }

    .search-input{

        font-size:0.95rem;
    }

    body.searched .search-section{

        flex-direction:column;

        gap:12px;
    }

    body.searched h1{

        font-size:1.6rem;
    }

    body.searched .search-cloud{

        width:100%;
    }

    .modal-content{

        padding:22px;
    }

    .result-box{

        padding:18px;
    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *{

        animation:none !important;

        transition:none !important;
    }
}

</style>

</head>

<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://tukrsibwlwsmhlggqhxo.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_XVVpGFYayIZPn9OET1ioVw_SQPKgt27";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


let currentUser = null;

let authMode = "login";


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener("load", async function(){

    await checkUser();

    supabaseClient.auth.onAuthStateChange(
        function(event, session){

            currentUser =
                session ? session.user : null;

            updateAccountButton();

            updateAccountModal();

        }
    );

});


/* =====================================================
   CHECK USER
===================================================== */

async function checkUser(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.getUser();

        if(error){

            currentUser = null;

        }else{

            currentUser =
                data.user || null;

        }

        updateAccountButton();

    }catch(error){

        console.error(
            "User check error:",
            error
        );

    }

}


/* =====================================================
   ACCOUNT BUTTON
===================================================== */

function updateAccountButton(){

    const button =
        document.getElementById(
            "accountButton"
        );

    if(!button){
        return;
    }


    /*
       IMPORTANT:
       Do NOT show user's email in the
       main search bar.
    */

    if(currentUser){

        button.innerHTML =
            "👤 Account";

    }else{

        button.innerHTML =
            "👤 Account";

    }

}


/* =====================================================
   ACCOUNT MODAL
===================================================== */

function openAccountModal(){

    document.getElementById(
        "accountModal"
    ).style.display = "flex";

    updateAccountModal();

}

function closeAccountModal(){

    document.getElementById(
        "accountModal"
    ).style.display = "none";

}


function updateAccountModal(){

    const loggedInSection =
        document.getElementById(
            "loggedInSection"
        );

    const authSection =
        document.getElementById(
            "authSection"
        );

    const emailDisplay =
        document.getElementById(
            "userEmailDisplay"
        );


    if(currentUser){

        loggedInSection.style.display =
            "block";

        authSection.style.display =
            "none";

        /*
           Email can be shown here,
           but NEVER password.
        */

        emailDisplay.textContent =
            currentUser.email || "";

    }else{

        loggedInSection.style.display =
            "none";

        authSection.style.display =
            "block";

    }

}


/* =====================================================
   LOGIN TAB
===================================================== */

function showLogin(){

    authMode = "login";

    document.getElementById(
        "loginTab"
    ).classList.add("active");

    document.getElementById(
        "signupTab"
    ).classList.remove("active");

    const button =
        document.getElementById(
            "authSubmitButton"
        );

    button.textContent =
        "Login";

    button.onclick =
        loginUser;

    clearAuthMessage();

}


/* =====================================================
   SIGNUP TAB
===================================================== */

function showSignup(){

    authMode = "signup";

    document.getElementById(
        "signupTab"
    ).classList.add("active");

    document.getElementById(
        "loginTab"
    ).classList.remove("active");

    const button =
        document.getElementById(
            "authSubmitButton"
        );

    button.textContent =
        "Create Account";

    button.onclick =
        signupUser;

    clearAuthMessage();

}


/* =====================================================
   AUTH MESSAGE
===================================================== */

function showAuthMessage(
    message,
    type
){

    const box =
        document.getElementById(
            "authMessage"
        );

    box.textContent =
        message;

    box.className =
        "auth-message " + type;

}


function clearAuthMessage(){

    const box =
        document.getElementById(
            "authMessage"
        );

    box.textContent = "";

    box.className =
        "auth-message";

}


/* =====================================================
   SIGN UP
===================================================== */

async function signupUser(){

    const email =
        document.getElementById(
            "authEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "authPassword"
        ).value;


    if(!email || !password){

        showAuthMessage(
            "Please enter email and password.",
            "error"
        );

        return;

    }


    if(password.length < 6){

        showAuthMessage(
            "Password must contain at least 6 characters.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "authSubmitButton"
        );

    button.disabled = true;

    button.textContent =
        "Creating...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{

                emailRedirectTo:
                    "https://meyyee.site"

            }

        });


        if(error){

            showAuthMessage(
                error.message,
                "error"
            );

            return;

        }


        if(data.user && !data.session){

            showAuthMessage(

                "Account created. Please confirm your email, then return to Meyyee and Login.",

                "success"

            );

        }else{

            currentUser =
                data.user;

            updateAccountButton();

            updateAccountModal();

            showAuthMessage(
                "Account created successfully!",
                "success"
            );

        }

    }catch(error){

        console.error(error);

        showAuthMessage(
            "Something went wrong. Please try again.",
            "error"
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "Create Account";

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function loginUser(){

    const email =
        document.getElementById(
            "authEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "authPassword"
        ).value;


    if(!email || !password){

        showAuthMessage(
            "Please enter email and password.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "authSubmitButton"
        );

    button.disabled = true;

    button.textContent =
        "Logging in...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            showAuthMessage(
                error.message,
                "error"
            );

            return;

        }


        currentUser =
            data.user;

        updateAccountButton();

        showAuthMessage(
            "Login successful!",
            "success"
        );


        setTimeout(
            function(){

                updateAccountModal();

            },
            600
        );


    }catch(error){

        console.error(error);

        showAuthMessage(
            "Login failed. Please try again.",
            "error"
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "Login";

    }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logoutUser(){

    const {
        error
    } =
    await supabaseClient.auth.signOut();


    if(error){

        showAuthMessage(
            error.message,
            "error"
        );

        return;

    }


    currentUser = null;

    updateAccountButton();

    updateAccountModal();

    closeAccountModal();

}


/* =====================================================
   WEBSITE BUILDER
===================================================== */

function openWebsiteBuilder(){

    if(!currentUser){

        alert(
            "Please Login or Create an Account first."
        );

        openAccountModal();

        return;

    }


    document.getElementById(
        "websiteModal"
    ).style.display = "flex";

}


function closeWebsiteBuilder(){

    document.getElementById(
        "websiteModal"
    ).style.display = "none";

}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================================
   CREATE WEBSITE
===================================================== */

function generateUserWebsite(){

    if(!currentUser){

        closeWebsiteBuilder();

        alert(
            "Please login first."
        );

        openAccountModal();

        return;

    }


    const title =
        document.getElementById(
            "siteTitleInput"
        ).value.trim();


    const content =
        document.getElementById(
            "siteContentInput"
        ).value.trim();


    const bgColor =
        document.getElementById(
            "siteBgColor"
        ).value;


    if(
        title === "" ||
        content === ""
    ){

        alert(
            "Please fill in both title and content."
        );

        return;

    }


    const safeTitle =
        escapeHTML(title);

    const safeContent =
        escapeHTML(content)
            .replace(/\n/g,"<br>");


    document.body.classList.add(
        "searched"
    );


    document.getElementById(
        "welcomeSection"
    ).style.display =
        "none";


    closeWebsiteBuilder();


    document.getElementById(
        "resultContainer"
    ).innerHTML = `

        <div
            style="
                padding:13px;
                border-radius:10px;
                background:#064e3b;
                color:#a7f3d0;
                text-align:center;
                font-weight:bold;
            "
        >

            🎉 Your website has been created!

            <br>

            <small>
                Meyyee Sites
            </small>

        </div>


        <div
            class="user-website-card"
            style="
                background:${bgColor};
                color:#111827;
                border:2px solid #cbd5e1;
            "
        >

            <h2>
                ${safeTitle}
            </h2>

            <hr
                style="
                    margin:15px 0;
                    border:0;
                    border-top:
                        1px solid
                        rgba(0,0,0,0.15);
                "
            >

            <p>
                ${safeContent}
            </p>

            <div
                style="
                    margin-top:20px;
                    font-size:0.85rem;
                    color:#64748b;
                "
            >

                Published via

                <strong>
                    Meyyee
                </strong>

            </div>

        </div>

    `;

}


/* =====================================================
   VOICE SEARCH
===================================================== */

function startVoiceSearch(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
            "Voice search is not supported in this browser. Please use Chrome."
        );

        return;

    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    const input =
        document.getElementById(
            "userInput"
        );


    recognition.onstart =
        function(){

            input.placeholder =
                "Listening... 🎙️";

        };


    recognition.onresult =
        function(event){

            input.value =
                event.results[0][0]
                    .transcript;

            input.placeholder =
                "Search truth...";

            performSearch();

        };


    recognition.onerror =
        function(){

            input.placeholder =
                "Search truth...";

            alert(
                "Could not hear your voice. Please try again."
            );

        };


    recognition.onend =
        function(){

            input.placeholder =
                "Search truth...";

        };


    recognition.start();

}
