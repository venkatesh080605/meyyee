<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meyyee - Universal Truth Engine</title>

    <link rel="manifest" href="/manifest.json">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }


        html {
            width: 100%;
            min-height: 100%;
        }


        body {
            background-color: #ffffff;
            color: #111827;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;

            min-height: 100vh;
            width: 100%;

            overflow-x: hidden;

            position: relative;

            padding: 40px 15px;

            transition: all 0.4s ease;
        }


        /* ==========================================
           TOP NAVIGATION
        ========================================== */

        .top-nav {
            position: absolute;

            top: 15px;
            right: 25px;

            display: flex;
            flex-direction: column;

            gap: 8px;

            align-items: stretch;

            z-index: 100;
        }


        .nav-btn {
            background: #f1f5f9;

            border: 1px solid #cbd5e1;

            padding: 8px 16px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: 600;

            color: #334155;

            transition: all 0.2s;

            white-space: nowrap;
        }


        .nav-btn:hover {
            background: #e2e8f0;

            border-color: #94a3b8;
        }


        .account-btn {
            background: #2563eb;

            color: white;

            border: none;

            padding: 9px 16px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: 600;

            white-space: nowrap;
        }


        .account-btn:hover {
            background: #1d4ed8;
        }


        /* ==========================================
           MAIN CONTAINER
        ========================================== */

        .container {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            text-align: center;

            width: 100%;

            max-width: 800px;

            transition: all 0.4s ease;

            margin-top: 20px;
        }


        /* ==========================================
           SEARCH SECTION
        ========================================== */

        .search-section {
            display: flex;

            flex-direction: column;

            align-items: center;

            width: 100%;

            transition: all 0.4s ease;

            margin-top: 5vh;
        }


        body.searched .search-section {
            margin-top: 0;

            flex-direction: row;

            justify-content: flex-start;

            align-items: center;

            gap: 20px;

            border-bottom: 1px solid #e2e8f0;

            padding-bottom: 20px;

            width: 100%;

            max-width: 900px;
        }


        h1 {
            font-size: 3.8rem;

            letter-spacing: 6px;

            font-weight: 900;

            margin-bottom: 5px;

            background: linear-gradient(
                90deg,
                #ff0000,
                #ff7f00,
                #ffff00,
                #008000,
                #0000ff,
                #4b0082,
                #ee82ee
            );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            transition: font-size 0.4s ease;
        }


        body.searched h1 {
            font-size: 2rem;

            letter-spacing: 3px;

            margin-bottom: 0;
        }


        .subtitle {
            font-size: 0.9rem;

            letter-spacing: 2px;

            color: #64748b;

            margin-bottom: 35px;

            text-transform: uppercase;

            transition: opacity 0.3s;
        }


        body.searched .subtitle {
            display: none;
        }


        /* ==========================================
           MEYYEE CLOUD SEARCH
        ========================================== */

        .search-box {
            position: relative;

            width: 100%;

            max-width: 620px;

            /*
               FINAL DESKTOP CLOUD HEIGHT

               Old: 125px
               New: 165px
            */

            height: 165px;

            margin-bottom: 25px;

            transition: all 0.3s ease;

            flex-shrink: 0;
        }


        /* ==========================================
           CLOUD IMAGE
        ========================================== */

        .cloud-outline {
            position: absolute;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            display: block;

            pointer-events: none;

            z-index: 1;

            object-fit: fill;
        }


        /* ==========================================
           SEARCH INPUT
        ========================================== */

        .search-input {
            position: absolute;

            z-index: 2;

            left: 12%;

            /*
               FINAL VERTICAL CENTER

               Cloud height = 165px
               Input height = 50px
               Center = (165 - 50) / 2
                      = 57.5px

               Using 57px.
            */

            top: 57px;

            width: 76%;

            height: 50px;

            border: none;

            outline: none;

            background: transparent;

            text-align: center;

            font-size: 1.05rem;

            color: #1e293b;

            min-width: 0;

            padding: 0 45px;
        }


        .search-input::placeholder {
            color: #64748b;

            opacity: 1;
        }


        /* ==========================================
           SEARCH BUTTONS
        ========================================== */

        .mic-btn,
        .search-btn {
            position: absolute;

            z-index: 3;

            background: transparent;

            border: none;

            outline: none;

            font-size: 1.25rem;

            cursor: pointer;

            width: 40px;

            height: 40px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            transition: transform 0.2s;
        }


        .mic-btn {
            left: 10%;

            /*
               Centered inside 165px cloud.
            */

            top: 62px;
        }


        .search-btn {
            right: 10%;

            /*
               Centered inside 165px cloud.
            */

            top: 62px;
        }


        .mic-btn:hover,
        .search-btn:hover {
            transform: scale(1.15);
        }


        /* ==========================================
           SEARCHED DESKTOP
        ========================================== */

        body.searched .search-box {
            max-width: 500px;

            height: 100px;

            margin-bottom: 0;
        }


        body.searched .search-input {
            top: 25px;

            height: 40px;

            font-size: 0.95rem;
        }


        body.searched .mic-btn,
        body.searched .search-btn {
            top: 30px;

            width: 35px;

            height: 35px;

            font-size: 1rem;
        }


        /* ==========================================
           WELCOME
        ========================================== */

        #welcomeSection {
            display: flex;

            flex-direction: column;

            align-items: center;

            transition: all 0.3s ease;

            width: 100%;
        }


        .video-container {
            width: 150px;

            height: 150px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 5px;

            background: transparent;
        }


        .video-container video {
            width: 100%;

            height: 100%;

            object-fit: cover;

            border-radius: 15px;

            background: transparent;
        }


        .welcome-text {
            font-size: 1.3rem;

            font-weight: bold;

            color: #0f172a;

            letter-spacing: 2px;

            margin-top: 5px;

            margin-bottom: 20px;
        }


        /* ==========================================
           INTRO ANIMATION
        ========================================== */

        #intro-animation {
            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background-color: #ffffff;

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 9999;

            overflow: hidden;

            transition: opacity 0.5s ease;
        }


        .anim-wrapper {
            position: relative;

            width: 300px;

            height: 350px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        .piece {
            position: absolute;

            width: 150px;

            height: 150px;

            background-image:
                url('/launchericon-512x512.png');

            background-size: 300px 300px;

            background-repeat: no-repeat;

            opacity: 0;

            transition:
                transform 3s cubic-bezier(0.1, 0.9, 0.2, 1),
                opacity 1s ease;
        }


        .piece-tl {
            top: 0;

            left: 0;

            background-position: 0 0;

            transform:
                translate(-60vw, -60vh)
                rotate(-45deg);
        }


        .piece-tr {
            top: 0;

            right: 0;

            background-position: -150px 0;

            transform:
                translate(60vw, -60vh)
                rotate(45deg);
        }


        .piece-bl {
            bottom: 50px;

            left: 0;

            background-position: 0 -150px;

            transform:
                translate(-60vw, 60vh)
                rotate(45deg);
        }


        .piece-br {
            bottom: 50px;

            right: 0;

            background-position: -150px -150px;

            transform:
                translate(60vw, 60vh)
                rotate(-45deg);
        }


        .anim-title {
            position: absolute;

            bottom: -5px;

            font-size: 40px;

            font-weight: 900;

            letter-spacing: 6px;

            background: linear-gradient(
                90deg,
                #ff0000,
                #ff7f00,
                #ffff00,
                #008000,
                #0000ff,
                #4b0082,
                #ee82ee
            );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            opacity: 0;

            transform: translateY(20px);

            transition:
                opacity 0.8s ease 2.2s,
                transform 0.8s ease 2.2s;
        }


        #intro-animation.animate .piece {
            transform:
                translate(0, 0)
                rotate(0deg);

            opacity: 1;
        }


        #intro-animation.animate .anim-title {
            opacity: 1;

            transform: translateY(0);
        }


        /* ==========================================
           MODAL
        ========================================== */

        .modal-overlay {
            display: none;

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background: rgba(0, 0, 0, 0.5);

            justify-content: center;

            align-items: center;

            z-index: 1000;

            padding: 15px;
        }


        .modal-content {
            background: #ffffff;

            padding: 30px;

            border-radius: 12px;

            width: 90%;

            max-width: 500px;

            text-align: left;

            box-shadow:
                0 15px 35px rgba(0,0,0,0.2);

            max-height: 90vh;

            overflow-y: auto;
        }


        .modal-content h3 {
            margin-bottom: 20px;

            color: #1e293b;
        }


        .form-group {
            margin-bottom: 15px;
        }


        .form-group label {
            display: block;

            font-size: 0.9rem;

            font-weight: 600;

            color: #475569;

            margin-bottom: 5px;
        }


        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;

            padding: 10px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            font-size: 1rem;

            outline: none;
        }


        .form-group textarea {
            resize: vertical;

            height: 100px;
        }


        .modal-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 20px;

            flex-wrap: wrap;
        }


        .btn-primary {
            background: #2563eb;

            color: white;

            border: none;

            padding: 10px 20px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: 600;
        }


        .btn-primary:hover {
            background: #1d4ed8;
        }


        .btn-secondary {
            background: #e2e8f0;

            color: #334155;

            border: none;

            padding: 10px 20px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: 600;
        }


        /* ==========================================
           ACCOUNT
        ========================================== */

        .account-option {
            width: 100%;

            height: 48px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

            font-weight: 600;

            margin-bottom: 12px;

            transition: 0.2s;
        }


        .google-option {
            background: #ffffff;

            color: #1e293b;

            border: 1px solid #cbd5e1;
        }


        .google-option:hover {
            background: #f8fafc;
        }


        .guest-option {
            background: #2563eb;

            color: #ffffff;

            border: 1px solid #2563eb;
        }


        .guest-option:hover {
            background: #1d4ed8;
        }


        .account-note {
            text-align: center;

            color: #94a3b8;

            font-size: 0.78rem;

            line-height: 1.5;

            margin-top: 8px;
        }


        .user-info {
            background: #eff6ff;

            padding: 15px;

            border-radius: 8px;

            margin-bottom: 15px;

            color: #1e40af;

            word-break: break-word;

            line-height: 1.6;
        }


        /* ==========================================
           RESULTS
        ========================================== */

        #resultContainer {
            width: 100%;

            max-width: 680px;

            display: flex;

            flex-direction: column;

            gap: 20px;

            margin-top: 25px;
        }


        .result-box {
            width: 100%;

            background: linear-gradient(
                135deg,
                #f4e8c1 0%,
                #e6d39e 100%
            );

            border: 2px solid #8b5a2b;

            border-radius: 8px;

            padding: 25px;

            font-size: 1.05rem;

            color: #2c1d0c;

            text-align: left;

            box-shadow:
                0 8px 25px
                rgba(139, 90, 43, 0.25);
        }


        .board-title {
            text-align: center;

            color: #78350f;

            font-size: 1.25rem;

            font-weight: bold;

            margin-bottom: 12px;

            border-bottom: 1px dashed #8b5a2b;

            padding-bottom: 8px;
        }


        .kural-lines {
            font-weight: bold;

            color: #451a03;

            font-size: 1.15rem;

            line-height: 1.6;

            text-align: center;

            margin-bottom: 15px;
        }


        .meaning-box {
            color: #2c1d0c;

            line-height: 1.7;

            background: rgba(255, 255, 255, 0.4);

            padding: 12px;

            border-radius: 6px;
        }


        .user-website-card {
            width: 100%;

            border-radius: 12px;

            padding: 30px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.1);

            text-align: center;

            margin-top: 15px;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            body {
                width: 100%;

                min-height: 100vh;

                padding:
                    78px
                    10px
                    30px;
            }


            .top-nav {
                top: 10px;

                right: 10px;

                gap: 5px;
            }


            .nav-btn,
            .account-btn {
                padding:
                    7px
                    11px;

                font-size: 0.75rem;

                white-space: nowrap;
            }


            .container {
                width: 100%;

                max-width: 800px;

                margin-top: 0;
            }


            .search-section {
                width: 100%;

                margin-top: 7vh;

                display: flex;

                flex-direction: column;

                align-items: center;
            }


            h1 {
                font-size:
                    clamp(
                        2.5rem,
                        13vw,
                        3.8rem
                    );

                letter-spacing: 4px;

                line-height: 1.1;

                margin-bottom: 6px;

                white-space: nowrap;
            }


            .subtitle {
                font-size: 0.70rem;

                letter-spacing: 1.5px;

                margin-bottom: 20px;
            }


            /* ======================================
               FINAL MOBILE CLOUD
            ====================================== */

            .search-box {
                width: 100%;

                max-width: 620px;

                /*
                   FINAL MOBILE CLOUD HEIGHT

                   Old: 105px
                   New: 135px
                */

                height: 135px;

                margin-bottom: 20px;
            }


            .cloud-outline {
                width: 100%;

                height: 100%;

                object-fit: fill;
            }


            .search-input {
                /*
                   Centered inside 135px cloud.
                */

                top: 46px;

                left: 10%;

                width: 80%;

                height: 42px;

                font-size: 15px;

                padding:
                    0
                    35px;
            }


            .mic-btn {
                left: 8%;

                top: 51px;

                width: 35px;

                height: 35px;

                font-size: 1rem;
            }


            .search-btn {
                right: 8%;

                top: 51px;

                width: 35px;

                height: 35px;

                font-size: 1rem;
            }


            .video-container {
                width: 130px;

                height: 130px;

                max-width: 40vw;

                max-height: 40vw;
            }


            .welcome-text {
                font-size: 1.05rem;

                letter-spacing: 1.5px;

                margin-bottom: 15px;
            }


            #resultContainer {
                width: 100%;

                max-width: 680px;

                margin-top: 18px;

                gap: 15px;
            }


            .result-box {
                width: 100%;

                padding:
                    18px
                    14px;

                font-size: 0.95rem;

                overflow-wrap: break-word;
            }


            .board-title {
                font-size: 1.05rem;

                line-height: 1.4;
            }


            .kural-lines {
                font-size: 1rem;

                line-height: 1.7;
            }


            .meaning-box {
                font-size: 0.92rem;

                line-height: 1.65;

                padding: 10px;
            }


            .user-website-card {
                width: 100%;

                padding:
                    20px
                    14px;

                overflow-wrap: break-word;
            }


            .modal-overlay {
                padding: 12px;
            }


            .modal-content {
                width: 100%;

                max-width: 500px;

                max-height: 90vh;

                padding:
                    22px
                    16px;
            }


            .form-group input,
            .form-group textarea,
            .form-group select {
                font-size: 16px;
            }


            /* ======================================
               SEARCHED MOBILE
            ====================================== */

            body.searched .search-section {
                width: 100%;

                max-width: 900px;

                margin-top: 0;

                display: flex;

                flex-direction: row;

                align-items: center;

                justify-content: flex-start;

                gap: 8px;

                padding-bottom: 14px;
            }


            body.searched .search-section > div:first-child {
                width: auto;

                flex-shrink: 0;
            }


            body.searched h1 {
                font-size: 1.25rem;

                letter-spacing: 2px;

                margin: 0;
            }


            body.searched .search-box {
                flex: 1;

                width: auto;

                max-width: none;

                height: 60px;

                margin-bottom: 0;
            }


            body.searched .search-input {
                left: 10%;

                top: 10px;

                width: 80%;

                font-size: 14px;

                height: 38px;

                padding:
                    0
                    28px;
            }


            body.searched .mic-btn {
                left: 5%;

                top: 14px;

                width: 30px;

                height: 30px;

                font-size: 0.9rem;
            }


            body.searched .search-btn {
                right: 5%;

                top: 14px;

                width: 30px;

                height: 30px;

                font-size: 0.9rem;
            }

        }


        /* ==========================================
           VERY SMALL PHONES
        ========================================== */

        @media (max-width: 380px) {

            body {
                padding-left: 8px;

                padding-right: 8px;
            }


            .top-nav {
                right: 8px;
            }


            .nav-btn,
            .account-btn {
                padding:
                    6px
                    9px;

                font-size: 0.70rem;
            }


            h1 {
                font-size: 2.4rem;

                letter-spacing: 3px;
            }


            .subtitle {
                font-size: 0.62rem;

                letter-spacing: 1.2px;
            }


            /* ======================================
               VERY SMALL PHONE CLOUD
            ====================================== */

            .search-box {
                height: 120px;
            }


            .search-input {
                left: 8%;

                width: 84%;

                top: 38px;

                height: 40px;

                font-size: 14px;

                padding:
                    0
                    30px;
            }


            .mic-btn {
                left: 6%;

                top: 43px;
            }


            .search-btn {
                right: 6%;

                top: 43px;
            }


            .video-container {
                width: 115px;

                height: 115px;
            }


            body.searched h1 {
                font-size: 1.12rem;
            }


            body.searched .search-box {
                height: 56px;
            }


            body.searched .search-input {
                left: 8%;

                width: 84%;

                top: 8px;

                height: 36px;

                font-size: 13px;
            }


            body.searched .mic-btn {
                left: 3%;

                top: 13px;
            }


            body.searched .search-btn {
                right: 3%;

                top: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         INTRO ANIMATION
    ========================================== -->

    <div id="intro-animation">

        <div class="anim-wrapper">

            <div class="piece piece-tl"></div>

            <div class="piece piece-tr"></div>

            <div class="piece piece-bl"></div>

            <div class="piece piece-br"></div>

            <div class="anim-title">
                MEYYEE
            </div>

        </div>

    </div>


    <!-- ==========================================
         TOP NAVIGATION
    ========================================== -->

    <div class="top-nav">

        <button
            class="account-btn"
            id="accountButton"
            onclick="openAccountModal()">

            👤 Account

        </button>


        <button
            class="nav-btn"
            onclick="openWebsiteBuilder()">

            🌐 Create Website

        </button>

    </div>


    <!-- ==========================================
         MAIN
    ========================================== -->

    <div
        class="container"
        id="mainContainer">


        <!-- ======================================
             SEARCH
        ======================================= -->

        <div
            class="search-section"
            id="searchSection">


            <div>

                <h1>
                    MEYYEE
                </h1>


                <div class="subtitle">

                    Universal Truth Engine

                </div>

            </div>


            <!-- ==================================
                 MEYYEE CLOUD SEARCH BOX
            =================================== -->

            <div class="search-box">


                <!--
                    ONLY ONE CLOUD IMAGE

                    File:
                    /meyyee-cloud.png
                -->

                <img
                    src="/meyyee-cloud.png"
                    class="cloud-outline"
                    alt=""
                    aria-hidden="true"
                >


                <!-- VOICE -->

                <button
                    type="button"
                    class="mic-btn"
                    onclick="startVoiceSearch()"
                    title="Voice Search">

                    🎤

                </button>


                <!-- SEARCH INPUT -->

                <input
                    type="text"
                    id="userInput"
                    class="search-input"
                    name="meyyee-search"
                    placeholder="Search truth"
                    autocomplete="off"
                    aria-label="Search truth"
                >


                <!-- SEARCH -->

                <button
                    type="button"
                    class="search-btn"
                    onclick="handleSearch()"
                    title="Search">

                    🔎

                </button>


            </div>

        </div>


        <!-- ======================================
             WELCOME
        ====================================== -->

        <div id="welcomeSection">


            <div class="video-container">

                <video
                    autoplay
                    muted
                    loop
                    playsinline>

                    ) {

                        closeWebsiteBuilder();

                    }

                }
            );


        document

            .addEventListener(
                "click",
                function(event) {
