<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - only truth here</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 30px 15px;
        }

        /* Top Navigation Bar */
        .top-nav {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 10;
        }

        .nav-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #334155;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #e2e8f0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin-top: 8vh;
            transition: all 0.4s ease;
        }

        /* Initial Center Layout */
        .search-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        /* When Searched: Move Header & Search Bar smoothly to Top */
        body.searched .container {
            margin-top: 10px;
        }

        body.searched .search-section {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
            width: 100%;
            max-width: 900px;
            cursor: default;
        }

        /* MEYYEE Title: Rainbow Gradient */
        h1 {
            font-size: 3.8rem;
            letter-spacing: 6px;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #008000, #0000ff, #4b0082, #ee82ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.4s ease;
        }

        body.searched h1 {
            font-size: 2rem; 
            letter-spacing: 3px;
            margin-bottom: 0;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #64748b;
            margin-bottom: 30px;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }

        body.searched .subtitle {
            display: none;
        }

        /* Exact Hand-Drawn Cloud Shape Search Bar */
        .search-box {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 2.5px solid #2563eb;
            border-radius: 50px;
            padding: 12px 18px 12px 28px;
            width: 100%;
            max-width: 620px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.12),
                        inset 0 0 15px rgba(37, 99, 235, 0.05);
            margin-bottom: 30px;
            position: relative;
            transition: all 0.4s ease;
            clip-path: polygon(
                3% 20%, 8% 5%, 15% 15%, 22% 2%, 30% 12%, 38% 3%, 45% 15%, 
                55% 2%, 62% 15%, 70% 3%, 78% 12%, 85% 2%, 92% 15%, 98% 25%, 
                100% 50%, 97% 80%, 90% 95%, 82% 88%, 75% 98%, 65% 85%, 
                55% 98%, 45% 85%, 35% 98%, 25% 85%, 15% 98%, 8% 85%, 2% 60%
            );
        }

        body.searched .search-box {
            margin-bottom: 0;
            max-width: 450px;
            padding: 8px 12px 8px 20px;
        }

        .search-box:hover {
            border-color: #1d4ed8;
            box-shadow: 0 12px 35px rgba(29, 78, 216, 0.2);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.05rem;
            color: #1e293b;
            background: transparent;
            min-width: 0;
            padding-left: 10px;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .mic-btn, .search-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 8px 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .mic-btn:hover, .search-btn:hover {
            transform: scale(1.15);
        }

        /* Welcome Section */
        #welcomeSection {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .video-container {
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .welcome-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 2px;
            margin-top: 0;
        }

        /* All Results Container */
        #resultContainer {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 25px;
        }

        .result-box {
            width: 100%;
            background: linear-gradient(135deg, #f4e8c1 0%, #e6d39e 100%);
            border: 2px solid #8b5a2b;
            border-radius: 8px;
            padding: 25px;
            font-size: 1.05rem;
            color: #2c1d0c;
            text-align: left;
            box-shadow: 0 8px 25px rgba(139, 90, 43, 0.25);
            background-image: repeating-linear-gradient(0deg, transparent, transparent 30px, rgba(139, 90, 43, 0.08) 30px, rgba(139, 90, 43, 0.08) 31px);
        }

        .board-title {
            text-align: center; 
            color: #78350f; 
            font-size: 1.25rem; 
            font-weight: bold; 
            margin-bottom: 12px; 
            border-bottom: 1px dashed #8b5a2b; 
            padding-bottom: 8px;
        }

        .kural-lines {
            font-weight: bold; 
            color: #451a03; 
            font-size: 1.15rem; 
            line-height: 1.6; 
            text-align: center; 
            margin-bottom: 15px;
        }

        .meaning-box {
            color: #2c1d0c; 
            line-height: 1.7; 
            background: rgba(255, 255, 255, 0.4); 
            padding: 12px; 
            border-radius: 6px;
        }

        /* Modal for Website Builder */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            text-align: left;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .user-website-card {
            width: 100%;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="top-nav">
        <button class="nav-btn" onclick="openWebsiteBuilder()">🌐 Create Website</button>
    </div>

    <div class="container" id="mainContainer">
        
        <!-- Search Section -->
        <div class="search-section" id="searchSection" onclick="handleSearchClick(event)">
            <div>
                <h1>MEYYEE</h1>
                <div class="subtitle">Universal Truth Engine</div>
            </div>

            <!-- Search Box -->
            <div class="search-box">
                <input type="text" id="userInput" class="search-input" placeholder="Search truth">
                <button class="mic-btn" onclick="event.stopPropagation(); startVoiceSearch();" title="Search by Voice">🎤</button>
                <button class="search-btn" onclick="event.stopPropagation(); handleSearch();" title="Search">🔎</button>
            </div>
        </div>

        <!-- Welcome Section with Video -->
        <div id="welcomeSection">
            <div class="video-container">
                <!-- உங்கள் வீடியோ ஃபைல் பெயரைக் கொடுக்கவும் (எ.கா: welcome.mp4) -->
                <video autoplay muted loop playsinline>
                    <source src="your-video.mp4" type="video/mp4">
                    உங்கள் பிரவுசர் வீடியோவை சப்போர்ட் செய்யவில்லை.
                </video>
            </div>
            <div class="welcome-text">WELCOME</div>
        </div>

        <!-- All Results Container -->
        <div id="resultContainer"></div>
    </div>

    <!-- Website Builder Modal -->
    <div class="modal-overlay" id="websiteModal">
        <div class="modal-content">
            <h3>🌐 Create Your Own Website (Meyyee Sites)</h3>
            <div class="form-group">
                <label>Website Title:</label>
                <input type="text" id="siteTitleInput" placeholder="தளத்தின் தலைப்பு">
            </div>
            <div class="form-group">
                <label>Website Content:</label>
                <textarea id="siteContentInput" placeholder="உள்ளடக்கத்தை எழுதவும்..."></textarea>
            </div>
            <div class="form-group">
                <label>Theme Background Color:</label>
                <select id="siteBgColor">
                    <option value="#f8fafc">Light Minimal (வெள்ளை)</option>
                    <option value="#dbeafe">Ocean Blue (நீலம்)</option>
                    <option value="#fef3c7">Golden Palm (மஞ்சள்)</option>
                    <option value="#f3e8ff">Royal Purple (ஊதா)</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeWebsiteBuilder()">Cancel</button>
                <button class="btn-primary" onclick="generateUserWebsite()">Create</button>
            </div>
        </div>
    </div>

    <script>
        function openWebsiteBuilder() {
            document.getElementById('websiteModal').style.display = 'flex';
        }

        function closeWebsiteBuilder() {
            document.getElementById('websiteModal').style.display = 'none';
        }

        function generateUserWebsite() {
            const title = document.getElementById('siteTitleInput').value.trim();
            const content = document.getElementById('siteContentInput').value.trim();
            const bgColor = document.getElementById('siteBgColor').value;
            const resultContainer = document.getElementById('resultContainer');

            if (title === "" || content === "") {
                alert("தயவுசெய்து தலைப்பு மற்றும் உள்ளடக்கத்தை நிரப்பவும்!");
                return;
            }

            document.body.classList.add('searched');
            document.getElementById('welcomeSection').style.display = 'none';
            closeWebsiteBuilder();

            resultContainer.innerHTML = `
                <div style="background: #e0f2fe; padding: 12px; border-radius: 8px; color: #0369a1; font-weight: bold; text-align: center; margin-bottom: 10px;">
                    🎉 உங்கள் புதிய வெப்சைட் வெற்றிகரமாக உருவாக்கப்பட்டது!
                </div>
                <div class="user-website-card" style="background-color: ${bgColor}; border: 2px solid #cbd5e1;">
                    <h2>${title}</h2>
                    <hr style="margin: 15px 0; border: 0; border-top: 1px solid rgba(0,0,0,0.1);">
                    <p>${content.replace(/\n/g, '<br>')}</p>
                </div>
            `;
        }

        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Voice search support செய்யவில்லை!");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'ta-IN';
            recognition.onresult = function(event) {
                document.getElementById('userInput').value = event.results[0][0].transcript;
                handleSearch();
            };
            recognition.start();
        }

        // Click anywhere on search section handler (Prevents double triggering)
        function handleSearchClick(event) {
            // ஒருமுறை மட்டும் மேலே செல்லவும் தேடலை இயக்கவும்
            handleSearch();
        }

        function handleSearch() {
            const query = document.getElementById('userInput').value.trim().toLowerCase();
            const resultContainer = document.getElementById('resultContainer');

            // Trigger Search UI layout immediately
            document.body.classList.add('searched');
            const welcomeSec = document.getElementById('welcomeSection');
            if (welcomeSec) {
                welcomeSec.style.display = 'none';
            }

            if (query === "") {
                resultContainer.innerHTML = `
                    <div class="result-box" style="text-align: center; background: #fff;">
                        <strong>தேடல் முடிவு:</strong> (வெற்றுத் தேடல்)<br>தேட வேண்டிய வார்த்தையை உள்ளிடவும்.
                    </div>
                `;
                return;
            }

            if (query.includes("thirukkural") || query.includes("திருக்குறள்") || query.includes("kural") || query.includes("குறள்") || query.includes("search truth")) {
                resultContainer.innerHTML = `
                    <div class="result-box">
                        <div class="board-title">📜 குறள் எண்: 1 - கடவுள் வாழ்த்து</div>
                        <div class="kural-lines">
                            அகர முதல எழுத்தெல்லாம் ஆதி<br>
                            பகவன் முதற்றே உலகு.
                        </div>
                        <div class="meaning-box">
                            <strong>தெளிவுரை:</strong> அகரத்தை முதன்மையாக கொண்டுள்ள எழுத்துமுறை அனைத்திற்கும் சிவனின் சித்திரை எழுத்தே முதன்மை ஆனது.
                        </div>
                    </div>
                `;
            } else {
                resultContainer.innerHTML = `
                    <div class="result-box" style="text-align: center; background: #fff;">
                        <strong>தேடல் முடிவு:</strong> "${query}"<br>
                        <strong>Meyyee Engine:</strong> தேடப்படுகிறது...
                    </div>
                `;
            }
        }

        document.getElementById('userInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleSearch();
            }
        });
    </script>

</body>
</html>
