<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Universal Truth Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 40px 15px;
            transition: all 0.4s ease;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 800px;
            transition: all 0.4s ease;
        }

        /* Initial Center Layout */
        .search-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            transition: all 0.4s ease;
            margin-top: 15vh; /* Center aligned initially */
        }

        /* Top Layout After Search */
        body.searched .search-section {
            margin-top: 0;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 20px;
            width: 100%;
            max-width: 900px;
        }

        /* MEYYEE Title: Rainbow Gradient */
        h1 {
            font-size: 3.8rem;
            letter-spacing: 6px;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #008000, #0000ff, #4b0082, #ee82ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: font-size 0.4s ease;
        }

        body.searched h1 {
            font-size: 2rem; /* Smaller size when moved to top */
            letter-spacing: 3px;
            margin-bottom: 0;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #64748b;
            margin-bottom: 35px;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }

        body.searched .subtitle {
            display: none; /* Hide subtitle after search */
        }

        /* Exact Hand-Drawn Cloud Shape Search Bar */
        .search-box {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 2.5px solid #2563eb;
            border-radius: 50px;
            padding: 12px 18px 12px 28px;
            width: 100%;
            max-width: 620px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.12),
                        inset 0 0 15px rgba(37, 99, 235, 0.05);
            margin-bottom: 30px;
            transition: all 0.3s ease;
            position: relative;
            clip-path: polygon(
                3% 20%, 8% 5%, 15% 15%, 22% 2%, 30% 12%, 38% 3%, 45% 15%, 
                55% 2%, 62% 15%, 70% 3%, 78% 12%, 85% 2%, 92% 15%, 98% 25%, 
                100% 50%, 97% 80%, 90% 95%, 82% 88%, 75% 98%, 65% 85%, 
                55% 98%, 45% 85%, 35% 98%, 25% 85%, 15% 98%, 8% 85%, 2% 60%
            );
        }

        body.searched .search-box {
            margin-bottom: 0;
            max-width: 500px;
            padding: 8px 12px 8px 20px;
        }

        .search-box:hover {
            border-color: #1d4ed8;
            box-shadow: 0 12px 35px rgba(29, 78, 216, 0.2);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.05rem;
            color: #1e293b;
            background: transparent;
            min-width: 0;
            padding-left: 10px;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        /* Transparent Mic Button */
        .mic-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 8px 10px;
            margin-right: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .mic-btn:hover {
            transform: scale(1.15);
        }

        /* Transparent Search Button with 🔎 Icon */
        .search-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.35rem;
            cursor: pointer;
            padding: 8px 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: scale(1.15);
        }

        /* Welcome Section (Hidden after search) */
        #welcomeSection {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .video-container {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            background: transparent;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            background: transparent;
        }

        .welcome-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 2px;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        /* Palm Leaf Result Box Container */
        #resultContainer {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 25px;
        }

        /* Individual Palm Leaf Card */
        .result-box {
            width: 100%;
            background: linear-gradient(135deg, #f4e8c1 0%, #e6d39e 100%);
            border: 2px solid #8b5a2b;
            border-radius: 8px;
            padding: 25px;
            font-size: 1.05rem;
            color: #2c1d0c;
            text-align: left;
            box-shadow: 0 8px 25px rgba(139, 90, 43, 0.25);
            position: relative;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 30px, rgba(139, 90, 43, 0.08) 30px, rgba(139, 90, 43, 0.08) 31px);
        }

        .board-title {
            text-align: center; 
            color: #78350f; 
            font-size: 1.25rem; 
            font-weight: bold; 
            margin-bottom: 12px; 
            border-bottom: 1px dashed #8b5a2b; 
            padding-bottom: 8px;
        }

        .kural-lines {
            font-weight: bold; 
            color: #451a03; 
            font-size: 1.15rem; 
            line-height: 1.6; 
            text-align: center; 
            margin-bottom: 15px;
        }

        .meaning-box {
            color: #2c1d0c; 
            line-height: 1.7; 
            background: rgba(255, 255, 255, 0.4); 
            padding: 12px; 
            border-radius: 6px;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            h1 {
                font-size: 2.8rem;
                letter-spacing: 4px;
            }
            body.searched .search-section {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        
        <div class="search-section" id="searchSection">
            <div>
                <h1>MEYYEE</h1>
                <div class="subtitle">Universal Truth Engine</div>
            </div>

            <div class="search-box">
                <input type="text" id="userInput" class="search-input" placeholder="Search truth">
                <button class="mic-btn" onclick="startVoiceSearch()" title="Search by Voice">🎤</button>
                <button class="search-btn" onclick="handleSearch()" title="Search">🔎</button>
            </div>
        </div>

        <!-- Welcome Section that disappears after search -->
        <div id="welcomeSection">
            <div class="video-container">
                <video autoplay muted loop playsinline>
                    <source src="myvideo.mp4.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="welcome-text">WELCOME</div>
        </div>

        <!-- All Results Container -->
        <div id="resultContainer"></div>
    </div>

    <script>
        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Unga browser voice search-ah support panralathu. Chrome illa Edge use pannunga!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ta-IN';
            
            recognition.onstart = function() {
                document.getElementById('userInput').placeholder = "கேளுங்கள்... கேட்டுக் கொண்டிருக்கிறேன் 🎙️";
            };

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('userInput').value = spokenText;
                document.getElementById('userInput').placeholder = "Search truth";
                handleSearch();
            };

            recognition.onerror = function() {
                document.getElementById('userInput').placeholder = "Search truth";
                alert("Voice கேட்கவில்லை, மறுபடியும் முயற்சிக்கவும்.");
            };

            recognition.start();
        }

        function handleSearch() {
            const query = document.getElementById('userInput').value.trim().toLowerCase();
            const resultContainer = document.getElementById('resultContainer');

            if (query === "") {
                alert("தயவுசெய்து எதாவது உள்ளிடவும்!");
                return;
            }

            // Trigger Google-like search view (Hides welcome image & moves title to top)
            document.body.classList.add('searched');
            document.getElementById('welcomeSection').style.display = 'none';

            if (query.includes("thirukkural") || query.includes("திருக்குறள்") || query.includes("kural") || query.includes("குறள்") || query.includes("search truth")) {
                resultContainer.innerHTML = `
                    <div class="result-box">
                        <div class="board-title">📜 கூறல் எண்: 1 - கடவுள் வாழ்த்து</div>
                        <div class="kural-lines">
                            அகர முதல எழுத்தெல்லாம் ஆதி<br>
                            பகவன் முதற்றே உலகு.
                        </div>
                        <div class="meaning-box">
                            <strong>தெளிவுரை:</strong> அகரத்தை முதன்மையாக கொண்டுள்ள எழுத்துமுறை அனைத்திற்கும் சிவனின் சித்திரை எழுத்தே முதன்மை ஆனது.
                        </div>
                    </div>

                    <div class="result-box">
                        <div class="board-title">📜 கூறல் எண்: 2</div>
                        <div class="kural-lines">
                            கற்றதனால் ஆய பயனென்கொல் வாலறிவன்<br>
                            நற்றாள் தொழாஅர் எனின்.
                        </div>
                        <div class="meaning-box">
                            <strong>தெளிவுரை:</strong> முருகனின் நல்ல பாதங்களை தொழாதவர் படித்ததனால் உண்டாகிய பயன்தான் என்னச் சொல். இங்கு வாலறிவன் என்பது முருகனை குறிக்கும்.
                        </div>
                    </div>

                    <div class="result-box">
                        <div class="board-title">📜 கூறல் எண்: 3</div>
                        <div class="kural-lines">
                            மலர்மிசை ஏகினான் மானடி சேர்ந்தார்<br>
                            நிலமிசை நீடுவாழ் வார்.
                        </div>
                        <div class="meaning-box">
                            <strong>தெளிவுரை:</strong> பிரம்மனாகிய முருகனின் அடிகளை சேர்ந்தவர் தான் இந்த நிலத்தின் மீது நீண்ட காலம் வாழ்வார். இங்கு மலர்மிசை ஏகினான் என்பது தாமரை மலர் மீது வீற்றிருக்கும் பிரம்மாவை குறிக்கும் பிரம்மா என்றால் முருகனை குறிக்கும்.
                        </div>
                    </div>
                `;
            } else if (query === "1") {
                resultContainer.innerHTML = `
                    <div class="result-box">
                        <div class="board-title">📜 கூறல் எண்: 1 - கடவுள் வாழ்த்து</div>
                        <div class="kural-lines">
                            அகர முதல எழுத்தெல்லாம் ஆதி<br>
                            பகவன் முதற்றே உலகு.
                        </div>
                        <div class="meaning-box">
                            <strong>தெளிவுரை:</strong> அகரத்தை முதன்மையாக கொண்டுள்ள எழுத்துமுறை அனைத்திற்கும் சிவனின் சித்திரை எழுத்தே முதன்மை ஆனது.
                        </div>
                    </div>
                `;
            } else if (query === "2") {
                resultContainer.innerHTML = `
                    <div class="result-box">
                        <div class="board-title">📜 கூறல் எண்: 2</div>
                        <div class="kural-lines">
                            கற்றதனால் ஆய பயனென்கொல் வாலறிவன்<br>
                            நற்றாள் தொழாஅர் எனின்.
                        </div>
                        <div class="meaning-box">
                            <strong>தெளிவுரை:</strong> முருகனின் நல்ல பாதங்களை தொழாதவர் படித்ததனால் உண்டாகிய பயன்தான் என்னச் சொல். இங்கு வாலறிவன் என்பது முருகனை குறிக்கும்.
                        </div>
                    </div>
                `;
            } else if (query === "3") {
                resultContainer.innerHTML = `
                    <div class="result-box">
                        <div class="board-title">📜 கூறல் எண்: 3</div>
                        <div class="kural-lines">
                            மலர்மிசை ஏகினான் மானடி சேர்ந்தார்<br>
                            நிலமிசை நீடுவாழ் வார்.
                        </div>
                        <div class="meaning-box">
                            <strong>தெளிவுரை:</strong> பிரம்மனாகிய முருகனின் அடிகளை சேர்ந்தவர் தான் இந்த நிலத்தின் மீது நீண்ட காலம் வாழ்வார். இங்கு மலர்மிசை ஏகினான் என்பது தாமரை மலர் மீது வீற்றிருக்கும் பிரம்மாவை குறிக்கும் பிரம்மா என்றால் முருகனை குறிக்கும்.
                        </div>
                    </div>
                `;
            } else {
                resultContainer.innerHTML = `
                    <div class="result-box" style="text-align: center;">
                        <strong>தேடல் முடிவு:</strong> "${query}"<br><br>
                        <strong>Meyyee Engine:</strong> உங்களுக்கான Universal Truth தேடப்படுகிறது...
                    </div>
                `;
            }
        }

        document.getElementById('userInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleSearch();
            }
        });
    </script>

</body>
</html>
