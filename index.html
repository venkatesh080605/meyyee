<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Only Truth Here</title>
    <style>
        /* Base Reset & Galaxy Background */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            color: #ffffff;
        }

        /* Galaxy Star Effect */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat top center;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        /* Meyyee Thick Title */
        .title {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        /* Tagline */
        .subtitle {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 3px;
            color: #cccccc;
            margin-top: -15px;
            text-transform: uppercase;
        }

        /* Cloud Shaped Search Bar */
        .search-container {
            position: relative;
            margin: 15px 0;
        }

        .search-bar {
            width: 320px;
            height: 55px;
            padding: 0 25px;
            font-size: 1rem;
            border: none;
            outline: none;
            border-radius: 50px 50px 50px 50px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2),
                        0 0 0 8px rgba(255, 255, 255, 0.1);
            color: #333;
        }

        .search-bar::placeholder {
            color: #888;
        }

        /* Animated Boy Character */
        .boy-container {
            position: relative;
            width: 100px;
            height: 140px;
            margin-top: 10px;
        }

        /* Head Animation (Kunindhu Nimirvadhu) */
        .boy-head {
            width: 50px;
            height: 50px;
            background-color: #ffdbac;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            left: 25px;
            z-index: 2;
            animation: bowHead 3s infinite ease-in-out;
            transform-origin: bottom center;
        }

        /* Hair */
        .boy-head::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 0;
            width: 50px;
            height: 25px;
            background-color: #2c1d11;
            border-radius: 25px 25px 0 0;
        }

        /* Face Details */
        .boy-eyes {
            position: absolute;
            top: 22px;
            left: 10px;
            width: 30px;
            display: flex;
            justify-content: space-between;
        }

        .eye {
            width: 6px;
            height: 6px;
            background-color: #333;
            border-radius: 50%;
        }

        /* Body */
        .boy-body {
            width: 36px;
            height: 50px;
            background-color: #2196F3;
            position: absolute;
            top: 55px;
            left: 32px;
            border-radius: 10px 10px 0 0;
        }

        /* Hands - Vanakkam Position */
        .hands-namaste {
            position: absolute;
            top: 15px;
            left: 10px;
            width: 16px;
            height: 16px;
            background-color: #ffdbac;
            border-radius: 50% 50% 0 0;
            box-shadow: 0 0 2px rgba(0,0,0,0.3);
        }

        /* Keyframe for Head Bowing Animation */
        @keyframes bowHead {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(8px) rotateX(25deg);
            }
        }

        /* Welcome Text */
        .welcome-text {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <!-- Main Title -->
        <h1 class="title">MEYYEE</h1>

        <!-- Subtitle -->
        <p class="subtitle">ONLY TRUTH HERE</p>

        <!-- Cloud Search Bar -->
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Search the truth...">
        </div>

        <!-- Boy Animation (Vanakkam & Bowing) -->
        <div class="boy-container">
            <div class="boy-head">
                <div class="boy-eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
            </div>
            <div class="boy-body">
                <div class="hands-namaste"></div>
            </div>
        </div>

        <!-- Welcome Text -->
        <div class="welcome-text">WELCOME</div>
    </div>

</body>
</html>
