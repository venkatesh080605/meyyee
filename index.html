<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Universal Truth Engine</title>
    
    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
      import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "YOUR_VALID_FIREBASE_API_KEY", // உங்கள் சரியான Firebase API Key-ஐ இங்கே பதிவிடவும்
        authDomain: "meyyee-2cb50.firebaseapp.com",
        projectId: "meyyee-2cb50",
        storageBucket: "meyyee-2cb50.appspot.com",
        messagingSenderId: "242196529963",
        appId: "1:242196529963:web:5b6b1c49acfad8c86ffb6e",
        measurementId: "G-P07PH90RH7"
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);

      // Export Auth methods for global usage
      window.firebaseAuth = auth;
      window.authMethods = {
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        signOut
      };

      // Listen to Auth State
      onAuthStateChanged(auth, (user) => {
        const profileBtn = document.getElementById('profileAvatar');
        if (user) {
            profileBtn.innerHTML = user.photoURL ? `<img src="${user.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : user.email.charAt(0).toUpperCase();
        } else {
            profileBtn.innerHTML = '👤'; // Guest Icon
        }
      });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 20px 10px;
        }

        /* Top Left - Create Website */
        .top-left-nav {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
        }

        /* Top Right - Guest / Profile Icon Settings */
        .top-right-nav {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
        }

        .nav-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
            transition: all 0.2s;
        }

        .profile-avatar-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            overflow: hidden;
            transition: all 0.2s;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            margin-top: 60px;
            padding: 0 10px;
        }

        .search-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 2vh;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            letter-spacing: 4px;
            font-weight: 900;
            margin-bottom: 2px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #008000, #0000ff, #4b0082, #ee82ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Cloud-like Colorful Search Bar */
        .search-box {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 3px solid transparent;
            border-image: linear-gradient(90deg, #ff0000, #ff7f00, #008000, #0000ff, #4b0082) 1;
            border-radius: 40px 50px 45px 45px;
            padding: 10px 15px 10px 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.1);
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #1e293b;
            background: transparent;
            min-width: 0;
        }

        .mic-btn, .search-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Welcome Section */
        #welcomeSection {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            width: 100%;
        }

        .video-container {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .welcome-text {
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        /* Modals (Popups) for Guest / Login / Website */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center; align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            width: 100%; max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
        }

        .auth-input {
            padding: 10px;
            margin: 8px 0;
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
        }

        .btn-auth {
            padding: 10px 15px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            width: 100%;
            margin-top: 8px;
        }

        #signup-btn { background-color: #2563eb; }
        #login-btn { background-color: #16a34a; }
        #google-login-btn { background-color: #dc2626; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; outline: none; }
        .form-group textarea { height: 80px; resize: vertical; }

        .close-x {
            position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b;
        }
    </style>
</head>
<body>

    <!-- Top Left: Create Website -->
    <div class="top-left-nav">
        <button class="nav-btn" onclick="openWebsiteBuilder()">🌐 Create Website</button>
    </div>

    <!-- Top Right: Guest / Profile Icon (Click to Login) -->
    <div class="top-right-nav">
        <button class="profile-avatar-btn" id="profileAvatar" onclick="openLoginModal()" title="Guest Account - Click to Login">👤</button>
    </div>

    <div class="container">
        <!-- Search Section -->
        <div class="search-section" onclick="handleSearch()">
            <div>
                <h1>MEYYEE</h1>
                <div class="subtitle">Universal Truth Engine</div>
            </div>

            <div class="search-box" onclick="handleSearch()">
                <input type="text" id="userInput" class="search-input" placeholder="Search truth" onfocus="handleSearch()" onclick="event.stopPropagation(); handleSearch();">
                <button class="mic-btn" onclick="event.stopPropagation(); alert('Voice search activated');" title="Voice Search">🎤</button>
                <!-- Telescope Icon -->
                <button class="search-btn" onclick="event.stopPropagation(); handleSearch();" title="Search with Telescope">🔭</button>
            </div>
        </div>

        <!-- Welcome Section -->
        <div id="welcomeSection">
            <div class="video-container">
                <video autoplay muted loop playsinline>
                    <source src="myvideo.mp4.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="welcome-text">WELCOME</div>
        </div>
        
        <div id="resultContainer" style="width: 100%; max-width: 600px; margin-top: 15px;"></div>
    </div>

    <!-- Login / Guest Account Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <button class="close-x" onclick="closeLoginModal()">&times;</button>
            <h3 style="margin-bottom: 15px; color: #1e293b;">Account Access (Guest)</h3>
            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;">Sign in to access your complete profile and truth engine settings.</p>
            
            <input type="email" id="email" class="auth-input" placeholder="Email address"><br>
            <input type="password" id="password" class="auth-input" placeholder="Password"><br>
            
            <div style="display: flex; gap: 8px;">
                <button id="signup-btn" class="btn-auth" onclick="handleEmailSignUp()">Sign Up</button>
                <button id="login-btn" class="btn-auth" onclick="handleEmailLogin()">Login</button>
            </div>
            <button id="google-login-btn" class="btn-auth" onclick="handleGoogleSignIn()">
                <span>Sign in with Google</span>
            </button>
            <button id="logout-btn" class="btn-auth" style="background-color: #64748b; display: none;" onclick="handleLogout()">Sign Out</button>
        </div>
    </div>

    <!-- Website Builder Modal -->
    <div class="modal-overlay" id="websiteModal">
        <div class="modal-content" style="text-align: left;">
            <button class="close-x" onclick="closeWebsiteBuilder()">&times;</button>
            <h3 style="margin-bottom: 10px; color: #1e293b;">🌐 Create Your Website</h3>
            <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 15px;">No separate domain required! Published instantly under Meyyee subdomains.</p>
            <div class="form-group">
                <label>Website Title:</label>
                <input type="text" id="siteTitleInput" placeholder="e.g., My Truth Site">
            </div>
            <div class="form-group">
                <label>Website Content:</label>
                <textarea id="siteContentInput" placeholder="Write details here..."></textarea>
            </div>
            <button class="btn-auth" style="background-color: #2563eb;" onclick="generateUserWebsite()">Create My Website</button>
        </div>
    </div>

    <!-- JavaScript Handlers -->
    <script>
        function openLoginModal() {
            const auth = window.firebaseAuth;
            if (auth && auth.currentUser) {
                document.getElementById('logout-btn').style.display = 'block';
            } else {
                document.getElementById('logout-btn').style.display = 'none';
            }
            document.getElementById('loginModal').style.display = 'flex';
        }

        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        function openWebsiteBuilder() {
            document.getElementById('websiteModal').style.display = 'flex';
        }

        function closeWebsiteBuilder() {
            document.getElementById('websiteModal').style.display = 'none';
        }

        // Google Sign In Functionality Fix
        async function handleGoogleSignIn() {
            const { GoogleAuthProvider, signInWithPopup } = window.authMethods;
            const auth = window.firebaseAuth;
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                alert("Successfully signed in as " + result.user.displayName);
                closeLoginModal();
            } catch (error) {
                alert("Google Sign-In Error: " + error.message);
            }
        }

        async function handleEmailSignUp() {
            const { createUserWithEmailAndPassword } = window.authMethods;
            const auth = window.firebaseAuth;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("Account created successfully!");
                closeLoginModal();
            } catch (error) {
                alert("Error: " + error.message);
            }
        }

        async function handleEmailLogin() {
            const { signInWithEmailAndPassword } = window.authMethods;
            const auth = window.firebaseAuth;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("Logged in successfully!");
                closeLoginModal();
            } catch (error) {
                alert("Error: " + error.message);
            }
        }

        async function handleLogout() {
            const { signOut } = window.authMethods;
            const auth = window.firebaseAuth;
            try {
                await signOut(auth);
                alert("Logged out successfully.");
                closeLoginModal();
            } catch (error) {
                alert("Error: " + error.message);
            }
        }

        function generateUserWebsite() {
            const title = document.getElementById('siteTitleInput').value.trim();
            const content = document.getElementById('siteContentInput').value.trim();
            if (!title || !content) {
                alert("Please fill in both fields!");
                return;
            }
            alert("Website published successfully via Meyyee Sites!");
            closeWebsiteBuilder();
        }

        function handleSearch() {
            const query = document.getElementById('userInput').value.trim();
            if(query) {
                document.getElementById('resultContainer').innerHTML = `<div style="background:#f1f5f9; padding:15px; border-radius:8px; border:1px solid #cbd5e1; text-align:left;"><strong>Search Results for "${query}":</strong> Processed successfully through Telescope.</div>`;
            }
        }
    </script>
</body>
</html>
