<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Universal Truth Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 50px 50px;
            opacity: 0.1;
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: 4px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .subtitle {
            font-size: 1rem;
            letter-spacing: 2px;
            color: #b0c4de;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 50px;
            padding: 8px 8px 8px 25px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            margin-bottom: 40px;
            transition: all 0.3s ease;
        }

        .search-box:hover {
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.7);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.1rem;
            color: #333333;
            background: transparent;
        }

        .search-input::placeholder {
            color: #888888;
        }

        .search-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            outline: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background-color: #0369a1;
        }

        .welcome-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 5px;
            width: 220px;
            height: 220px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 3px solid rgba(56, 189, 248, 0.8);
            overflow: hidden;
        }

        .welcome-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .welcome-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .result-box {
            margin-top: 20px;
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 15px;
            padding: 20px;
            font-size: 1.1rem;
            color: #e2e8f0;
            text-align: left;
            display: none; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MEYYEE</h1>
        <div class="subtitle">Universal Truth Engine</div>

        <div class="search-box">
            <input type="text" id="userInput" class="search-input" placeholder="Ask anything in the world...">
            <button class="search-btn" onclick="handleSearch()">Search</button>
        </div>

        <div class="welcome-card">
            <video width="100%" height="100%" controls autoplay muted loop>
                <source src="myvideo.mp4.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="welcome-text">WELCOME</div>

        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        function handleSearch() {
            const query = document.getElementById('userInput').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (query === "") {
                alert("Dhayavu seithu edhavathu kelvi kelungal!");
                return;
            }

            resultBox.style.display = "block";
            resultBox.innerHTML = `<strong>Search Query:</strong> "${query}"<br><br><strong>Meyyee Engine:</strong> Ungal kelvikuana universal truth-ah theddukirathu...`;
        }

        document.getElementById('userInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleSearch();
            }
        });
    </script>

</body>
</html>
