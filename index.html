<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Universal Truth Engine</title>
    
    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "YOUR_VALID_FIREBASE_API_KEY",
        authDomain: "meyyee-2cb50.firebaseapp.com",
        projectId: "meyyee-2cb50",
        storageBucket: "meyyee-2cb50.appspot.com",
        messagingSenderId: "242196529963",
        appId: "1:242196529963:web:5b6b1c49acfad8c86ffb6e",
        measurementId: "G-P07PH90RH7"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      window.firebaseAuth = auth;
      window.authMethods = {
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        signOut
      };

      onAuthStateChanged(auth, (user) => {
        const profileBtn = document.getElementById('profileAvatar');
        if (user) {
            profileBtn.innerHTML = user.photoURL ? `<img src="${user.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : user.email.charAt(0).toUpperCase();
        } else {
            profileBtn.innerHTML = '👤';
        }
      });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 20px 15px;
        }

        .top-left-nav {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
        }

        .top-right-nav {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
        }

        .nav-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
        }

        .profile-avatar-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 700px;
            margin-top: 50px;
        }

        .search-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 3.8rem);
            letter-spacing: 4px;
            font-weight: 900;
            margin-bottom: 2px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #008000, #0000ff, #4b0082, #ee82ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 3px solid transparent;
            border-image: linear-gradient(90deg, #ff0000, #ff7f00, #008000, #0000ff, #4b0082) 1;
            border-radius: 40px 50px 45px 45px;
            padding: 10px 15px 10px 20px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.08);
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #1e293b;
            background: transparent;
            min-width: 0;
        }

        .mic-btn, .search-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 8px;
        }

        #welcomeSection {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            width: 100%;
        }

        /* Safe Fallback Visual Box instead of broken video */
        .welcome-graphic {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
            margin-bottom: 10px;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .welcome-text {
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center; align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            width: 100%; max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
        }

        .auth-input {
            padding: 10px;
            margin: 8px 0;
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
        }

        .btn-auth {
            padding: 10px 15px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            width: 100%;
            margin-top: 8px;
        }

        #signup-btn { background-color: #2563eb; }
        #login-btn { background-color: #16a34a; }
        #google-login-btn { background-color: #dc2626; }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; outline: none; }
        .form-group textarea { height: 80px; resize: vertical; }

        .close-x {
            position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b;
        }
    </style>
</head>
<body>

    <div class="top-left-nav">
        <button class="nav-btn" onclick="openWebsiteBuilder()">🌐 Create Website</button>
    </div>

    <div class="top-right-nav">
        <button class="profile-avatar-btn" id="profileAvatar" onclick="openLoginModal()" title="Guest Account">👤</button>
    </div>

    <div class="container">
        <div class="search-section">
            <div>
                <h1>MEYYEE</h1>
                <div class="subtitle">Universal Truth Engine</div>
            </div>

            <div class="search-box" onclick="handleSearch()">
                <input type="text" id="userInput" class="search-input" placeholder="Search truth">
                <button class="mic-btn" onclick="event.stopPropagation(); alert('Voice search activated');">🎤</button>
                <button class="search-btn" onclick="event.stopPropagation(); handleSearch();">🔭</button>
            </div>
        </div>

        <div id="welcomeSection">
            <!-- Safe Animated Icon replacing broken video path -->
            <div class="welcome-graphic">✨</div>
            <div class="welcome-text">WELCOME</div>
        </div>
        
        <div id="resultContainer" style="width: 100%; max-width: 580px; margin-top: 15px;"></div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <button class="close-x" onclick="closeLoginModal()">&times;</button>
            <h3 style="margin-bottom: 15px; color: #1e293b;">Account Access</h3>
            <input type="email" id="email" class="auth-input" placeholder="Email address"><br>
            <input type="password" id="password" class="auth-input" placeholder="Password"><br>
            <div style="display: flex; gap: 8px;">
                <button id="signup-btn" class="btn-auth" onclick="handleEmailSignUp()">Sign Up</button>
                <button id="login-btn" class="btn-auth" onclick="handleEmailLogin()">Login</button>
            </div>
            <button id="google-login-btn" class="btn-auth" onclick="handleGoogleSignIn()">Sign in with Google</button>
            <button id="logout-btn" class="btn-auth" style="background-color: #64748b; display: none;" onclick="handleLogout()">Sign Out</button>
        </div>
    </div>

    <div class="modal-overlay" id="websiteModal">
        <div class="modal-content" style="text-align: left;">
            <button class="close-x" onclick="closeWebsiteBuilder()">&times;</button>
            <h3 style="margin-bottom: 10px; color: #1e293b;">🌐 Create Your Website</h3>
            <div class="form-group">
                <label>Website Title:</label>
                <input type="text" id="siteTitleInput" placeholder="e.g., My Site">
            </div>
            <div class="form-group">
                <label>Website Content:</label>
                <textarea id="siteContentInput" placeholder="Write details..."></textarea>
            </div>
            <button class="btn-auth" style="background-color: #2563eb;" onclick="generateUserWebsite()">Create My Website</button>
        </div>
    </div>

    <script>
        function openLoginModal() {
            const auth = window.firebaseAuth;
            if (auth && auth.currentUser) {
                document.getElementById('logout-btn').style.display = 'block';
            } else {
                document.getElementById('logout-btn').style.display = 'none';
            }
            document.getElementById('loginModal').style.display = 'flex';
        }

        function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
        function openWebsiteBuilder() { document.getElementById('websiteModal').style.display = 'flex'; }
        function closeWebsiteBuilder() { document.getElementById('websiteModal').style.display = 'none'; }

        async function handleGoogleSignIn() {
            const { GoogleAuthProvider, signInWithPopup } = window.authMethods;
            try {
                const result = await signInWithPopup(window.firebaseAuth, new GoogleAuthProvider());
                alert("Successfully signed in as " + result.user.displayName);
                closeLoginModal();
            } catch (error) {
                alert("Google Sign-In Error: " + error.message);
            }
        }

        async function handleEmailSignUp() {
            const { createUserWithEmailAndPassword } = window.authMethods;
            try {
                await createUserWithEmailAndPassword(window.firebaseAuth, document.getElementById('email').value, document.getElementById('password').value);
                alert("Account created successfully!");
                closeLoginModal();
            } catch (error) { alert("Error: " + error.message); }
        }

        async function handleEmailLogin() {
            const { signInWithEmailAndPassword } = window.authMethods;
            try {
                await signInWithEmailAndPassword(window.firebaseAuth, document.getElementById('email').value, document.getElementById('password').value);
                alert("Logged in successfully!");
                closeLoginModal();
            } catch (error) { alert("Error: " + error.message); }
        }

        async function handleLogout() {
            try {
                await window.authMethods.signOut(window.firebaseAuth);
                alert("Logged out successfully.");
                closeLoginModal();
            } catch (error) { alert("Error: " + error.message); }
        }

        function generateUserWebsite() {
            if(!document.getElementById('siteTitleInput').value.trim()) {
                alert("Please fill in fields!"); return;
            }
            alert("Website published successfully!");
            closeWebsiteBuilder();
        }

        function handleSearch() {
            const query = document.getElementById('userInput').value.trim();
            if(query) {
                document.getElementById('resultContainer').innerHTML = `<div style="background:#f1f5f9; padding:12px; border-radius:8px; border:1px solid #cbd5e1; text-align:left;"><strong>Results for "${query}":</strong> Processed.</div>`;
            }
        }
    </script>
</body>
</html>
