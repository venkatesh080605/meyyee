<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Universal Truth Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: 4px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #0f172a;
        }

        .subtitle {
            font-size: 1rem;
            letter-spacing: 2px;
            color: #64748b;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* Search Bar with Mic Button */
        .search-box {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 50px;
            padding: 8px 8px 8px 25px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 35px;
            transition: all 0.3s ease;
        }

        .search-box:hover {
            border-color: #0284c7;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.15);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.1rem;
            color: #1e293b;
            background: transparent;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        /* Mic Button Styling */
        .mic-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 8px 12px;
            margin-right: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .mic-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .search-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            outline: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background-color: #0369a1;
        }

        /* Video Container - No Box / Transparent */
        .video-container {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .welcome-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Answer Output Display Box */
        .result-box {
            margin-top: 20px;
            width: 100%;
            max-width: 650px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 15px;
            padding: 20px;
            font-size: 1.1rem;
            color: #334155;
            text-align: left;
            display: none; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MEYYEE</h1>
        <div class="subtitle">Universal Truth Engine</div>

        <!-- Search Bar with Mic Icon -->
        <div class="search-box">
            <input type="text" id="userInput" class="search-input" placeholder="Ask anything or use voice...">
            <button class="mic-btn" onclick="startVoiceSearch()" title="Search by Voice">🎤</button>
            <button class="search-btn" onclick="handleSearch()">Search</button>
        </div>

        <!-- Video Display -->
        <div class="video-container">
            <video width="100%" height="100%" controls autoplay muted loop>
                <source src="myvideo.mp4.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="welcome-text">WELCOME</div>

        <!-- Answer Display Box -->
        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        // Native Voice Search Implementation
        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Unga browser voice search-ah support panralathu. Chrome illa Edge use pannunga!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; // Neenga tamil-la pesnalum recognise aagum
            
            recognition.onstart = function() {
                document.getElementById('userInput').placeholder = "Kelungal... Kettu kondu irukiren 🎙️";
            };

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('userInput').value = spokenText;
                document.getElementById('userInput').placeholder = "Ask anything or use voice...";
                handleSearch(); // Automatically trigger search after speech
            };

            recognition.onerror = function() {
                document.getElementById('userInput').placeholder = "Ask anything or use voice...";
                alert("Voice k கேட்கவில்லை, marubadiyum try pannunga.");
            };

            recognition.start();
        }

        function handleSearch() {
            const query = document.getElementById('userInput').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (query === "") {
                alert("Dhayavu seithu edhavathu kelvi kelungal!");
                return;
            }

            resultBox.style.display = "block";
            resultBox.innerHTML = `<strong>Search Query:</strong> "${query}"<br><br><strong>Meyyee Engine:</strong> Ungal kelvikuana universal truth-ah theddukirathu...`;
        }

        document.getElementById('userInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleSearch();
            }
        });
    </script>

</body>
</html>
