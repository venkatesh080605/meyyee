<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meyyee - Universal Truth Engine</title>
    <link rel="manifest" href="/manifest.json">
    
    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
      import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "YOUR_VALID_FIREBASE_API_KEY", // உங்கள் சரியான API Key-ஐ இங்கே பதிவிடவும்
        authDomain: "meyyee-2cb50.firebaseapp.com",
        projectId: "meyyee-2cb50",
        storageBucket: "meyyee-2cb50.appspot.com",
        messagingSenderId: "242196529963",
        appId: "1:242196529963:web:5b6b1c49acfad8c86ffb6e",
        measurementId: "G-P07PH90RH7"
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);

      window.firebaseAuth = auth;
      window.authMethods = {
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup
      };
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 40px 15px;
            transition: all 0.4s ease;
        }

        /* Top Left - Create Website */
        .top-left-nav {
            position: absolute;
            top: 15px;
            left: 25px;
            z-index: 10;
        }

        /* Top Right - Google Settings / Profile Icon */
        .top-right-nav {
            position: absolute;
            top: 15px;
            right: 25px;
            z-index: 10;
        }

        .nav-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #334155;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .profile-gear-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .profile-gear-btn:hover {
            background: #e2e8f0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 100%;
            max-width: 800px;
            transition: all 0.4s ease;
            margin-top: 20px;
        }

        .search-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            transition: all 0.4s ease;
            margin-top: 5vh;
            cursor: pointer;
        }

        h1 {
            font-size: 3.8rem;
            letter-spacing: 6px;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #008000, #0000ff, #4b0082, #ee82ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #64748b;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        /* Cloud Shape Search Box with Colorful Border */
        .search-box {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 3px solid transparent;
            border-image: linear-gradient(90deg, #ff0000, #ff7f00, #008000, #0000ff, #4b0082) 1;
            border-radius: 50px;
            padding: 12px 18px 12px 28px;
            width: 100%;
            max-width: 620px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.12);
            margin-bottom: 30px;
            position: relative;
            cursor: pointer;
            /* Cloud-like organic pill curve */
            border-radius: 40px 50px 45px 45px;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.05rem;
            color: #1e293b;
            background: transparent;
            min-width: 0;
            padding-left: 10px;
        }

        .mic-btn, .search-btn {
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 8px 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .mic-btn:hover, .search-btn:hover {
            transform: scale(1.15);
        }

        #welcomeSection {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-container {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .welcome-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 2px;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        /* Auth Container */
        .auth-container {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .auth-container h3 {
            margin-bottom: 15px;
            color: #1e293b;
            font-size: 1.2rem;
        }

        .auth-input {
            padding: 10px;
            margin: 8px 0;
            width: 100%;
            max-width: 320px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
        }

        .auth-btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-auth {
            padding: 10px 15px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        #signup-btn { background-color: #2563eb; }
        #login-btn { background-color: #16a34a; }
        #google-btn { background-color: #dc2626; width: 100%; max-width: 320px; margin-top: 10px; }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            width: 90%; max-width: 500px;
            text-align: left;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 600; color: #475569; margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none;
        }
        .form-group textarea { resize: vertical; height: 100px; }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-primary { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-secondary { background: #e2e8f0; color: #334155; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }

        #resultContainer {
            width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 20px; margin-top: 25px;
        }
        .result-box {
            width: 100%; background: linear-gradient(135deg, #f4e8c1 0%, #e6d39e 100%);
            border: 2px solid #8b5a2b; border-radius: 8px; padding: 25px; color: #2c1d0c; text-align: left;
        }
    </style>
</head>
<body>

    <!-- Top Left: Create Website Button -->
    <div class="top-left-nav">
        <button class="nav-btn" onclick="openWebsiteBuilder()">🌐 Create Website</button>
    </div>

    <!-- Top Right: Google Settings / Profile Icon -->
    <div class="top-right-nav">
        <button class="profile-gear-btn" onclick="openProfileSettings()" title="Google Settings / Profile">⚙️</button>
    </div>

    <div class="container" id="mainContainer">
        
        <!-- Search Section -->
        <div class="search-section" id="searchSection" onclick="handleSearch()">
            <div>
                <h1>MEYYEE</h1>
                <div class="subtitle">Universal Truth Engine</div>
            </div>

            <div class="search-box" onclick="handleSearch()">
                <input type="text" id="userInput" class="search-input" placeholder="Search truth" onfocus="handleSearch()" onclick="event.stopPropagation(); handleSearch();">
                <button class="mic-btn" onclick="event.stopPropagation(); startVoiceSearch();" title="Search by Voice">🎤</button>
                <!-- Telescope Icon implemented here -->
                <button class="search-btn" onclick="event.stopPropagation(); handleSearch();" title="Search with Telescope">🔭</button>
            </div>
        </div>

        <!-- Login / Sign-Up Form Section -->
        <div class="auth-container">
            <h3>Account Access</h3>
            <input type="email" id="email" class="auth-input" placeholder="Email address"><br>
            <input type="password" id="password" class="auth-input" placeholder="Password"><br>
            <div class="auth-btn-group">
                <button id="signup-btn" class="btn-auth">Sign Up</button>
                <button id="login-btn" class="btn-auth">Login</button>
            </div>
            <button id="google-btn" class="btn-auth">Sign in with Google</button>
        </div>

        <!-- Welcome Section -->
        <div id="welcomeSection">
            <div class="video-container">
                <video autoplay muted loop playsinline>
                    <source src="myvideo.mp4.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="welcome-text">WELCOME</div>
        </div>

        <!-- All Results Container -->
        <div id="resultContainer"></div>
    </div>

    <!-- Website Builder Modal -->
    <div class="modal-overlay" id="websiteModal">
        <div class="modal-content">
            <h3>🌐 Create Your Own Website (Meyyee Sites)</h3>
            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;">Note: Users do not need to buy a separate domain; websites are hosted instantly under Meyyee subdomains for free!</p>
            <div class="form-group">
                <label>Website Title:</label>
                <input type="text" id="siteTitleInput" placeholder="e.g., My Personal Site">
            </div>
            <div class="form-group">
                <label>Website Content / Description:</label>
                <textarea id="siteContentInput" placeholder="Write details about your website here..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeWebsiteBuilder()">Cancel</button>
                <button class="btn-primary" onclick="generateUserWebsite()">Create My Website</button>
            </div>
        </div>
    </div>

    <!-- Main JavaScript Logic -->
    <script>
        function openWebsiteBuilder() {
            document.getElementById('websiteModal').style.display = 'flex';
        }

        function closeWebsiteBuilder() {
            document.getElementById('websiteModal').style.display = 'none';
        }

        function openProfileSettings() {
            alert("Google Settings & Profile Management opened.");
        }

        function generateUserWebsite() {
            const title = document.getElementById('siteTitleInput').value.trim();
            const content = document.getElementById('siteContentInput').value.trim();
            if (!title || !content) {
                alert("Please fill in both title and content!");
                return;
            }
            alert("Website created successfully via Meyyee Sites!");
            closeWebsiteBuilder();
        }

        function handleSearch() {
            const query = document.getElementById('userInput').value.trim();
            if(query) {
                document.getElementById('resultContainer').innerHTML = `<div class="result-box"><strong>Result for "${query}":</strong> Universal truth processed successfully via telescope search.</div>`;
            }
        }
    </script>
</body>
</html>
